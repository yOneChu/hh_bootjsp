<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공사번호 추출</title>
<link rel="icon" type="image/png" href="/resources/favicon.ico"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"/>
<!--
    공사번호 추출 화면
      화면     : GET  /extract/gongsa
      조회     : POST /extract/gongsa/search    -> { head, titles, data, count } / { error }
      CSV      : POST /extract/gongsa/download  -> text/csv (UTF-8 BOM)
    파라미터 : tableType, startdate, enddate, locale, spec0~9, cond0~9  (GongsaExtractController 참고)
-->
<style>
    :root {
        /* 조건 패널 (엘리베이터 카 조작반) */
        --cop: #1E2A33;
        --cop-raised: #263540;
        --cop-well: #16212A;
        --cop-line: #34444F;
        --cop-text: #E4EBEE;
        --cop-muted: #8FA0AB;

        /* 결과 작업면 */
        --paper: #EEF1F0;
        --surface: #FFFFFF;
        --ink: #17202B;
        --steel: #5B6773;
        --line: #D3D9DB;
        --row-alt: #F6F8F7;
        --row-hover: #E6F1F1;

        /* 신호색 */
        --signal: #0A6E78;
        --signal-bright: #3FB8C2;
        --signal-tint: #DCEEEF;
        --amber: #D08A1E;
        --error: #B3261E;
        --error-tint: #FBE9E7;

        --mono: "JetBrains Mono", Consolas, monospace;
        --sans: "Pretendard Variable", Pretendard, "맑은 고딕", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--paper);
    }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--signal-bright); outline-offset: 2px; }

    .layout { display: flex; height: 100vh; }

    /* ================= 조건 패널 ================= */
    .cop {
        width: 400px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--cop);
        color: var(--cop-text);
        min-height: 0;
    }
    .cop-head { padding: 22px 24px 18px; }
    .cop-head h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
    .cop-head p { margin: 4px 0 0; color: var(--cop-muted); font-size: 13px; }

    .cop-body { flex: 1; overflow: auto; padding: 0 24px 20px; }
    .field { margin-top: 20px; }
    .field-label {
        display: flex; align-items: baseline; justify-content: space-between;
        font-size: 13px; font-weight: 600; color: var(--cop-muted);
        margin-bottom: 8px;
    }
    .field-label small { font-weight: 400; }

    /* 구분 세그먼트 */
    .segment { display: flex; background: var(--cop-well); border-radius: 8px; padding: 3px; }
    .segment label { flex: 1; position: relative; }
    .segment input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .segment span {
        display: block; text-align: center; padding: 7px 0; border-radius: 6px;
        color: var(--cop-muted); font-weight: 600; font-size: 13px;
    }
    .segment input:checked + span { background: var(--cop-raised); color: var(--cop-text); box-shadow: inset 0 0 0 1px var(--cop-line); }
    .segment input:focus-visible + span { outline: 2px solid var(--signal-bright); }

    .cop input[type=text], .cop input[type=date], .cop select {
        width: 100%; height: 34px; padding: 0 10px;
        background: var(--cop-well); border: 1px solid var(--cop-line); border-radius: 6px;
        color: var(--cop-text);
    }
    .cop input::placeholder { color: #5E6F7A; }
    .cop input:focus, .cop select:focus { outline: none; border-color: var(--signal-bright); }
    .cop input[type=date] { color-scheme: dark; }

    .date-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
    .date-row .tilde { color: var(--cop-muted); }
    .presets { display: flex; gap: 6px; margin-top: 8px; }
    .presets button {
        flex: 1; height: 28px; border-radius: 6px; cursor: pointer;
        background: transparent; border: 1px solid var(--cop-line); color: var(--cop-muted); font-size: 12px;
    }
    .presets button:hover { color: var(--cop-text); border-color: var(--cop-muted); }
    .presets button.on { color: var(--cop-text); border-color: var(--signal-bright); }

    /* 영업사양 조건 행 */
    .spec-list { display: flex; flex-direction: column; gap: 8px; }
    .spec-row {
        display: grid;
        grid-template-columns: 1fr 1fr 28px;
        gap: 6px;
        padding: 8px 8px 8px 12px;
        background: var(--cop-raised);
        border-radius: 8px;
        border-left: 3px solid var(--cop-line);
    }
    .spec-row[data-kind=include] { border-left-color: var(--signal-bright); }
    .spec-row[data-kind=exclude] { border-left-color: var(--amber); }
    .spec-row[data-kind=compare] { border-left-color: #9C8CE0; }
    .spec-row input[type=text] { font-family: var(--mono); font-size: 13px; height: 32px; }
    .spec-row .remove {
        width: 28px; height: 32px; border: 0; background: transparent; border-radius: 6px;
        color: var(--cop-muted); cursor: pointer; font-size: 18px; line-height: 1;
    }
    .spec-row .remove:hover { background: var(--cop-well); color: var(--cop-text); }
    .spec-reading {
        grid-column: 1 / -1;
        font-size: 12.5px;
        color: var(--cop-muted);
        min-height: 18px;
    }
    .spec-reading b { color: var(--cop-text); font-weight: 600; font-family: var(--mono); font-size: 12px; }

    .add-spec {
        margin-top: 8px; width: 100%; height: 34px; cursor: pointer;
        background: transparent; color: var(--cop-muted);
        border: 1px dashed var(--cop-line); border-radius: 8px;
    }
    .add-spec:hover:not(:disabled) { color: var(--cop-text); border-color: var(--cop-muted); }
    .add-spec:disabled { opacity: .4; cursor: default; }

    .syntax { margin-top: 12px; font-size: 12.5px; color: var(--cop-muted); }
    .syntax summary { cursor: pointer; }
    .syntax summary:hover { color: var(--cop-text); }
    .syntax dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 10px 0 0; }
    .syntax dt { font-family: var(--mono); color: var(--cop-text); }
    .syntax dd { margin: 0; }

    .cop-foot { padding: 16px 24px 20px; border-top: 1px solid var(--cop-line); }
    .cop-error { color: #F2A49C; font-size: 13px; min-height: 20px; margin-bottom: 8px; }
    .cop-actions { display: flex; gap: 8px; }
    .btn-search {
        flex: 1; height: 42px; border: 0; border-radius: 8px; cursor: pointer;
        background: var(--signal); color: #fff; font-weight: 700; font-size: 15px;
    }
    .btn-search:hover:not(:disabled) { background: #08808B; }
    .btn-search:disabled { opacity: .6; cursor: progress; }
    .btn-reset {
        height: 42px; padding: 0 16px; border-radius: 8px; cursor: pointer;
        background: transparent; border: 1px solid var(--cop-line); color: var(--cop-muted);
    }
    .btn-reset:hover { color: var(--cop-text); }

    /* ================= 결과 ================= */
    .result { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .result-head {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 18px 24px 14px;
    }
    .result-title { margin: 0; font-size: 17px; font-weight: 700; }
    .count { color: var(--steel); font-variant-numeric: tabular-nums; }
    .count strong { color: var(--ink); font-size: 17px; }
    .result-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .filter {
        width: 220px; height: 34px; padding: 0 10px;
        border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    }
    .filter:focus { outline: none; border-color: var(--signal); }
    .btn-csv {
        height: 34px; padding: 0 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--signal); background: var(--surface); color: var(--signal); font-weight: 600;
    }
    .btn-csv:hover:not(:disabled) { background: var(--signal-tint); }
    .btn-csv:disabled { border-color: var(--line); color: var(--steel); opacity: .6; cursor: default; }

    .criteria { padding: 0 24px 12px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--steel); }
    .criteria span { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; }
    .criteria code { font-family: var(--mono); font-size: 12px; color: var(--ink); }

    .table-wrap {
        flex: 1; min-height: 0; overflow: auto; position: relative;
        margin: 0 24px 24px; background: var(--surface);
        border: 1px solid var(--line); border-radius: 8px;
    }
    .progress { position: absolute; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; z-index: 3; display: none; }
    .progress::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 30%;
        background: var(--signal); animation: slide 1.1s ease-in-out infinite;
    }
    .loading .progress { display: block; }
    .loading table { opacity: .45; }
    @keyframes slide { from { left: -30%; } to { left: 100%; } }

    table.grid { border-collapse: separate; border-spacing: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .grid th, .grid td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    .grid thead th {
        position: sticky; top: 0; z-index: 2;
        background: #F2F4F4; font-size: 13px; font-weight: 600; color: var(--steel);
        cursor: pointer; user-select: none;
    }
    .grid thead th:hover { color: var(--ink); }
    .grid thead th.spec { background: var(--signal-tint); color: var(--signal); }
    .grid thead th .code { display: block; font-family: var(--mono); font-size: 11px; font-weight: 400; opacity: .75; }
    .grid thead th[aria-sort=ascending]::after { content: " ▲"; font-size: 10px; }
    .grid thead th[aria-sort=descending]::after { content: " ▼"; font-size: 10px; }
    .grid thead th .fill { display: block; font-size: 11px; font-weight: 400; color: var(--steel); }
    .grid td.spec { background: rgba(10, 110, 120, .04); }
    .grid td.blank { color: #B5BEC4; }
    .grid tbody tr:nth-child(even) td { background-color: var(--row-alt); }
    .grid tbody tr:hover td { background-color: var(--row-hover); }
    /* 공사번호 컬럼 고정 */
    .grid th:first-child, .grid td:first-child {
        position: sticky; left: 0; z-index: 1;
        font-family: var(--mono); font-size: 13px; font-weight: 600;
        border-right: 1px solid var(--line);
    }
    .grid td:first-child { background: var(--surface); }
    .grid thead th:first-child { z-index: 3; font-family: var(--sans); }
    .grid .rownum { color: #A3ADB4; font-weight: 400; width: 1%; }

    .state { padding: 72px 24px; max-width: 520px; color: var(--steel); }
    .state h2 { margin: 0 0 6px; font-size: 16px; color: var(--ink); }
    .state p { margin: 0; }
    .state.error h2 { color: var(--error); }
    .state.error pre {
        margin: 12px 0 0; padding: 10px 12px; background: var(--error-tint); border-radius: 6px;
        font-family: var(--mono); font-size: 12px; color: var(--error); white-space: pre-wrap; word-break: break-all;
    }

    @media (max-width: 900px) {
        .layout { flex-direction: column; height: auto; }
        .cop { width: 100%; }
        .result { min-height: 70vh; }
        .result-head, .criteria { padding-left: 16px; padding-right: 16px; }
        .table-wrap { margin: 0 16px 16px; min-height: 60vh; }
        .result-tools { margin-left: 0; width: 100%; }
        .filter { flex: 1; width: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
        .progress::after { animation: none; left: 0; width: 100%; opacity: .6; }
    }
</style>
</head>
<body>
<div class="layout">

    <!-- ===== 조건 패널 ===== -->
    <form class="cop" id="searchForm" autocomplete="off">
        <div class="cop-head">
            <h1>공사번호 추출</h1>
            <p>영업사양 조건에 맞는 공사번호를 찾습니다.</p>
        </div>

        <div class="cop-body">
            <div class="field">
                <div class="field-label">구분</div>
                <div class="segment" role="radiogroup" aria-label="구분">
                    <label><input type="radio" name="tableType" value="elv" checked><span>엘리베이터</span></label>
                    <label><input type="radio" name="tableType" value="shipelv"><span>선박용 엘리베이터</span></label>
                </div>
            </div>

            <div class="field">
                <div class="field-label"><label for="startdate">등록일</label></div>
                <div class="date-row">
                    <input type="date" id="startdate" name="startdate" max="9999-12-31" aria-label="등록일 시작">
                    <span class="tilde">~</span>
                    <input type="date" id="enddate" name="enddate" max="9999-12-31" aria-label="등록일 종료">
                </div>
                <div class="presets" id="presets">
                    <button type="button" data-months="1">1개월</button>
                    <button type="button" data-months="3">3개월</button>
                    <button type="button" data-months="6">6개월</button>
                    <button type="button" data-months="12">1년</button>
                </div>
            </div>

            <div class="field">
                <div class="field-label">영업사양 <small id="specCount"></small></div>
                <div class="spec-list" id="specList"></div>
                <button type="button" class="add-spec" id="addSpec">+ 조건 추가</button>

                <details class="syntax">
                    <summary>값 CODE 입력 방법</summary>
                    <dl>
                        <dt>(비움)</dt><dd>조건 없이 컬럼만 표시</dd>
                        <dt>A</dt><dd>A 와 같음</dd>
                        <dt>=A</dt><dd>A 와 같음</dd>
                        <dt>,A,B</dt><dd>A 또는 B 포함</dd>
                        <dt>?A?</dt><dd>A 포함</dd>
                        <dt>!A,B</dt><dd>A, B 를 포함하지 않음 (빈 값 포함)</dd>
                        <dt>&gt;10,&lt;20</dt><dd>숫자만 뽑아 비교, 쉼표는 그리고</dd>
                        <dt>N</dt><dd>N 이거나 빈 값</dd>
                        <dt>!N</dt><dd>N 도 빈 값도 아님</dd>
                        <dt>*</dt><dd>빈 값</dd>
                    </dl>
                </details>
            </div>

            <div class="field">
                <div class="field-label"><label for="locale">컬럼 제목 언어</label></div>
                <select id="locale" name="locale">
                    <option value="ko" selected>한국어</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="cop-foot">
            <div class="cop-error" id="formError" role="alert"></div>
            <div class="cop-actions">
                <button type="button" class="btn-reset" id="resetBtn">초기화</button>
                <button type="submit" class="btn-search" id="searchBtn">검색</button>
            </div>
        </div>
    </form>

    <!-- ===== 결과 ===== -->
    <main class="result">
        <div class="result-head">
            <h2 class="result-title">검색 결과</h2>
            <span class="count" id="count"></span>
            <div class="result-tools">
                <input type="search" class="filter" id="filter" placeholder="결과 안에서 찾기" disabled aria-label="결과 안에서 찾기">
                <button type="button" class="btn-csv" id="csvBtn" disabled>CSV 다운로드</button>
            </div>
        </div>
        <div class="criteria" id="criteria"></div>
        <div class="table-wrap" id="tableWrap">
            <div class="progress"></div>
            <div id="tableBody">
                <div class="state">
                    <h2>조건을 정하고 검색하세요</h2>
                    <p>등록일은 꼭 넣어야 합니다. 영업사양 특성 CODE 를 넣으면 그 값이 결과 컬럼으로 함께 나옵니다.</p>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- th:inline="none" : 정규식 /[()?]/ 의 '[(' 를 Thymeleaf 인라인 표현식으로 해석하지 않도록 -->
<script th:inline="none">
    var SPEC_MAX = 10;                       // GongSaExtractParam.MAX_SPEC_COUNT
    var URL_SEARCH = "/extract/gongsa/search";
    var URL_DOWNLOAD = "/extract/gongsa/download";
    var STORE_KEY = "gongsaExtract.lastParam";

    var lastParam = null;                    // 마지막으로 조회한 조건 (CSV 다운로드에 사용)
    var rows = [];                           // 조회 결과 data (원본 순서)
    var titles = [], head = [], specCols = {};
    var specFilled = {};                     // 영업사양 컬럼 index -> 값이 있는 행 수
    var sortState = { col: -1, dir: 0 };

    var $ = function (id) { return document.getElementById(id); };

    /* =========================================================
       영업사양 조건 행
       ========================================================= */

    function addSpecRow(spec, cond) {
        var list = $("specList");
        if (list.children.length >= SPEC_MAX) return;

        var row = document.createElement("div");
        row.className = "spec-row";
        row.innerHTML =
              "<input type='text' class='spec' placeholder='특성 CODE' aria-label='특성 CODE' spellcheck='false'>"
            + "<input type='text' class='cond' placeholder='값 CODE' aria-label='값 CODE' spellcheck='false'>"
            + "<button type='button' class='remove' aria-label='조건 삭제' title='조건 삭제'>&times;</button>"
            + "<div class='spec-reading' aria-live='polite'></div>";
        row.querySelector(".spec").value = spec || "";
        row.querySelector(".cond").value = cond || "";
        list.appendChild(row);

        row.addEventListener("input", function () { updateReading(row); });
        row.querySelector(".remove").addEventListener("click", function () {
            row.remove();
            if ($("specList").children.length === 0) addSpecRow();
            updateSpecCount();
        });
        updateReading(row);
        updateSpecCount();
        return row;
    }

    function updateSpecCount() {
        var n = $("specList").children.length;
        $("specCount").textContent = n + " / " + SPEC_MAX;
        $("addSpec").disabled = n >= SPEC_MAX;
    }

    /** 값 CODE 를 사람이 읽는 문장으로 (SpecConditionBuilder.build 와 같은 규칙) */
    function readCond(cond) {
        if (cond === "") return { kind: "none", text: "조건 없이 컬럼만 표시" };
        if (cond === "N") return { kind: "include", text: "<b>N</b> 이거나 빈 값" };
        if (cond === "!N") return { kind: "exclude", text: "<b>N</b> 도 빈 값도 아님" };

        var c = cond.charAt(0);
        if (c === ",") return { kind: "include", text: joinOr(tokens(cond.substring(1), /[()?]/g)) + " 포함" };
        if (c === "!") return { kind: "exclude", text: joinList(tokens(cond.substring(1), /[()?]/g)) + " 를 포함하지 않음 (빈 값 포함)" };
        if (c === ">" || c === "<") {
            var parts = cond.split(",").filter(Boolean).map(function (p) { return "<b>" + esc(p) + "</b>"; });
            return { kind: "compare", text: "숫자만 뽑아 " + parts.join(" 그리고 ") };
        }
        if (c === "?") return { kind: "include", text: joinOr(tokens(cond, /\?/g)) + " 포함" };
        if (c === "=") return { kind: "include", text: "<b>" + esc(cond.replace(/=/g, "")) + "</b> 와 같음" };
        if (c === "*") return { kind: "exclude", text: "빈 값" };
        return { kind: "include", text: "<b>" + esc(cond.replace(/,/g, "")) + "</b> 와 같음" };
    }

    function tokens(s, strip) {
        return s.replace(strip, "").split(",").filter(function (t) { return t !== ""; });
    }
    function joinOr(list)   { return list.length ? list.map(bold).join(" 또는 ") : "(값 없음)"; }
    function joinList(list) { return list.length ? list.map(bold).join(", ") : "(값 없음)"; }
    function bold(t) { return "<b>" + esc(t) + "</b>"; }

    function updateReading(row) {
        var spec = row.querySelector(".spec").value.trim();
        var cond = row.querySelector(".cond").value.trim();
        var reading = row.querySelector(".spec-reading");

        if (spec === "") {
            row.dataset.kind = "none";
            reading.innerHTML = cond === "" ? "" : "특성 CODE 를 넣어야 조건이 적용됩니다.";
            return;
        }
        var r = readCond(cond);
        row.dataset.kind = r.kind;
        reading.innerHTML = r.text;
    }

    /* =========================================================
       조건 수집 / 검증
       ========================================================= */

    function getParam() {
        var param = {
            tableType: document.querySelector("input[name=tableType]:checked").value,
            startdate: $("startdate").value,
            enddate:   $("enddate").value,
            locale:    $("locale").value,
            specs: []
        };
        Array.prototype.forEach.call($("specList").children, function (row) {
            var spec = row.querySelector(".spec").value.trim();
            var cond = row.querySelector(".cond").value.trim();
            if (spec !== "") param.specs.push({ spec: spec, cond: cond });
        });
        return param;
    }

    /** 컨트롤러 파라미터 (spec0~9 / cond0~9) */
    function toFormData(param) {
        var fd = new URLSearchParams();
        fd.append("tableType", param.tableType);
        fd.append("startdate", param.startdate);
        fd.append("enddate", param.enddate);
        fd.append("locale", param.locale);
        param.specs.forEach(function (sc, i) {
            fd.append("spec" + i, sc.spec);
            fd.append("cond" + i, sc.cond);
        });
        return fd;
    }

    function validate(p) {
        if (!p.startdate || !p.enddate) return "등록일 시작과 종료를 모두 넣으세요.";
        if (p.startdate > p.enddate) return "등록일 시작이 종료보다 늦습니다. 날짜를 바꿔 주세요.";
        return null;
    }

    /* =========================================================
       조회
       ========================================================= */

    function search() {
        var param = getParam();
        var err = validate(param);
        $("formError").textContent = err || "";
        if (err) return;

        saveParam(param);
        setLoading(true);

        fetch(URL_SEARCH, { method: "POST", body: toFormData(param) })
            .then(function (res) {
                return res.json().catch(function () {
                    throw new Error("서버 응답을 읽지 못했습니다. (HTTP " + res.status + ")");
                }).then(function (json) {
                    if (!res.ok) throw new Error(json.error || ("HTTP " + res.status));
                    return json;
                });
            })
            .then(function (json) {
                lastParam = param;
                renderResult(json, param);
            })
            .catch(function (e) {
                lastParam = null;
                renderError(e.message || String(e));
            })
            .then(function () { setLoading(false); });
    }

    function setLoading(on) {
        $("searchBtn").disabled = on;
        $("searchBtn").textContent = on ? "검색 중…" : "검색";
        $("tableWrap").classList.toggle("loading", on);
        if (on) $("csvBtn").disabled = true;
    }

    /* =========================================================
       결과 표시
       ========================================================= */

    function renderResult(json, param) {
        head = json.head || [];
        titles = json.titles || head;
        rows = json.data || [];
        sortState = { col: -1, dir: 0 };

        // 영업사양 컬럼 표시용
        specCols = {};
        param.specs.forEach(function (sc) { specCols[sc.spec.toUpperCase()] = true; });

        // 영업사양 값이 비어 있는 공사번호가 있으므로 컬럼별로 값이 있는 행 수를 표시
        specFilled = {};
        head.forEach(function (h, i) {
            if (!specCols[h]) return;
            specFilled[i] = rows.filter(function (r) { return r[i] != null && String(r[i]).trim() !== ""; }).length;
        });

        renderCriteria(param);
        $("filter").value = "";
        $("filter").disabled = rows.length === 0;
        $("csvBtn").disabled = rows.length === 0;

        if (rows.length === 0) {
            $("count").innerHTML = "<strong>0</strong>건";
            $("tableBody").innerHTML =
                "<div class='state'><h2>조건에 맞는 공사번호가 없습니다</h2>"
              + "<p>등록일 범위를 넓히거나 값 CODE 조건을 줄여 보세요.</p></div>";
            return;
        }
        renderTable();
    }

    function renderTable() {
        var q = $("filter").value.trim().toLowerCase();
        var view = rows;
        if (q) {
            view = rows.filter(function (r) {
                for (var i = 0; i < r.length; i++) {
                    if (r[i] != null && String(r[i]).toLowerCase().indexOf(q) >= 0) return true;
                }
                return false;
            });
        }
        if (sortState.col >= 0) {
            var c = sortState.col, d = sortState.dir;
            view = view.slice().sort(function (a, b) {
                return d * String(a[c] == null ? "" : a[c]).localeCompare(String(b[c] == null ? "" : b[c]), "ko", { numeric: true });
            });
        }

        $("count").innerHTML = q
            ? "<strong>" + num(view.length) + "</strong>건 / 전체 " + num(rows.length) + "건"
            : "<strong>" + num(rows.length) + "</strong>건";

        var h = ["<table class='grid'><thead><tr>"];
        titles.forEach(function (t, i) {
            var isSpec = specCols[head[i]];
            var sort = sortState.col === i ? (sortState.dir > 0 ? "ascending" : "descending") : "none";
            h.push("<th data-col='" + i + "' aria-sort='" + sort + "'" + (isSpec ? " class='spec'" : "") + ">"
                 + esc(t) + (isSpec && t !== head[i] ? "<span class='code'>" + esc(head[i]) + "</span>" : "")
                 + (isSpec ? "<span class='fill'>값 있음 " + num(specFilled[i]) + " / " + num(rows.length) + "건</span>" : "")
                 + "</th>");
        });
        h.push("</tr></thead><tbody>");
        view.forEach(function (r) {
            h.push("<tr>");
            for (var i = 0; i < r.length; i++) {
                var v = r[i] == null ? "" : String(r[i]);
                if (specCols[head[i]]) {
                    h.push(v.trim() === ""
                        ? "<td class='spec blank' title='등록된 값 없음'>–</td>"
                        : "<td class='spec'>" + esc(v) + "</td>");
                } else {
                    h.push("<td>" + esc(v) + "</td>");
                }
            }
            h.push("</tr>");
        });
        h.push("</tbody></table>");
        if (view.length === 0) {
            h.push("<div class='state'><h2>'" + esc(q) + "' 가 들어간 행이 없습니다</h2><p>다른 단어로 찾아보세요.</p></div>");
        }
        $("tableBody").innerHTML = h.join("");
    }

    function renderCriteria(p) {
        var parts = [
            p.tableType === "shipelv" ? "선박용 엘리베이터" : "엘리베이터",
            p.startdate + " ~ " + p.enddate
        ];
        var html = parts.map(function (s) { return "<span>" + esc(s) + "</span>"; }).join("");
        p.specs.forEach(function (sc) {
            html += "<span><code>" + esc(sc.spec) + "</code>" + (sc.cond ? " <code>" + esc(sc.cond) + "</code>" : "") + "</span>";
        });
        $("criteria").innerHTML = html;
    }

    function renderError(msg) {
        $("count").textContent = "";
        $("criteria").innerHTML = "";
        $("filter").disabled = true;
        $("tableBody").innerHTML =
            "<div class='state error'><h2>검색하지 못했습니다</h2>"
          + "<p>조건을 확인한 뒤 다시 검색하세요. 같은 오류가 반복되면 아래 내용을 담당자에게 전달해 주세요.</p>"
          + "<pre>" + esc(msg) + "</pre></div>";
    }

    /* =========================================================
       CSV 다운로드 (서버 GongSaCsvWriter)
       ========================================================= */

    function downloadCsv() {
        if (!lastParam) return;
        var btn = $("csvBtn");
        btn.disabled = true;
        btn.textContent = "만드는 중…";

        fetch(URL_DOWNLOAD, { method: "POST", body: toFormData(lastParam) })
            .then(function (res) {
                if (!res.ok) throw new Error("CSV 를 만들지 못했습니다. (HTTP " + res.status + ")");
                var name = fileNameOf(res.headers.get("Content-Disposition")) || "공사번호추출.csv";
                return res.blob().then(function (blob) { saveBlob(blob, name); });
            })
            .catch(function (e) { alert(e.message || String(e)); })
            .then(function () {
                btn.disabled = false;
                btn.textContent = "CSV 다운로드";
            });
    }

    function fileNameOf(cd) {
        if (!cd) return null;
        var m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
        try { return m ? decodeURIComponent(m[1]) : null; } catch (e) { return m[1]; }
    }

    function saveBlob(blob, name) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }

    /* =========================================================
       날짜 / 저장 / 초기화
       ========================================================= */

    function setPreset(months) {
        var end = new Date();
        var start = new Date();
        start.setMonth(start.getMonth() - months);
        $("startdate").value = toDateStr(start);
        $("enddate").value = toDateStr(end);
        markPreset(months);
    }

    function markPreset(months) {
        Array.prototype.forEach.call($("presets").children, function (b) {
            b.classList.toggle("on", String(months) === b.dataset.months);
        });
    }

    function saveParam(p) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) { /* 저장 불가 무시 */ }
    }

    function loadParam() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; }
    }

    function resetForm() {
        document.querySelector("input[name=tableType][value=elv]").checked = true;
        $("locale").value = "ko";
        $("specList").innerHTML = "";
        addSpecRow();
        setPreset(3);
        $("formError").textContent = "";
    }

    function init() {
        $("searchForm").addEventListener("submit", function (e) { e.preventDefault(); search(); });
        $("resetBtn").addEventListener("click", resetForm);
        $("addSpec").addEventListener("click", function () {
            var row = addSpecRow();
            if (row) row.querySelector(".spec").focus();
        });
        $("presets").addEventListener("click", function (e) {
            if (e.target.dataset.months) setPreset(Number(e.target.dataset.months));
        });
        $("startdate").addEventListener("change", function () { markPreset(null); });
        $("enddate").addEventListener("change", function () { markPreset(null); });
        $("filter").addEventListener("input", renderTable);
        $("csvBtn").addEventListener("click", downloadCsv);
        $("tableBody").addEventListener("click", function (e) {
            var th = e.target.closest("th[data-col]");
            if (!th) return;
            var col = Number(th.dataset.col);
            sortState = sortState.col === col
                ? { col: col, dir: sortState.dir === 1 ? -1 : sortState.dir === -1 ? 0 : 1 }
                : { col: col, dir: 1 };
            if (sortState.dir === 0) sortState.col = -1;
            renderTable();
        });

        // 마지막 조회 조건 복원 (날짜는 매번 최근 3개월로 시작)
        var saved = loadParam();
        if (saved) {
            var radio = document.querySelector("input[name=tableType][value=" + saved.tableType + "]");
            if (radio) radio.checked = true;
            if (saved.locale) $("locale").value = saved.locale;
            (saved.specs || []).forEach(function (sc) { addSpecRow(sc.spec, sc.cond); });
        }
        if ($("specList").children.length === 0) addSpecRow();
        setPreset(3);
    }

    /* =========================================================
       유틸
       ========================================================= */

    function toDateStr(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function num(n) { return n.toLocaleString("ko-KR"); }
    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    init();
</script>
</body>
</html>
