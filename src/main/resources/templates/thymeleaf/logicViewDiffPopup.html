<script>
    // 1. 비교할 컬럼명 배열 생성 (spec01~20, con01~20)
    let compareColumns = [];
    for(let i = 1; i <= 17; i++) {
        compareColumns.push(`spec${String(i).padStart(2, '0')}`);
        compareColumns.push(`con${String(i).padStart(2, '0')}`);
    }

    // 테이블 헤더 동적 렌더링
    const headerRow = document.getElementById('table-header');
    compareColumns.forEach(col => {
        const th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold border-b border-r border-gray-300 text-slate-500 text-xs';
        th.textContent = col.toUpperCase();
        headerRow.appendChild(th);
    });

    //KEY-VAL
    compareColumns = [];
    for(let i = 1; i <= 15; i++) {
        compareColumns.push(`KEY${String(i).padStart(2, '0')}`);
        compareColumns.push(`VAL${String(i).padStart(2, '0')}`);
    }
    compareColumns.forEach(col => {
        const th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold border-b border-r border-gray-300 text-slate-500 text-xs';
        th.textContent = col.toUpperCase();
        headerRow.appendChild(th);
    });

    //GOTO-REMARKS
    compareColumns = [];
    compareColumns.push(`GOTO`);
    compareColumns.push(`REMARK`);
    compareColumns.push(`NO`);
    compareColumns.forEach(col => {
        const th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold border-b border-r border-gray-300 text-slate-500 text-xs';
        th.textContent = col.toUpperCase();
        headerRow.appendChild(th);
    });

    const tbody = document.getElementById('bom-tbody');


    // 빈 속성 채워주기
    const fillEmptyColumns = (item) => {
        const newItem = { ...item };
        compareColumns.forEach(col => { if(!newItem[col]) newItem[col] = '-'; });
        return newItem;
    };

</script>
