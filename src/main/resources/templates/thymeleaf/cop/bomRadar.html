<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>이상감지 관제 · SENTINEL</title>
    <link rel="icon" type="image/png" href="/resources/favicon.ico"/>
    <!--
        SENTINEL 6F · 이상감지 관제 (CopMainController : GET /cop/radar)

        데이터 : GET /cop/radar/anomalies  (BomAnomalyService.scan — 지금은 데모 데이터, 응답 형식은 서비스 주석 참고)

        레이더 읽는 법
          - 4개 구역 = 이상 유형 (수량 급증 / 자재 누락 / 사양 불일치 / 중복 수배)
          - 중심에 가까울수록 위험도가 높음 (안쪽 원 80, 가운데 50, 바깥 20)
          - 점을 누르거나 오른쪽 대기열에서 고르면 상세 근거가 열림
        조치 상태(확인/완료/오탐)는 지금은 이 브라우저에만 저장된다 (localStorage).
    -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>

    <style>
        /* ════════════ 토큰 (메인 화면과 같은 값) ════════════ */
        :root {
            --void:    #04060A;
            --deep:    #080B12;
            --panel:   #0C1018;
            --panel-2: #111723;
            --panel-3: #161D2B;
            --line:    rgba(255,255,255,.08);
            --line-2:  rgba(255,255,255,.15);

            --ink:   #F4F6FA;
            --ink-2: #AEB6C4;
            --ink-3: #7C8596;

            --scan:   #7FE3FF;  --scan-dim:  rgba(127,227,255,.13);
            --alert:  #FF5A36;  --alert-dim: rgba(255,90,54,.15);
            --warn:   #FFB020;  --warn-dim:  rgba(255,176,32,.14);
            --ok:     #5EF0A6;  --ok-dim:    rgba(94,240,166,.13);

            --mono: "D2Coding", Consolas, "SF Mono", Menlo, monospace;
            --sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            --ease-out: cubic-bezier(.16,1,.3,1);
            --nav-h: 64px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; background: var(--void); }
        body { margin: 0; min-height: 100vh; font-family: var(--sans); color: var(--ink); background: var(--void); word-break: keep-all; overflow-wrap: anywhere; }
        h1, h2, h3, h4, p { margin: 0; }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; }
        [hidden] { display: none !important; }
        :focus-visible { outline: 2px solid var(--scan); outline-offset: 2px; border-radius: 6px; }
        .mono { font-family: var(--mono); }
        .tnum { font-variant-numeric: tabular-nums; }
        .wrap { width: 100%; max-width: 1760px; margin: 0 auto; padding: 0 16px; }
        @media (min-width: 900px) { .wrap { padding: 0 28px; } }

        .demo { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-2); font: 700 10px/1.4 var(--mono); letter-spacing: .12em; color: var(--ink-3); }

        /* ════════════ 상단 바 ════════════ */
        .nav { position: sticky; top: 0; z-index: 40; background: rgba(4,6,10,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
        .nav-in { height: var(--nav-h); display: flex; align-items: center; gap: 16px; }
        .brand { display: flex; align-items: center; gap: 12px; flex: none; }
        .brand-mark { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--scan); }
        .brand-mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: 50%; height: 1.5px; background: var(--scan); transform-origin: 0 50%; animation: spin 3s linear infinite; }
        .brand b { font: 800 14px/1 var(--sans); letter-spacing: .3em; }
        .crumb { display: none; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
        .crumb .floor { font: 700 13px/1 var(--mono); color: var(--alert); text-shadow: 0 0 10px rgba(255,90,54,.55); padding: 5px 8px; border-radius: 6px; background: #000; border: 1px solid var(--line-2); }
        .crumb b { color: var(--ink); font-weight: 750; }
        @media (min-width: 720px) { .crumb { display: flex; } }
        .nav-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .scan-at { display: none; font: 500 12px/1.3 var(--mono); color: var(--ink-3); text-align: right; }
        .scan-at b { display: block; color: var(--ink-2); font-weight: 600; }
        @media (min-width: 1000px) { .scan-at { display: block; } }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap;
            transition: background .2s, border-color .2s, transform .2s var(--ease-out), opacity .2s;
        }
        .btn:hover:not(:disabled) { background: rgba(255,255,255,.06); border-color: var(--ink-3); }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-solid { background: var(--ink); color: var(--void); border-color: var(--ink); }
        .btn-solid:hover:not(:disabled) { background: #fff; box-shadow: 0 8px 22px -8px rgba(127,227,255,.6); }
        .btn-alert { background: var(--alert); border-color: var(--alert); color: #120200; }
        .btn-alert:hover:not(:disabled) { background: #FF7356; border-color: #FF7356; }
        .btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
        .btn .spin { animation: spin .8s linear infinite; }

        /* ════════════ KPI ════════════ */
        .kpis { margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        @media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.4fr); } }
        .kpi { padding: 14px 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
        .kpi dt { font: 600 11px/1.3 var(--mono); letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .kpi dd { margin: 8px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
        .kpi dd small { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
        .kpi.is-alert dd { color: var(--alert); }
        .kpi.is-alert { border-color: rgba(255,90,54,.28); background: linear-gradient(180deg, rgba(255,90,54,.07), var(--panel) 70%); }
        .kpi.is-trend { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; }
        @media (min-width: 900px) { .kpi.is-trend { grid-column: auto; } }
        .kpi.is-trend svg { flex: 1; min-width: 0; height: 52px; }
        .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--alert); animation: livepulse 1.6s infinite; }
        @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(255,90,54,.55); } 70% { box-shadow: 0 0 0 8px rgba(255,90,54,0); } 100% { box-shadow: 0 0 0 0 rgba(255,90,54,0); } }

        /* ════════════ 작업 영역 ════════════ */
        .ws { margin: 16px 0 28px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr);
              grid-template-areas: "radar" "queue" "detail"; }
        @media (min-width: 1000px) {
            .ws { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "radar detail" "queue queue"; }
        }
        @media (min-width: 1440px) {
            .ws {
                grid-template-columns: minmax(440px, .95fr) minmax(0, 1.2fr) minmax(380px, .85fr);
                grid-template-areas: "radar queue detail";
                height: calc(100vh - var(--nav-h) - 170px); min-height: 660px;
            }
            .ws > .card { min-height: 0; }
        }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; flex-wrap: wrap; }
        .card-head h2 { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
        .card-head .sub { font-size: 12.5px; color: var(--ink-3); }
        .count-pill { font: 700 12px/1 var(--mono); padding: 5px 9px; border-radius: 999px; background: var(--alert-dim); color: var(--alert); }

        /* ── 레이더 ── */
        .radar-card { grid-area: radar; }
        .radar-box { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px 12px; }
        .radar-sq { position: relative; width: 100%; max-width: 640px; aspect-ratio: 1 / 1; }
        /* 화면 높이에 맞추는 배치에서는 가로·세로 중 짧은 쪽에 맞춘 정사각형 */
        @media (min-width: 1440px) {
            .radar-box { container-type: size; }
            .radar-sq { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); max-width: none; aspect-ratio: auto; }
        }
        #radar { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
        #radar.hovering { cursor: pointer; }
        .tip {
            position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, calc(-100% - 14px));
            padding: 8px 11px; border-radius: 10px; background: rgba(4,6,10,.92); border: 1px solid var(--line-2);
            font-size: 12.5px; white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,.5);
        }
        .tip b { font-family: var(--mono); margin-right: 6px; }
        .legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 18px 16px; }
        @media (min-width: 640px) { .legend { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        .chip {
            display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 12px; cursor: pointer;
            background: var(--panel-2); border: 1px solid var(--line); text-align: left;
            transition: border-color .2s, background .2s, opacity .2s;
        }
        .chip:hover { border-color: var(--line-2); }
        .chip[aria-pressed="false"] { opacity: .42; }
        .chip .q { font: 700 11px/1 var(--mono); color: var(--ink-3); }
        .chip .n { margin-left: auto; font: 700 13px/1 var(--mono); color: var(--ink-2); }
        .chip span.t { font-size: 13px; font-weight: 700; white-space: nowrap; }
        .radar-note { padding: 0 18px 14px; font-size: 12px; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; }
        .radar-note i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

        /* ── 대기열 ── */
        .queue-card { grid-area: queue; }
        .q-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
        .search { position: relative; flex: 1 1 200px; min-width: 0; }
        .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
        .search input {
            width: 100%; min-height: 40px; padding: 0 12px 0 36px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel-2);
            color: var(--ink); font: 14px var(--sans);
        }
        .search input::placeholder { color: var(--ink-3); }
        .search input:focus { outline: none; border-color: var(--scan); box-shadow: 0 0 0 3px var(--scan-dim); }
        .seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line); }
        .seg button { min-height: 32px; padding: 0 11px; border: none; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; font-weight: 650; color: var(--ink-2); white-space: nowrap; }
        .seg button[aria-pressed="true"] { background: var(--panel-3); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; }
        .sel { min-height: 40px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: 13.5px var(--sans); cursor: pointer; }

        .q-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; min-height: 0; max-height: 640px; }
        @media (min-width: 1440px) { .q-list { max-height: none; } }
        .q-list::-webkit-scrollbar { width: 8px; } .q-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 8px; }
        .row {
            width: 100%; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center;
            padding: 11px 12px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left;
            transition: background .15s, border-color .15s;
        }
        .row:hover { background: rgba(255,255,255,.035); }
        .row[aria-selected="true"] { background: var(--panel-3); border-color: var(--line-2); }
        .row.is-closed { opacity: .5; }
        .sev { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .sev b { font: 800 19px/1 var(--mono); }
        .sev i { font-style: normal; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
        .lv-crit b { color: var(--alert); } .lv-crit i { background: var(--alert-dim); color: var(--alert); }
        .lv-warn b { color: var(--warn); }  .lv-warn i { background: var(--warn-dim); color: var(--warn); }
        .lv-low b  { color: var(--scan); }  .lv-low i  { background: var(--scan-dim); color: var(--scan); }
        .row-main { min-width: 0; }
        .row-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .row-top .no { font: 700 14px/1.2 var(--mono); }
        .row-top .site { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-msg { margin-top: 5px; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .row-side time { font: 500 11.5px/1 var(--mono); color: var(--ink-3); white-space: nowrap; }
        .tbadge { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--panel-3); color: var(--ink-2); white-space: nowrap; border: 1px solid var(--line); }
        .st { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
        .st-NEW { color: var(--alert); background: var(--alert-dim); }
        .st-ACK { color: var(--warn); background: var(--warn-dim); }
        .st-DONE { color: var(--ok); background: var(--ok-dim); }
        .st-IGNORED { color: var(--ink-3); background: rgba(255,255,255,.06); }
        .q-empty { padding: 48px 20px; text-align: center; color: var(--ink-3); font-size: 14px; line-height: 1.6; }

        /* ── 상세 ── */
        .detail-card { grid-area: detail; }
        .detail-body { padding: 18px; overflow-y: auto; flex: 1; min-height: 0; }
        .d-empty { height: 100%; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; color: var(--ink-3); font-size: 14px; line-height: 1.6; }
        .d-empty svg { color: var(--ink-3); opacity: .6; }
        .d-head { display: flex; gap: 16px; align-items: flex-start; }
        .d-score {
            flex: none; width: 84px; height: 84px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,255,255,.07) 0); position: relative;
        }
        .d-score::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--panel); }
        .d-score b, .d-score small { position: relative; }
        .d-score b { font: 800 26px/1 var(--mono); color: var(--c); }
        .d-score small { margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--c); }
        .d-title { min-width: 0; flex: 1; }
        .d-title .no { font: 800 22px/1.2 var(--mono); letter-spacing: -.01em; }
        .d-title .site { margin-top: 4px; font-size: 13px; color: var(--ink-3); }
        .d-title .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        .d-msg { margin-top: 18px; font-size: 16px; font-weight: 700; line-height: 1.5; }
        .d-sec { margin-top: 20px; }
        .d-sec h3 { font: 700 11px/1 var(--mono); letter-spacing: .16em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 10px; }
        .evi { border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); padding: 12px 12px 8px; }
        .evi svg { display: block; width: 100%; height: auto; overflow: visible; }
        .evi-cap { font-size: 12px; color: var(--ink-3); padding: 2px 4px 4px; }
        .pair { display: grid; grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr); align-items: stretch; gap: 0; }
        .pair > div { padding: 12px; border-radius: 12px; background: var(--panel-3); border: 1px solid var(--line); min-width: 0; }
        .pair > div:last-child { border-color: rgba(255,90,54,.45); background: var(--alert-dim); }
        .pair small { display: block; font-size: 11.5px; color: var(--ink-3); }
        .pair b { display: block; margin-top: 6px; font: 700 14px/1.4 var(--mono); }
        .pair > div:last-child b { color: #FFD0C4; }
        .pair .neq { display: flex; align-items: center; justify-content: center; color: var(--alert); font: 800 20px/1 var(--mono); }
        .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; border-radius: 12px; overflow: hidden; background: var(--line); border: 1px solid var(--line); }
        .meta div { background: var(--panel); padding: 10px 12px; min-width: 0; }
        .meta dt { font-size: 11.5px; color: var(--ink-3); }
        .meta dd { margin: 4px 0 0; font: 600 13.5px/1.35 var(--mono); }
        .suggest { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--scan-dim); color: #D4F6FF; font-size: 14px; line-height: 1.55; }
        .suggest svg { flex: none; margin-top: 2px; color: var(--scan); }
        .d-actions { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .d-actions .btn { min-height: 44px; border-radius: 12px; }
        .d-actions .wide { grid-column: 1 / -1; }
        .d-note { margin-top: 10px; font-size: 11.5px; color: var(--ink-3); }

        .toast {
            position: fixed; left: 50%; bottom: 26px; z-index: 80; transform: translate(-50%, 16px);
            display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 14px;
            background: var(--ink); color: var(--void); font-weight: 700; font-size: 14px; max-width: calc(100vw - 32px);
            opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; box-shadow: 0 16px 40px rgba(0,0,0,.5);
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
        .toast button { border: none; background: rgba(0,0,0,.08); color: var(--void); font-weight: 800; padding: 7px 12px; border-radius: 9px; cursor: pointer; }
        .toast button:hover { background: rgba(0,0,0,.15); }

        .scanning #radar { filter: drop-shadow(0 0 18px rgba(127,227,255,.25)); }

        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

<!-- ═══════════ 상단 바 ═══════════ -->
<header class="nav">
    <div class="wrap nav-in">
        <a class="brand" href="/cop/main" aria-label="SENTINEL 메인으로">
            <span class="brand-mark" aria-hidden="true"></span><b>SENTINEL</b>
        </a>
        <div class="crumb" aria-label="현재 위치">
            <span aria-hidden="true" style="color:var(--line-2)">/</span>
            <span class="floor">6F</span><b>이상감지 관제</b>
        </div>
        <div class="nav-tools">
            <span class="scan-at">마지막 스캔<b id="scanAt" class="tnum">—</b></span>
            <span class="demo" id="demoBadge" hidden>DEMO</span>
            <button type="button" class="btn btn-sm" id="btnScan">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                재스캔
            </button>
            <a class="btn btn-sm" href="/cop/main">메인</a>
        </div>
    </div>
</header>

<main class="wrap">

    <!-- ═══════════ KPI ═══════════ -->
    <dl class="kpis" aria-label="관제 요약">
        <div class="kpi"><dt>감시 중인 호기</dt><dd class="tnum"><span id="kMonitored">—</span><small>호기</small></dd></div>
        <div class="kpi is-alert"><dt><span class="dot-live" aria-hidden="true"></span>미조치 이상</dt><dd class="tnum"><span id="kOpen">—</span><small>건</small></dd></div>
        <div class="kpi"><dt>위험 (80+)</dt><dd class="tnum"><span id="kCrit">—</span><small>건</small></dd></div>
        <div class="kpi"><dt>조치 완료율</dt><dd class="tnum"><span id="kDone">—</span><small>%</small></dd></div>
        <div class="kpi is-trend">
            <div style="flex:none"><dt>14일 탐지 추이</dt><dd class="tnum" style="font-size:22px"><span id="kTrendLast">—</span><small>건 / 오늘</small></dd></div>
            <svg id="trend" viewBox="0 0 280 52" preserveAspectRatio="none" role="img" aria-label="최근 14일 탐지 건수 추이"></svg>
        </div>
    </dl>

    <!-- ═══════════ 작업 영역 ═══════════ -->
    <div class="ws">

        <!-- 레이더 -->
        <section class="card radar-card" aria-labelledby="radarTitle">
            <div class="card-head">
                <h2 id="radarTitle">이상 레이더</h2>
                <span class="sub">중심에 가까울수록 위험합니다</span>
            </div>
            <div class="radar-box" id="radarBox">
                <div class="radar-sq">
                    <canvas id="radar" role="img" aria-label="이상 BOM 레이더. 네 구역은 이상 유형이고, 중심에 가까울수록 위험도가 높습니다. 같은 내용을 이상 대기열 목록에서 볼 수 있습니다."></canvas>
                    <div class="tip" id="tip" hidden></div>
                </div>
            </div>
            <div class="legend" id="legend" role="group" aria-label="유형 필터"></div>
            <div class="radar-note" aria-hidden="true">
                <span><i style="background:var(--alert)"></i>위험 80+</span>
                <span><i style="background:var(--warn)"></i>경고 50–79</span>
                <span><i style="background:var(--scan)"></i>주의 ~49</span>
                <span><i style="border:1.5px solid var(--ink-3)"></i>조치됨</span>
            </div>
        </section>

        <!-- 대기열 -->
        <section class="card queue-card" aria-labelledby="queueTitle">
            <div class="card-head">
                <h2 id="queueTitle">이상 대기열</h2>
                <span class="count-pill tnum" id="qCount">0</span>
                <span class="sub" style="margin-left:auto">↑↓ 키로 이동</span>
            </div>
            <div class="q-tools">
                <label class="search">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input id="q" type="search" placeholder="호기번호 · 자재 · 현장 검색" aria-label="이상 검색" autocomplete="off">
                </label>
                <div class="seg" role="group" aria-label="상태">
                    <button type="button" data-st="open" aria-pressed="true">미조치</button>
                    <button type="button" data-st="all" aria-pressed="false">전체</button>
                    <button type="button" data-st="closed" aria-pressed="false">조치됨</button>
                </div>
                <select class="sel" id="sort" aria-label="정렬">
                    <option value="sev">위험도순</option>
                    <option value="time">최신순</option>
                </select>
            </div>
            <ul class="q-list" id="list" role="listbox" aria-labelledby="queueTitle"></ul>
        </section>

        <!-- 상세 -->
        <section class="card detail-card" aria-labelledby="detailTitle" aria-live="polite">
            <div class="card-head">
                <h2 id="detailTitle">상세 근거</h2>
                <span class="sub" id="detailSub"></span>
            </div>
            <div class="detail-body" id="detail">
                <div class="d-empty">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12 18 6"/></svg>
                    <span>레이더의 점이나 대기열 항목을 고르면<br>이상 판정 근거가 여기에 표시됩니다.</span>
                </div>
            </div>
        </section>
    </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>되돌리기</button></div>

<script th:inline="none">
(function () {
    "use strict";

    var URL_DATA = "/cop/radar/anomalies";
    var URL_ONECYCLE = "/cop/bom";
    var URL_DIFF = "/cop/diff";
    var URL_TRACE = "/cop/trace";
    var STATUS_KEY = "sentinel.anomalyStatus";       // { id: status } — 이 브라우저에만 저장 (서버 연동 전)

    var TYPES = {
        QTY:     { name: "수량 급증",   q: "Q1", a0: -Math.PI / 2 },
        MISSING: { name: "자재 누락",   q: "Q2", a0: 0 },
        SPEC:    { name: "사양 불일치", q: "Q3", a0: Math.PI / 2 },
        DUP:     { name: "중복 수배",   q: "Q4", a0: Math.PI }
    };
    var TYPE_KEYS = ["QTY", "MISSING", "SPEC", "DUP"];
    var STATUS_NAME = { NEW: "신규", ACK: "확인 중", DONE: "조치 완료", IGNORED: "오탐" };
    var COLORS = { crit: "#FF5A36", warn: "#FFB020", low: "#7FE3FF" };

    var $ = function (id) { return document.getElementById(id); };
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var data = null, all = [], view = [];
    var filter = { types: { QTY: true, MISSING: true, SPEC: true, DUP: true }, st: "open", q: "", sort: "sev" };
    var selectedId = null;

    /* =========================================================
       데이터
       ========================================================= */
    function load(isRescan) {
        var btn = $("btnScan");
        btn.disabled = true;
        btn.querySelector("svg").classList.add("spin");
        if (isRescan) boostSweep();
        return fetch(URL_DATA, { credentials: "same-origin" })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (res) {
                data = res;
                var saved = loadStatus();
                all = (res.anomalies || []).map(function (a) {
                    if (saved[a.id]) a.status = saved[a.id];
                    a.angle = TYPES[a.type].a0 + (0.12 + hash(a.id) * 0.76) * (Math.PI / 2);
                    return a;
                });
                $("demoBadge").hidden = !res.demo;
                $("scanAt").textContent = (res.generatedAt || "").slice(11) || "—";
                renderKpis();
                renderLegend();
                apply();
                if (!selectedId && view.length) select(view[0].id, false);
                if (isRescan) toast("스캔 완료 · 미조치 " + all.filter(isOpen).length + "건");
            })
            .catch(function () {
                $("list").innerHTML = '<li class="q-empty">이상 데이터를 불러오지 못했습니다.<br>잠시 후 재스캔을 눌러 주세요.</li>';
            })
            .then(function () {
                btn.disabled = false;
                btn.querySelector("svg").classList.remove("spin");
            });
    }

    function loadStatus() { try { return JSON.parse(localStorage.getItem(STATUS_KEY) || "{}"); } catch (e) { return {}; } }
    function saveStatus(id, st) { try { var s = loadStatus(); s[id] = st; localStorage.setItem(STATUS_KEY, JSON.stringify(s)); } catch (e) { /* 무시 */ } }

    function isOpen(a) { return a.status === "NEW" || a.status === "ACK"; }
    function level(sev) { return sev >= 80 ? "crit" : sev >= 50 ? "warn" : "low"; }
    function levelName(sev) { return sev >= 80 ? "위험" : sev >= 50 ? "경고" : "주의"; }

    /* =========================================================
       필터 / 목록
       ========================================================= */
    function apply() {
        var q = filter.q.toLowerCase();
        view = all.filter(function (a) {
            if (!filter.types[a.type]) return false;
            if (filter.st === "open" && !isOpen(a)) return false;
            if (filter.st === "closed" && isOpen(a)) return false;
            if (q && (a.productNo + " " + a.partNo + " " + a.partName + " " + a.site + " " + a.message).toLowerCase().indexOf(q) < 0) return false;
            return true;
        });
        view.sort(filter.sort === "sev"
            ? function (a, b) { return b.severity - a.severity || (a.detectedAt < b.detectedAt ? 1 : -1); }
            : function (a, b) { return a.detectedAt < b.detectedAt ? 1 : -1; });
        renderList();
    }

    function renderList() {
        $("qCount").textContent = view.length;
        if (!view.length) {
            $("list").innerHTML = '<li class="q-empty">조건에 맞는 이상이 없습니다.<br>필터를 바꾸거나 검색어를 지워 보세요.</li>';
            return;
        }
        $("list").innerHTML = view.map(function (a) {
            var lv = level(a.severity);
            return '<li><button type="button" class="row' + (isOpen(a) ? "" : " is-closed") + '" role="option" data-id="' + a.id + '" aria-selected="' + (a.id === selectedId) + '">' +
                '<span class="sev lv-' + lv + '"><b class="tnum">' + a.severity + '</b><i>' + levelName(a.severity) + '</i></span>' +
                '<span class="row-main">' +
                    '<span class="row-top"><span class="no">' + esc(a.productNo) + '</span><span class="site">' + esc(a.site) + '</span></span>' +
                    '<span class="row-msg" style="display:block">' + esc(a.message) + '</span>' +
                '</span>' +
                '<span class="row-side"><span class="tbadge">' + TYPES[a.type].name + '</span>' +
                    '<span class="st st-' + a.status + '">' + STATUS_NAME[a.status] + '</span>' +
                    '<time>' + a.detectedAt.slice(5, 16) + '</time></span>' +
            '</button></li>';
        }).join("");
    }

    $("list").addEventListener("click", function (e) {
        var row = e.target.closest(".row");
        if (row) select(row.dataset.id, false);
    });
    $("list").addEventListener("keydown", function (e) {
        if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
        e.preventDefault();
        var i = view.findIndex(function (a) { return a.id === selectedId; });
        i = Math.max(0, Math.min(view.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
        if (view[i]) select(view[i].id, true);
    });

    $("q").addEventListener("input", function () { filter.q = this.value.trim(); apply(); });
    document.querySelectorAll(".seg button").forEach(function (b) {
        b.addEventListener("click", function () {
            document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
            filter.st = b.dataset.st;
            apply();
        });
    });
    $("sort").addEventListener("change", function () { filter.sort = this.value; apply(); });

    function renderLegend() {
        $("legend").innerHTML = TYPE_KEYS.map(function (k) {
            var n = all.filter(function (a) { return a.type === k && isOpen(a); }).length;
            return '<button type="button" class="chip" data-type="' + k + '" aria-pressed="' + filter.types[k] + '">' +
                '<span class="t">' + TYPES[k].name + '</span><span class="n tnum">' + n + '</span></button>';
        }).join("");
        $("legend").querySelectorAll(".chip").forEach(function (c) {
            c.addEventListener("click", function () {
                var k = c.dataset.type;
                filter.types[k] = !filter.types[k];
                c.setAttribute("aria-pressed", filter.types[k]);
                apply();
            });
        });
    }

    /* =========================================================
       KPI / 추이
       ========================================================= */
    function renderKpis() {
        var open = all.filter(isOpen);
        var closed = all.length - open.length;
        $("kMonitored").textContent = (data.monitored || 0).toLocaleString("ko-KR");
        $("kOpen").textContent = open.length;
        $("kCrit").textContent = open.filter(function (a) { return a.severity >= 80; }).length;
        $("kDone").textContent = all.length ? Math.round(closed / all.length * 100) : 0;

        var t = data.trend || [];
        $("kTrendLast").textContent = t.length ? t[t.length - 1] : "—";
        if (!t.length) return;
        var max = Math.max.apply(null, t) * 1.15, w = 280, h = 52;
        var pts = t.map(function (v, i) { return [i / (t.length - 1) * w, h - (v / max) * (h - 6) - 2]; });
        var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
        var last = pts[pts.length - 1];
        $("trend").innerHTML =
            '<defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF5A36" stop-opacity=".35"/><stop offset="1" stop-color="#FF5A36" stop-opacity="0"/></linearGradient></defs>' +
            '<path d="' + line + ' L' + w + ' ' + h + ' L0 ' + h + ' Z" fill="url(#tg)"/>' +
            '<path d="' + line + '" fill="none" stroke="#FF5A36" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
            '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="#FF5A36"/>';
    }

    /* =========================================================
       상세
       ========================================================= */
    function find(id) { return all.filter(function (a) { return a.id === id; })[0]; }

    function select(id, focusRow) {
        selectedId = id;
        document.querySelectorAll(".row").forEach(function (r) { r.setAttribute("aria-selected", r.dataset.id === id); });
        var row = $("list").querySelector('.row[data-id="' + id + '"]');
        if (row) { row.scrollIntoView({ block: "nearest" }); if (focusRow) row.focus(); }
        renderDetail();
    }

    function renderDetail() {
        var a = find(selectedId);
        if (!a) return;
        var lv = level(a.severity), c = COLORS[lv];
        $("detailSub").textContent = a.id;
        $("detail").innerHTML =
            '<div class="d-head">' +
                '<div class="d-score" style="--p:' + a.severity + ';--c:' + c + '"><b class="tnum">' + a.severity + '</b><small>' + levelName(a.severity) + '</small></div>' +
                '<div class="d-title">' +
                    '<div class="no">' + esc(a.productNo) + '</div>' +
                    '<div class="site">' + esc(a.site) + '</div>' +
                    '<div class="tags"><span class="tbadge">' + TYPES[a.type].name + '</span><span class="st st-' + a.status + '">' + STATUS_NAME[a.status] + '</span></div>' +
                '</div>' +
            '</div>' +
            '<p class="d-msg">' + esc(a.message) + '</p>' +
            '<div class="d-sec"><h3>판정 근거</h3>' + evidence(a) + '</div>' +
            '<div class="d-sec"><h3>대상</h3><dl class="meta">' +
                '<div><dt>자재</dt><dd>' + esc(a.partName) + '</dd></div>' +
                '<div><dt>품번</dt><dd>' + esc(a.partNo) + '</dd></div>' +
                '<div><dt>비교한 동일 사양</dt><dd>' + a.peers + ' 호기</dd></div>' +
                '<div><dt>탐지 시각</dt><dd>' + a.detectedAt.slice(5, 16) + '</dd></div>' +
            '</dl></div>' +
            '<div class="d-sec"><h3>권장 조치</h3><div class="suggest">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>' +
                '<span>' + esc(a.suggestion) + '</span></div></div>' +
            '<div class="d-actions">' +
                // 탐지 → 비교(4F) → 원인(3F) → 재계산(5F) 순서
                '<a class="btn" href="' + URL_DIFF + '?b=' + encodeURIComponent(a.productNo) + '">' +
                    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>' +
                    'BOM 비교</a>' +
                '<a class="btn" href="' + URL_TRACE + '?id=' + encodeURIComponent(a.id) + '&no=' + encodeURIComponent(a.productNo) + '&part=' + encodeURIComponent(a.partNo) + '">' +
                    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H14a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 8h5.5"/></svg>' +
                    '원인 추적</a>' +
                '<a class="btn btn-alert wide" href="' + URL_ONECYCLE + '?productNo=' + encodeURIComponent(a.productNo) + '">' +
                    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>' +
                    '원사이클로 재계산</a>' +
                (a.status === "NEW" ? '<button type="button" class="btn" data-act="ACK">확인 중으로</button>' : '') +
                (isOpen(a)
                    ? '<button type="button" class="btn" data-act="DONE">조치 완료</button><button type="button" class="btn' + (a.status === "NEW" ? " wide" : "") + '" data-act="IGNORED">오탐 처리</button>'
                    : '<button type="button" class="btn wide" data-act="NEW">다시 열기</button>') +
            '</div>' +
            '<p class="d-note">조치 상태는 현재 이 브라우저에만 저장됩니다.</p>';

        $("detail").querySelectorAll("[data-act]").forEach(function (b) {
            b.addEventListener("click", function () { setStatus(a, b.dataset.act); });
        });
    }

    function setStatus(a, st) {
        var prev = a.status;
        a.status = st;
        saveStatus(a.id, st);
        renderKpis(); renderLegend(); apply(); renderDetail();
        toast(a.productNo + " · " + STATUS_NAME[st], function () {
            a.status = prev; saveStatus(a.id, prev);
            renderKpis(); renderLegend(); apply(); renderDetail();
        });
    }

    /** 판정 근거 그림 : dist = 동일 사양 호기 분포 위 이 호기 위치 / pair = 기대 ≠ 실제 */
    function evidence(a) {
        var e = a.evidence || {};
        if (e.kind === "pair") {
            return '<div class="pair">' +
                '<div><small>' + esc(e.leftLabel) + '</small><b>' + esc(e.leftValue) + '</b></div>' +
                '<span class="neq" aria-label="일치하지 않음">≠</span>' +
                '<div><small>' + esc(e.rightLabel) + '</small><b>' + esc(e.rightValue) + '</b></div></div>';
        }
        var vals = e.values || [], W = 360, H = 118, padL = 10, padR = 10, axisY = 74;
        var max = Math.max.apply(null, vals.concat([e.actual, e.expected, 1])) * 1.08;
        var x = function (v) { return padL + (v / max) * (W - padL - padR); };
        var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
        var dots = vals.map(function (v, i) {
            var jy = axisY - 6 - (hash(a.id + i) * 22);
            return '<circle cx="' + x(v).toFixed(1) + '" cy="' + jy.toFixed(1) + '" r="3.4" fill="#7FE3FF" fill-opacity=".55"/>';
        }).join("");
        var ax = x(e.actual), ex = x(e.expected);
        var labelAnchor = ax > W * 0.7 ? "end" : ax < W * 0.2 ? "start" : "middle";
        var expAnchor = ex > W * 0.8 ? "end" : ex < W * 0.15 ? "start" : "middle";
        return '<div class="evi"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="동일 사양 ' + vals.length + '호기 분포와 이 호기 비교. 기대값 ' + e.expected + e.unit + ', 이 호기 ' + e.actual + e.unit + '">' +
            '<rect x="' + x(lo).toFixed(1) + '" y="' + (axisY - 34) + '" width="' + Math.max(2, x(hi) - x(lo)).toFixed(1) + '" height="36" rx="6" fill="rgba(127,227,255,.07)"/>' +
            '<line x1="' + padL + '" y1="' + axisY + '" x2="' + (W - padR) + '" y2="' + axisY + '" stroke="rgba(255,255,255,.18)"/>' +
            dots +
            '<line x1="' + ex.toFixed(1) + '" y1="' + (axisY - 40) + '" x2="' + ex.toFixed(1) + '" y2="' + (axisY + 4) + '" stroke="#AEB6C4" stroke-dasharray="3 3"/>' +
            '<text x="' + ex.toFixed(1) + '" y="' + (axisY - 46) + '" text-anchor="' + expAnchor + '" fill="#AEB6C4" font-size="11" font-family="Consolas, monospace">기대 ' + e.expected + e.unit + '</text>' +
            '<circle cx="' + ax.toFixed(1) + '" cy="' + axisY + '" r="11" fill="rgba(255,90,54,.18)"/>' +
            '<circle cx="' + ax.toFixed(1) + '" cy="' + axisY + '" r="6" fill="#FF5A36"/>' +
            '<text x="' + ax.toFixed(1) + '" y="' + (axisY + 30) + '" text-anchor="' + labelAnchor + '" fill="#FF8A6E" font-size="12.5" font-weight="700" font-family="Consolas, monospace">이 호기 ' + e.actual + e.unit + '</text>' +
            '</svg><p class="evi-cap">파란 점 = 동일 사양 ' + vals.length + '호기 · 띠 = 정상 범위</p></div>';
    }

    /* =========================================================
       레이더
       ========================================================= */
    var canvas = $("radar"), ctx = canvas.getContext("2d");
    var W = 0, H = 0, CX = 0, CY = 0, R = 0;
    var sweep = -Math.PI / 2, speed = 0.7, boostUntil = 0;
    var TRAIL = Math.PI * 0.7;
    var hoverId = null;
    var noise = [];
    (function () {
        var s = 7;
        function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
        for (var i = 0; i < 170; i++) noise.push({ r: 0.55 + r() * 0.42, a: r() * Math.PI * 2 });
    })();

    function radiusOf(sev) { return R * (0.06 + (1 - sev / 100) * 0.9); }
    function posOf(a) { var rr = radiusOf(a.severity); return { x: CX + Math.cos(a.angle) * rr, y: CY + Math.sin(a.angle) * rr }; }

    function resize() {
        var rect = canvas.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width; H = rect.height;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        CX = W / 2; CY = H / 2; R = Math.min(W, H) / 2 - 26;
    }

    function angDist(a, b) { var d = (b - a) % (Math.PI * 2); return d < 0 ? d + Math.PI * 2 : d; }

    function drawFrame(t) {
        ctx.clearRect(0, 0, W, H);
        if (R <= 0) return;

        // 위험 구역 (80+)
        var g = ctx.createRadialGradient(CX, CY, 0, CX, CY, radiusOf(80));
        g.addColorStop(0, "rgba(255,90,54,.16)"); g.addColorStop(1, "rgba(255,90,54,.03)");
        ctx.beginPath(); ctx.arc(CX, CY, radiusOf(80), 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();

        // 위험도 원 + 라벨
        [[80, "rgba(255,90,54,.45)", "80"], [50, "rgba(255,176,32,.3)", "50"], [20, "rgba(127,227,255,.2)", "20"], [0, "rgba(127,227,255,.32)", ""]].forEach(function (r) {
            ctx.beginPath(); ctx.arc(CX, CY, radiusOf(r[0]), 0, Math.PI * 2);
            ctx.strokeStyle = r[1]; ctx.lineWidth = 1; ctx.setLineDash(r[0] && r[0] !== 0 ? [3, 5] : []); ctx.stroke();
            ctx.setLineDash([]);
            if (r[2]) {
                ctx.fillStyle = r[1].replace(/[\d.]+\)$/, ".9)");
                ctx.font = "600 10px Consolas, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
                ctx.fillText(r[2], CX + 4, CY - radiusOf(r[0]) - 7);
            }
        });

        // 구역 경계 + 이름
        TYPE_KEYS.forEach(function (k) {
            var a0 = TYPES[k].a0;
            ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX + Math.cos(a0) * R, CY + Math.sin(a0) * R);
            ctx.strokeStyle = "rgba(127,227,255,.14)"; ctx.lineWidth = 1; ctx.stroke();
            var mid = a0 + Math.PI / 4, lr = R + 2;
            ctx.save();
            ctx.globalAlpha = filter.types[k] ? 1 : .35;
            ctx.fillStyle = "#AEB6C4"; ctx.font = "700 12px 'Pretendard Variable', sans-serif";
            ctx.textAlign = Math.cos(mid) > 0 ? "right" : "left"; ctx.textBaseline = Math.sin(mid) > 0 ? "bottom" : "top";
            ctx.fillText(TYPES[k].name, CX + Math.cos(mid) * lr * 0.98, CY + Math.sin(mid) * lr * 0.98);
            ctx.restore();
        });

        // 스윕
        if (ctx.createConicGradient) {
            var cg = ctx.createConicGradient(sweep - TRAIL, CX, CY), stop = TRAIL / (Math.PI * 2);
            cg.addColorStop(0, "rgba(127,227,255,0)"); cg.addColorStop(stop, "rgba(127,227,255,.22)"); cg.addColorStop(Math.min(1, stop + 0.0001), "rgba(127,227,255,0)");
            ctx.beginPath(); ctx.moveTo(CX, CY); ctx.arc(CX, CY, R, sweep - TRAIL, sweep); ctx.closePath(); ctx.fillStyle = cg; ctx.fill();
        }
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX + Math.cos(sweep) * R, CY + Math.sin(sweep) * R);
        ctx.strokeStyle = "rgba(127,227,255,.85)"; ctx.lineWidth = 1.4; ctx.stroke();

        // 배경 (정상 BOM)
        noise.forEach(function (n) {
            var glow = Math.max(0, 1 - angDist(n.a, sweep) / TRAIL);
            ctx.beginPath(); ctx.arc(CX + Math.cos(n.a) * n.r * R, CY + Math.sin(n.a) * n.r * R, 1.3, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(127,227,255," + (0.1 + glow * 0.5).toFixed(3) + ")"; ctx.fill();
        });

        // 이상 BOM
        var visible = {};
        view.forEach(function (a) { visible[a.id] = true; });
        all.forEach(function (a) {
            var p = posOf(a), lv = level(a.severity), col = COLORS[lv];
            var shown = !!visible[a.id];
            var glow = Math.max(0, 1 - angDist(a.angle, sweep) / TRAIL);
            ctx.save();
            ctx.globalAlpha = shown ? 1 : 0.12;
            if (!isOpen(a)) {
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(124,133,150,.9)"; ctx.lineWidth = 1.4; ctx.stroke();
            } else {
                var size = lv === "crit" ? 5.5 : lv === "warn" ? 4.5 : 3.6;
                if (lv === "crit" && shown) {
                    var pulse = ((t / 1000) + hash(a.id)) % 1.8 / 1.8;
                    ctx.beginPath(); ctx.arc(p.x, p.y, size + pulse * 16, 0, Math.PI * 2);
                    ctx.strokeStyle = "rgba(255,90,54," + (0.5 * (1 - pulse)).toFixed(3) + ")"; ctx.lineWidth = 1.2; ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(p.x, p.y, size + glow * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6 + glow * 14; ctx.fill();
            }
            ctx.restore();
        });

        // 선택 / 마우스 올린 점
        [selectedId, hoverId].forEach(function (id, k) {
            var a = id && find(id);
            if (!a) return;
            var p = posOf(a);
            ctx.beginPath(); ctx.arc(p.x, p.y, k === 0 ? 13 : 10, 0, Math.PI * 2);
            ctx.strokeStyle = k === 0 ? "#F4F6FA" : "rgba(244,246,250,.5)"; ctx.lineWidth = 1.6; ctx.stroke();
            if (k === 0) {
                ctx.beginPath();
                ctx.moveTo(p.x - 22, p.y); ctx.lineTo(p.x - 15, p.y); ctx.moveTo(p.x + 15, p.y); ctx.lineTo(p.x + 22, p.y);
                ctx.moveTo(p.x, p.y - 22); ctx.lineTo(p.x, p.y - 15); ctx.moveTo(p.x, p.y + 15); ctx.lineTo(p.x, p.y + 22);
                ctx.stroke();
            }
        });
    }

    var last = 0;
    function loop(t) {
        var dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
        last = t;
        sweep += dt * (t < boostUntil ? 5 : speed);
        drawFrame(t);
        requestAnimationFrame(loop);
    }
    function boostSweep() {
        boostUntil = performance.now() + 1400;
        document.body.classList.add("scanning");
        setTimeout(function () { document.body.classList.remove("scanning"); }, 1400);
    }

    function hitTest(mx, my) {
        var best = null, bd = 14 * 14;
        view.forEach(function (a) {
            var p = posOf(a), d = (p.x - mx) * (p.x - mx) + (p.y - my) * (p.y - my);
            if (d < bd) { bd = d; best = a; }
        });
        return best;
    }
    canvas.addEventListener("mousemove", function (e) {
        var r = canvas.getBoundingClientRect(), a = hitTest(e.clientX - r.left, e.clientY - r.top);
        hoverId = a ? a.id : null;
        canvas.classList.toggle("hovering", !!a);
        var tip = $("tip");
        if (!a) { tip.hidden = true; if (reduceMotion) drawFrame(0); return; }
        var p = posOf(a);
        tip.innerHTML = '<b>' + esc(a.productNo) + '</b>' + TYPES[a.type].name + ' · ' + levelName(a.severity) + ' ' + a.severity;
        tip.style.left = p.x + "px"; tip.style.top = p.y + "px";
        tip.hidden = false;
        if (reduceMotion) drawFrame(0);
    });
    canvas.addEventListener("mouseleave", function () { hoverId = null; $("tip").hidden = true; });
    canvas.addEventListener("click", function (e) {
        var r = canvas.getBoundingClientRect(), a = hitTest(e.clientX - r.left, e.clientY - r.top);
        if (a) select(a.id, false);
    });

    /* =========================================================
       공통
       ========================================================= */
    var toastTimer = null, undoFn = null;
    function toast(msg, undo) {
        $("toastMsg").textContent = msg;
        undoFn = undo || null;
        $("toastUndo").hidden = !undo;
        $("toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, undo ? 5000 : 2600);
    }
    $("toastUndo").addEventListener("click", function () {
        if (undoFn) undoFn();
        undoFn = null;
        $("toast").classList.remove("show");
    });

    function hash(s) {   // 문자열 → 0~1 (항상 같은 값)
        var h = 2166136261;
        s = String(s);
        for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return ((h >>> 0) % 10000) / 10000;
    }
    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    $("btnScan").addEventListener("click", function () { load(true); });

    resize();
    window.addEventListener("resize", function () { resize(); if (reduceMotion) drawFrame(0); });
    if (window.ResizeObserver) new ResizeObserver(function () { resize(); if (reduceMotion) drawFrame(0); }).observe(canvas);

    load(false).then(function () {
        if (reduceMotion) { drawFrame(0); }
        else requestAnimationFrame(loop);
    });
    // 정지 모드에서는 목록/필터가 바뀔 때마다 다시 그림
    if (reduceMotion) {
        var _apply = apply;
        apply = function () { _apply(); drawFrame(0); };
    }
})();
</script>
</body>
</html>
