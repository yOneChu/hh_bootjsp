<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>이상 원인 추적 · SENTINEL</title>
    <link rel="icon" type="image/png" href="/resources/favicon.ico"/>
    <!--
        SENTINEL 3F · 이상 원인 추적 (CopMainController : GET /cop/trace)

        이상 자재에서 출발해 BOM 전개 → 수배 로직 → 영업사양 → 변경 이력 순으로 거꾸로 따라가며
        원인이 되는 단계(root)를 짚어준다.

        주소
          /cop/trace                          : 발표 대표 사례 (TEST-632560 브라켓 120EA)
          /cop/trace?id=A1012                 : 관제 화면의 이상 ID (관제 데이터 /cop/radar/anomalies 에서 찾음)
          /cop/trace?no=호기번호&part=품번      : BOM 비교 화면에서 넘어올 때

        데이터 : 지금은 샘플 (loadTrace). 실제 연동 시 loadTrace 만 서버 호출로 바꾸면 된다.
                 반환 형식은 아래 SHOWCASE 객체 참고 (steps[].viz 종류 : bars / path / formula / dist / timeline / pair / match)
    -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>

    <style>
        /* ════════════ 토큰 (SENTINEL 공통) ════════════ */
        :root {
            --void:    #04060A;
            --panel:   #0C1018;
            --panel-2: #111723;
            --panel-3: #161D2B;
            --line:    rgba(255,255,255,.08);
            --line-2:  rgba(255,255,255,.15);

            --ink:   #F4F6FA;
            --ink-2: #AEB6C4;
            --ink-3: #7C8596;

            --scan:   #7FE3FF;  --scan-dim:  rgba(127,227,255,.13);
            --alert:  #FF5A36;  --alert-dim: rgba(255,90,54,.15);
            --warn:   #FFB020;  --warn-dim:  rgba(255,176,32,.14);
            --ok:     #5EF0A6;  --ok-dim:    rgba(94,240,166,.13);
            --chg:    #B79CFF;

            --mono: "D2Coding", Consolas, "SF Mono", Menlo, monospace;
            --sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            --ease-out: cubic-bezier(.16,1,.3,1);
            --nav-h: 64px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; background: var(--void); }
        body { margin: 0; min-height: 100vh; font-family: var(--sans); color: var(--ink); background: var(--void); word-break: keep-all; overflow-wrap: anywhere; }
        h1, h2, h3, h4, p { margin: 0; }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; }
        [hidden] { display: none !important; }
        :focus-visible { outline: 2px solid var(--scan); outline-offset: 2px; border-radius: 6px; }
        .mono { font-family: var(--mono); }
        .tnum { font-variant-numeric: tabular-nums; }
        .wrap { width: 100%; max-width: 1560px; margin: 0 auto; padding: 0 16px; }
        @media (min-width: 900px) { .wrap { padding: 0 28px; } }
        .demo { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-2); font: 700 10px/1.4 var(--mono); letter-spacing: .12em; color: var(--ink-3); }

        /* ════════════ 상단 바 ════════════ */
        .nav { position: sticky; top: 0; z-index: 40; background: rgba(4,6,10,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
        .nav-in { height: var(--nav-h); display: flex; align-items: center; gap: 16px; }
        .brand { display: flex; align-items: center; gap: 12px; flex: none; }
        .brand-mark { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--scan); }
        .brand-mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: 50%; height: 1.5px; background: var(--scan); transform-origin: 0 50%; animation: spin 3s linear infinite; }
        .brand b { font: 800 14px/1 var(--sans); letter-spacing: .3em; }
        .crumb { display: none; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
        .crumb .floor { font: 700 13px/1 var(--mono); color: var(--alert); text-shadow: 0 0 10px rgba(255,90,54,.55); padding: 5px 8px; border-radius: 6px; background: #000; border: 1px solid var(--line-2); }
        .crumb b { color: var(--ink); font-weight: 750; }
        @media (min-width: 720px) { .crumb { display: flex; } }
        .nav-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap;
            transition: background .2s, border-color .2s, transform .2s var(--ease-out), opacity .2s;
        }
        .btn:hover:not(:disabled) { background: rgba(255,255,255,.06); border-color: var(--ink-3); }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
        .btn-alert { background: var(--alert); border-color: var(--alert); color: #120200; }
        .btn-alert:hover:not(:disabled) { background: #FF7356; border-color: #FF7356; }

        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; min-width: 0; }

        /* ════════════ 판정 (상단) ════════════ */
        .verdict {
            position: relative; overflow: hidden; margin-top: 18px; padding: 26px 24px;
            display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr);
            background:
                radial-gradient(700px 260px at 100% 0%, rgba(255,90,54,.16), transparent 60%),
                linear-gradient(180deg, var(--panel-2), var(--panel));
            border-color: rgba(255,90,54,.28);
        }
        @media (min-width: 1100px) { .verdict { grid-template-columns: minmax(0, 1fr) auto; align-items: end; padding: 30px 32px; } }
        .v-kicker { display: inline-flex; align-items: center; gap: 10px; font: 700 12px/1 var(--mono); letter-spacing: .2em; color: var(--alert); }
        .v-kicker i { width: 8px; height: 8px; border-radius: 50%; background: var(--alert); box-shadow: 0 0 12px var(--alert); }
        .verdict h1 { margin-top: 14px; font-size: clamp(24px, 2.6vw, 36px); font-weight: 850; letter-spacing: -.025em; line-height: 1.25; max-width: 980px; }
        .verdict h1 em { font-style: normal; color: var(--alert); font-family: var(--mono); }
        .v-sub { margin-top: 12px; max-width: 860px; font-size: 15.5px; line-height: 1.7; color: var(--ink-2); }
        .v-tags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 9px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
        .tag b { color: var(--ink); font-family: var(--mono); font-weight: 700; }
        .tag.hot { background: var(--alert-dim); border-color: rgba(255,90,54,.35); color: #FFC5B8; }
        .tag.hot b { color: var(--alert); }
        .v-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .v-actions .btn { min-height: 46px; border-radius: 13px; }

        /* ════════════ 본문 ════════════ */
        .body { margin: 16px 0 32px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
        @media (min-width: 1200px) { .body { grid-template-columns: minmax(0, 1fr) 380px; } }
        .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 20px 0; }
        .card-head h2 { font-size: 16px; font-weight: 800; }
        .card-head .sub { font-size: 12.5px; color: var(--ink-3); }

        /* 역추적 경로 */
        .chain { list-style: none; margin: 0; padding: 18px 20px 22px; }
        .step { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; }
        .rail { position: relative; display: flex; flex-direction: column; align-items: center; }
        .dot {
            position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: var(--panel-2); border: 1.5px solid var(--line-2); color: var(--ink-2);
            transition: border-color .4s, color .4s, background .4s, box-shadow .4s;
        }
        .wire { position: relative; flex: 1; width: 2px; margin: 6px 0; background: rgba(255,255,255,.08); border-radius: 1px; overflow: hidden; min-height: 24px; }
        .wire i { position: absolute; inset: 0; background: linear-gradient(180deg, var(--scan), rgba(127,227,255,.4)); transform: scaleY(0); transform-origin: top; transition: transform .5s var(--ease-out); }
        .step:last-child .wire { display: none; }
        .up { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: var(--panel); display: none; }

        .box {
            margin-bottom: 18px; padding: 16px 18px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--line);
            opacity: .25; transform: translateY(6px); transition: opacity .5s var(--ease-out), transform .5s var(--ease-out), border-color .4s, box-shadow .4s;
        }
        .step:last-child .box { margin-bottom: 0; }
        .box-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
        .box-kicker { font: 700 11px/1 var(--mono); letter-spacing: .16em; color: var(--ink-3); text-transform: uppercase; }
        .box h3 { width: 100%; margin-top: 4px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.4; }
        .root-badge { display: none; align-items: center; gap: 6px; margin-left: auto; padding: 4px 9px; border-radius: 7px; background: var(--alert); color: #120200; font-size: 12px; font-weight: 800; }
        .q { margin-top: 2px; font-size: 13px; color: var(--ink-3); }
        .kv { margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; border-radius: 12px; overflow: hidden; background: var(--line); border: 1px solid var(--line); }
        .kv div { background: var(--panel); padding: 9px 12px; min-width: 0; }
        .kv dt { font-size: 11.5px; color: var(--ink-3); }
        .kv dd { margin: 4px 0 0; font: 600 13.5px/1.35 var(--mono); }
        .kv dd.hot { color: var(--alert); }
        .viz { margin-top: 12px; }
        .note { margin-top: 12px; display: flex; gap: 8px; font-size: 13.5px; line-height: 1.55; color: #FFCFC3; padding: 10px 12px; border-radius: 10px; background: var(--alert-dim); }
        .note svg { flex: none; margin-top: 2px; color: var(--alert); }

        /* 진행 상태 */
        .step.on .box { opacity: 1; transform: none; }
        .step.on .dot { border-color: var(--scan); color: var(--scan); }
        .step.on .wire i { transform: scaleY(1); }
        .step.is-root.on .dot { background: var(--alert); border-color: var(--alert); color: #120200; box-shadow: 0 0 0 6px rgba(255,90,54,.18), 0 0 24px rgba(255,90,54,.6); animation: rootpulse 2s ease-in-out infinite; }
        .step.is-root.on .box { border-color: rgba(255,90,54,.55); box-shadow: 0 0 0 1px rgba(255,90,54,.25), 0 18px 40px -20px rgba(255,90,54,.55); background: linear-gradient(180deg, rgba(255,90,54,.06), var(--panel-2) 60%); }
        .step.is-root .root-badge { display: inline-flex; }
        .step.after-root .box { border-style: dashed; }
        @keyframes rootpulse { 50% { box-shadow: 0 0 0 10px rgba(255,90,54,.08), 0 0 30px rgba(255,90,54,.7); } }

        /* 시각화 */
        .bars { display: flex; flex-direction: column; gap: 8px; }
        .bar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 80px; gap: 10px; align-items: center; font-size: 13px; }
        .bar .lb { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bar .tr { height: 12px; border-radius: 6px; background: rgba(255,255,255,.05); overflow: hidden; }
        .bar .tr i { display: block; height: 100%; border-radius: 6px; background: var(--scan); opacity: .7; transform-origin: left; transform: scaleX(0); transition: transform .8s var(--ease-out) .15s; }
        .bar.hot .tr i { background: var(--alert); opacity: 1; }
        .bar .vl { text-align: right; font: 700 13px/1 var(--mono); }
        .bar.hot .vl { color: var(--alert); }
        .step.on .bar .tr i { transform: scaleX(var(--w)); }

        .path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .path span { padding: 6px 10px; border-radius: 8px; background: var(--panel-3); border: 1px solid var(--line); font: 600 12.5px/1.2 var(--mono); }
        .path span:last-child { border-color: rgba(255,90,54,.45); color: #FFC5B8; background: var(--alert-dim); }
        .path svg { color: var(--ink-3); }

        .formula { border-radius: 12px; background: #06090F; border: 1px solid var(--line); overflow: hidden; }
        .formula code { display: block; padding: 12px 14px; font: 600 14.5px/1.5 var(--mono); color: var(--ink); border-bottom: 1px solid var(--line); }
        .formula code .k { color: var(--scan); }
        .formula code .o { color: var(--ink-3); }
        .evals { display: grid; grid-template-columns: minmax(0, 1fr); }
        .ev { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; font-size: 13px; }
        .ev + .ev { border-top: 1px solid rgba(255,255,255,.05); }
        .ev .lb { color: var(--ink-3); }
        .ev .ex { font-family: var(--mono); color: var(--ink-2); }
        .ev .rs { font: 800 15px/1 var(--mono); }
        .ev.hot { background: rgba(255,90,54,.06); }
        .ev.hot .ex, .ev.hot .rs { color: var(--alert); }

        .dist svg { display: block; width: 100%; height: auto; overflow: visible; }
        .dist-cap { margin-top: 4px; font-size: 12px; color: var(--ink-3); }

        .tl { list-style: none; margin: 0; padding: 0; position: relative; }
        .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1.5px; background: var(--line-2); }
        .tl li { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 6px 0 6px 24px; font-size: 13.5px; }
        .tl li::before { content: ""; position: absolute; left: 1px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--ink-3); }
        .tl li.hot::before { background: var(--alert); border-color: var(--alert); box-shadow: 0 0 10px var(--alert); }
        .tl time { font: 600 12.5px/1.5 var(--mono); color: var(--ink-3); }
        .tl b { font-weight: 700; }
        .tl li.hot b { color: var(--alert); }
        .tl small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }

        .pair { display: grid; grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr); align-items: stretch; }
        .pair > div { padding: 12px; border-radius: 12px; background: var(--panel-3); border: 1px solid var(--line); min-width: 0; }
        .pair > div.hot { border-color: rgba(255,90,54,.45); background: var(--alert-dim); }
        .pair small { display: block; font-size: 11.5px; color: var(--ink-3); }
        .pair b { display: block; margin-top: 6px; font: 700 14px/1.4 var(--mono); }
        .pair > div.hot b { color: #FFC5B8; }
        .pair .neq { display: flex; align-items: center; justify-content: center; color: var(--alert); font: 800 20px/1 var(--mono); }

        .match { display: flex; flex-direction: column; gap: 6px; }
        .match div { display: grid; grid-template-columns: 22px 120px minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--panel-3); border: 1px solid var(--line); font-size: 13px; }
        .match div.hot { border-color: rgba(255,90,54,.4); background: var(--alert-dim); }
        .match b { font-family: var(--mono); font-size: 12.5px; }
        .match code { font-family: var(--mono); color: var(--ink-2); font-size: 12.5px; }
        .match .ck { color: var(--ok); } .match div.hot .ck { color: var(--alert); }

        /* ════════════ 오른쪽 ════════════ */
        .side { display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 1200px) { .side { position: sticky; top: calc(var(--nav-h) + 16px); } }
        .side .card { padding: 18px; }
        .side h2 { font-size: 15px; font-weight: 800; }
        .side .sub { margin-top: 4px; font-size: 12.5px; color: var(--ink-3); }
        .mini-flow { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
        .mf { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 13.5px; cursor: pointer; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; }
        .mf:hover { background: rgba(255,255,255,.04); }
        .mf .n { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 12px/1 var(--mono); background: var(--panel-3); color: var(--ink-2); }
        .mf.root { border-color: rgba(255,90,54,.4); background: var(--alert-dim); }
        .mf.root .n { background: var(--alert); color: #120200; }
        .mf .st { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
        .mf.root .st { color: var(--alert); }

        .impact { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
        .impact li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 9px 11px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
        .impact li.hot { border-color: rgba(255,90,54,.35); }
        .impact svg { margin-top: 1px; }
        .impact li.hot svg { color: var(--alert); } .impact li.ok svg { color: var(--ok); }
        .impact small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }

        .todo { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
        .todo label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 11px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; font-size: 13.5px; line-height: 1.5; margin: 0; }
        .todo input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 1px 0 0; border-radius: 6px; border: 1.5px solid var(--ink-3); display: grid; place-content: center; cursor: pointer; }
        .todo input::after { content: ""; width: 10px; height: 6px; border-left: 2px solid #001018; border-bottom: 2px solid #001018; transform: rotate(-45deg) scale(0); margin-top: -2px; transition: transform .15s; }
        .todo input:checked { background: var(--ok); border-color: var(--ok); }
        .todo input:checked::after { transform: rotate(-45deg) scale(1); }
        .todo input:focus-visible { outline: 2px solid var(--scan); outline-offset: 2px; }
        .todo label:has(input:checked) span { color: var(--ink-3); text-decoration: line-through; }
        .todo-prog { margin-top: 10px; font-size: 12.5px; color: var(--ink-3); }

        .loading-box { padding: 60px 20px; text-align: center; color: var(--ink-3); }

        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

<!-- ═══════════ 상단 바 ═══════════ -->
<header class="nav">
    <div class="wrap nav-in">
        <a class="brand" href="/cop/main" aria-label="SENTINEL 메인으로">
            <span class="brand-mark" aria-hidden="true"></span><b>SENTINEL</b>
        </a>
        <div class="crumb" aria-label="현재 위치">
            <span aria-hidden="true" style="color:var(--line-2)">/</span>
            <span class="floor">3F</span><b>이상 원인 추적</b>
        </div>
        <div class="nav-tools">
            <span class="demo" title="샘플 데이터">DEMO</span>
            <a class="btn btn-sm" href="/cop/radar">관제</a>
            <a class="btn btn-sm" id="navDiff" href="/cop/diff">비교</a>
            <a class="btn btn-sm" href="/cop/main">메인</a>
        </div>
    </div>
</header>

<main class="wrap" id="main">

    <!-- ═══════════ 판정 ═══════════ -->
    <section class="card verdict" aria-labelledby="vTitle" aria-live="polite">
        <div>
            <span class="v-kicker"><i aria-hidden="true"></i>ROOT CAUSE · 원인 판정</span>
            <h1 id="vTitle">원인을 추적하는 중입니다…</h1>
            <p class="v-sub" id="vSub"></p>
            <div class="v-tags" id="vTags"></div>
        </div>
        <div class="v-actions">
            <button type="button" class="btn" id="btnReplay">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                추적 다시 보기
            </button>

                    { kind: "part", kicker: "이상 자재", title: a.message, q: "무엇이 이상한가?",
                      kv: [["품번", a.partNo], ["자재", a.partName]],
                      viz: { type: "pair", left: { label: e.leftLabel || "영업사양", value: e.leftValue || "" }, right: { label: e.rightLabel || "전개된 자재", value: e.rightValue || "" } } },
                    { kind: "bom", kicker: "BOM 전개", title: path[1] + " 에서 매핑 규칙으로 자재가 정해졌습니다", q: "BOM 어디에서 나왔나?",
                      kv: [["어셈블리", path[1]], ["자재 결정", "사양 → 자재 매핑"]], viz: { type: "path", items: path } },
                    { kind: "logic", kicker: "수배 로직", title: "이전 버전 매핑 규칙(v3)이 적용됐습니다", q: "어떤 규칙이 골랐나?", root: true,
                      kv: [["적용된 규칙", "MAP-" + a.partNo.slice(2, 6) + " v3", true], ["최신 규칙", "v4 · 09-30 배포"]],
                      viz: { type: "formula", code: '<span class="k">' + esc(e.leftLabel || "사양") + '</span> <span class="o">→</span> <span class="k">' + esc(a.partName) + ' 타입</span>',
                             evals: [{ label: "적용 v3", expr: esc(e.leftValue || "") + " → 이전 매핑", result: esc(e.rightValue || ""), hot: true }, { label: "최신 v4", expr: esc(e.leftValue || "") + " → 새 매핑", result: "정상 타입" }] },
                      note: "v4 로 갱신되지 않은 규칙 캐시가 사용된 것으로 보입니다." },
                    { kind: "spec", kicker: "영업사양", title: "영업사양 값 자체는 정상입니다", q: "규칙에 들어간 값은?",
                      kv: [["특성", e.leftLabel || "-"], ["이 호기", e.leftValue || "-"], ["판정", "정상"]] },
                    { kind: "hist", kicker: "변경 이력", title: "규칙 배포 이후에도 이전 규칙으로 계산됐습니다", q: "언제 어긋났나?",
                      viz: { type: "timeline", events: [
                          { t: "09-30 18:00", title: "매핑 규칙 v4 배포", sub: "MAP-" + a.partNo.slice(2, 6) },
                          { t: ts(rnd, 1), title: "BOM 계산 · v3 사용", sub: "규칙 캐시 미갱신", hot: true },
                          { t: ts(rnd, 2), title: "SENTINEL 탐지", sub: "사양 불일치 · 위험 " + a.severity } ] } }
                ],
                impact: [{ hot: true, title: "09-30 이후 v3 로 계산된 호기", sub: "같은 원인일 가능성 → 함께 점검" }, { ok: true, title: "영업사양 값", sub: "정상 → 수정 불필요" }],
                todo: ["매핑 규칙 캐시가 v4 로 갱신됐는지 확인", "이 호기 BOM 재계산", "09-30 이후 계산된 같은 사양 호기 점검"]
            });
        }
        // DUP
        return assign(base, {
            verdict: '두 수배 규칙의 조건이 겹쳐 <em>' + esc(a.partName) + '</em> 가 두 번 전개됐습니다',
            verdictSub: "카 도어 경로와 승강장 도어 경로의 수배 조건이 모두 이 호기의 도어 방식을 포함해, 같은 품번이 양쪽에서 전개됐습니다.",
            fixLabel: "규칙 확인 후 재계산",
            steps: [
                { kind: "part", kicker: "이상 자재", title: a.message, q: "무엇이 이상한가?",
                  kv: [["품번", a.partNo], ["자재", a.partName], ["전개 횟수", "2 회", true], ["동일 사양", "1 회"]],
                  viz: { type: "bars", items: [{ label: "이 호기", value: 2, unit: "회", hot: true }, { label: "동일 사양", value: 1, unit: "회" }] } },
                { kind: "bom", kicker: "BOM 전개", title: "두 경로에서 같은 품번이 나옵니다", q: "BOM 어디에서 나왔나?",
                  viz: { type: "pair", left: { label: "경로 1", value: e.leftValue || "카 > 도어 > " + a.partName }, right: { label: "경로 2", value: e.rightValue || "승강장 > 도어 > " + a.partName } } },
                { kind: "logic", kicker: "수배 로직", title: "두 규칙의 조건이 동시에 참이 됐습니다", q: "어떤 규칙이 전개했나?", root: true,
                  kv: [["겹친 조건", "EL_DOOR = CO", true]],
                  viz: { type: "match", rules: [
                      { code: "PID-" + a.partNo.slice(2, 6) + "-C", cond: "카 도어 경로 : EL_DOOR = CO", hot: false },
                      { code: "PID-" + a.partNo.slice(2, 6) + "-H", cond: "승강장 경로 : EL_DOOR IN (CO, 2S)", hot: true } ] },
                  note: "승강장 경로 규칙의 조건이 넓게 잡혀 카 도어 경로와 겹칩니다." },
                { kind: "spec", kicker: "영업사양", title: "도어 방식 값은 정상입니다", q: "규칙에 들어간 값은?",
                  kv: [["특성", "EL_DOOR 도어 방식"], ["이 호기", "CO"], ["판정", "정상"]] },
                { kind: "hist", kicker: "변경 이력", title: "승강장 경로 규칙이 최근 수정됐습니다", q: "언제 겹치기 시작했나?",
                  viz: { type: "timeline", events: [
                      { t: "10-02 10:30", title: "승강장 경로 규칙 수정", sub: "조건에 CO 추가", hot: true },
                      { t: ts(rnd, 1), title: "BOM 계산", sub: a.partName + " 2회 전개" },
                      { t: ts(rnd, 2), title: "SENTINEL 탐지", sub: "중복 수배 · 위험 " + a.severity } ] } }
            ],
            impact: [{ hot: true, title: "10-02 이후 EL_DOOR = CO 호기", sub: "같은 중복이 생겼을 가능성" }, { ok: true, title: "EL_DOOR = 2S 호기", sub: "카 도어 경로 조건 불일치 → 영향 없음" }],
            todo: ["승강장 경로 규칙 조건(EL_DOOR IN …) 검토", "이 호기 BOM 재계산 후 1회 전개 확인", "10-02 이후 CO 호기 중복 수배 점검"]
        });
    }

    function histStep(rnd, change, a) {
        return { kind: "hist", kicker: "변경 이력", title: "속성값 변경에서 값이 바뀌었습니다", q: "언제, 어떻게 바뀌었나?",
            viz: { type: "timeline", events: [
                { t: ts(rnd, -1), title: "영업사양 등록", sub: "정상 값" },
                { t: ts(rnd, 0), title: "속성값 변경 · " + change, sub: "원사이클 자동화 (속성값 변경 단계)", hot: true },
                { t: ts(rnd, 1), title: "BOM 계산", sub: a.partName + " 전개" },
                { t: ts(rnd, 2), title: "SENTINEL 탐지", sub: TYPE_NAME[a.type] + " · 위험 " + a.severity } ] } };
    }

    /** 추적 데이터 (실제 연동 시 이 함수만 교체) */
    function loadTrace(params) {
        var isShowcase = (!params.id && !params.no) || (params.no === SHOWCASE.productNo && (!params.part || params.part === SHOWCASE.partNo));
        if (isShowcase) return Promise.resolve(SHOWCASE);
        return fetch("/cop/radar/anomalies", { credentials: "same-origin" })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                var list = res.anomalies || [];
                var a = list.filter(function (x) { return params.id && x.id === params.id; })[0]
                     || list.filter(function (x) { return x.productNo === params.no && (!params.part || x.partNo === params.part); })[0];
                if (a) return a.productNo === SHOWCASE.productNo && a.partNo === SHOWCASE.partNo ? SHOWCASE : fromAnomaly(a);
                return synthetic(params);
            })
            .catch(function () { return synthetic(params); });
    }

    /** 관제 데이터에 없는 호기/자재 (BOM 비교에서 넘어온 경우) → 수량 급증 형태의 샘플 */
    function synthetic(params) {
        if (!params.no) return SHOWCASE;
        var r = rng(hashInt(params.no + params.part));
        var exp = 2 + Math.floor(r() * 10), act = exp + 1 + Math.floor(r() * exp * 2);
        return fromAnomaly({ id: params.no + params.part, productNo: params.no, site: "샘플현장", partNo: params.part || "P-0000-00", partName: params.name || "자재",
            type: "QTY", severity: 60, peers: 18, message: (params.name || "자재") + " 수량 " + act + "EA — 동일 사양 평균 " + exp + "EA",
            evidence: { kind: "dist", expected: exp, actual: act, values: [exp, exp, exp + 1, exp - 1 > 0 ? exp - 1 : exp, exp] } });
    }

    /* =========================================================
       그리기
       ========================================================= */
    var trace = null, playTimer = [];

    function render(t) {
        trace = t;
        var rootIdx = t.steps.findIndex(function (s) { return s.root; });

        $("vTitle").innerHTML = t.verdict;
        $("vSub").textContent = t.verdictSub;
        $("vTags").innerHTML =
            '<span class="tag">호기 <b>' + esc(t.productNo) + '</b></span>' +
            '<span class="tag">자재 <b>' + esc(t.partName) + ' ' + esc(t.partNo) + '</b></span>' +
            '<span class="tag hot">' + TYPE_NAME[t.type] + ' · 위험 <b>' + t.severity + '</b></span>' +
            '<span class="tag">원인 위치 <b>' + (rootIdx + 1) + '단계 · ' + esc(t.steps[rootIdx].kicker) + '</b></span>';
        $("btnFix").href = "/cop/bom?productNo=" + encodeURIComponent(t.productNo);
        $("btnFixText").textContent = t.fixLabel || "원인 수정 · 재계산";
        $("btnDiff").href = $("navDiff").href = "/cop/diff?b=" + encodeURIComponent(t.productNo);
        document.title = t.productNo + " 원인 추적 · SENTINEL";

        $("chain").innerHTML = t.steps.map(function (s, i) {
            return '<li class="step' + (s.root ? " is-root" : "") + (i > rootIdx ? " after-root" : "") + '" id="step-' + i + '">' +
                '<div class="rail" aria-hidden="true"><span class="dot">' + svg(s.root ? "alert" : s.kind, 20, 2) + '</span><span class="wire"><i></i></span></div>' +
                '<div class="box">' +
                    '<div class="box-head"><span class="box-kicker">STEP ' + (i + 1) + ' · ' + esc(s.kicker) + '</span>' +
                        '<span class="root-badge">' + svg("alert", 13, 2.4) + '원인</span>' +
                        '<h3>' + esc(s.title) + '</h3><p class="q">' + esc(s.q) + '</p></div>' +
                    (s.kv ? '<dl class="kv">' + s.kv.map(function (k) { return '<div><dt>' + esc(k[0]) + '</dt><dd' + (k[2] ? ' class="hot"' : '') + '>' + esc(k[1]) + '</dd></div>'; }).join("") + '</dl>' : '') +
                    (s.viz ? '<div class="viz">' + viz(s.viz) + '</div>' : '') +
                    (s.note ? '<p class="note">' + svg("alert", 15, 2.2) + '<span>' + esc(s.note) + '</span></p>' : '') +
                '</div></li>';
        }).join("");

        $("miniFlow").innerHTML = t.steps.map(function (s, i) {
            return '<button type="button" class="mf' + (s.root ? " root" : "") + '" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' +
                '<span>' + esc(s.kicker) + '</span><span class="st">' + (s.root ? "원인" : i < rootIdx ? "증상 경로" : "근거") + '</span></button>';
        }).join("");
        $("miniFlow").querySelectorAll(".mf").forEach(function (b) {
            b.addEventListener("click", function () {
                var el = $("step-" + b.dataset.i);
                el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
                el.classList.add("on");
            });
        });

        $("impSub").textContent = t.impactSub || "";
        $("impact").innerHTML = (t.impact || []).map(function (m) {
            return '<li class="' + (m.hot ? "hot" : "ok") + '">' + svg(m.hot ? "alert" : "check", 16, 2.2) + '<span><b>' + esc(m.title) + '</b><small>' + esc(m.sub) + '</small></span></li>';
        }).join("");

        $("todo").innerHTML = (t.todo || []).map(function (txt, i) {
            return '<li><label><input type="checkbox" data-i="' + i + '"><span>' + esc(txt) + '</span></label></li>';
        }).join("");
        $("todo").querySelectorAll("input").forEach(function (c) { c.addEventListener("change", updateTodo); });
        updateTodo();
        $("ruleLink").hidden = !t.ruleLink;
        if (t.ruleLink) { $("ruleLink").href = t.ruleLink.href; $("ruleLinkText").textContent = t.ruleLink.label; }

        play();
    }

    function updateTodo() {
        var all = $("todo").querySelectorAll("input"), done = $("todo").querySelectorAll("input:checked").length;
        $("todoProg").textContent = done + " / " + all.length + " 완료";
    }

    /** 추적 재생 : 증상부터 원인까지 한 단계씩 켠다 */
    function play() {
        playTimer.forEach(clearTimeout); playTimer = [];
        var steps = $("chain").querySelectorAll(".step");
        steps.forEach(function (s) { s.classList.remove("on"); });
        if (reduceMotion) { steps.forEach(function (s) { s.classList.add("on"); }); return; }
        steps.forEach(function (s, i) {
            playTimer.push(setTimeout(function () { s.classList.add("on"); }, 250 + i * 520));
        });
    }
    $("btnReplay").addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
        play();
    });

    /* 시각화 */
    function viz(v) {
        if (v.type === "bars") {
            var max = Math.max.apply(null, v.items.map(function (x) { return x.value; }).concat([1]));
            return '<div class="bars">' + v.items.map(function (x) {
                return '<div class="bar' + (x.hot ? " hot" : "") + '"><span class="lb">' + esc(x.label) + '</span>' +
                    '<span class="tr"><i style="--w:' + Math.max(0.01, x.value / max).toFixed(3) + '"></i></span>' +
                    '<span class="vl tnum">' + x.value.toLocaleString("ko-KR") + ' ' + esc(x.unit) + '</span></div>';
            }).join("") + '</div>';
        }
        if (v.type === "path") {
            return '<div class="path">' + v.items.map(function (x, i) { return (i ? svg("arrow", 14, 2.2) : "") + '<span>' + esc(x) + '</span>'; }).join("") + '</div>';
        }
        if (v.type === "formula") {
            return '<div class="formula"><code>' + v.code + '</code><div class="evals">' + v.evals.map(function (x) {
                return '<div class="ev' + (x.hot ? " hot" : "") + '"><span class="lb">' + esc(x.label) + '</span><span class="ex">' + x.expr + '</span><span class="rs tnum">= ' + x.result + '</span></div>';
            }).join("") + '</div></div>';
        }
        if (v.type === "dist") return distSvg(v);
        if (v.type === "timeline") {
            return '<ol class="tl">' + v.events.map(function (x) {
                return '<li' + (x.hot ? ' class="hot"' : '') + '><time>' + esc(x.t) + '</time><span><b>' + esc(x.title) + '</b><small>' + esc(x.sub) + '</small></span></li>';
            }).join("") + '</ol>';
        }
        if (v.type === "pair") {
            return '<div class="pair"><div><small>' + esc(v.left.label) + '</small><b>' + esc(v.left.value) + '</b></div><span class="neq" aria-label="다름">≠</span>' +
                '<div class="hot"><small>' + esc(v.right.label) + '</small><b>' + esc(v.right.value) + '</b></div></div>';
        }
        if (v.type === "match") {
            return '<div class="match">' + v.rules.map(function (x) {
                return '<div class="' + (x.hot ? "hot" : "") + '"><span class="ck">' + svg("check", 16, 2.6) + '</span><b>' + esc(x.code) + '</b><code>' + esc(x.cond) + '  → 참</code></div>';
            }).join("") + '</div>';
        }
        return "";
    }

    /** 값 분포 : 허용 범위 띠 + 동일 사양 점 + 이 호기 */
    function distSvg(v) {
        var W = 820, H = 96, padL = 14, padR = 14, y = 52;   // 화면 폭과 비슷하게 잡아 글자가 과하게 커지지 않도록
        var vals = v.peers.concat([v.value]).concat(v.range || []);
        var max = Math.max.apply(null, vals) * 1.06, min = Math.min(0, Math.min.apply(null, vals));
        var x = function (n) { return padL + (n - min) / (max - min) * (W - padL - padR); };
        var band = v.range ? '<rect x="' + x(v.range[0]).toFixed(1) + '" y="' + (y - 18) + '" width="' + (x(v.range[1]) - x(v.range[0])).toFixed(1) + '" height="36" rx="6" fill="rgba(94,240,166,.08)" stroke="rgba(94,240,166,.35)" stroke-dasharray="3 4"/>' +
            '<text x="' + x(v.range[0]).toFixed(1) + '" y="' + (y - 24) + '" fill="#5EF0A6" font-size="11" font-family="Consolas, monospace">허용 ' + v.range[0] + '~' + v.range[1] + '</text>' : "";
        var dots = v.peers.map(function (n, i) {
            return '<circle cx="' + x(n).toFixed(1) + '" cy="' + (y - 8 + (i % 4) * 5) + '" r="3.6" fill="#7FE3FF" fill-opacity=".6"/>';
        }).join("");
        var vx = x(v.value), anchor = vx > W * 0.75 ? "end" : "middle";
        return '<div class="dist"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="동일 사양 값 ' + v.peers[0] + ', 이 호기 ' + v.value + '">' + band +
            '<line x1="' + padL + '" y1="' + (y + 20) + '" x2="' + (W - padR) + '" y2="' + (y + 20) + '" stroke="rgba(255,255,255,.15)"/>' + dots +
            '<circle cx="' + vx.toFixed(1) + '" cy="' + y + '" r="13" fill="rgba(255,90,54,.18)"/><circle cx="' + vx.toFixed(1) + '" cy="' + y + '" r="6.5" fill="#FF5A36"/>' +
            '<text x="' + vx.toFixed(1) + '" y="' + (y + 38) + '" text-anchor="' + anchor + '" fill="#FF8A6E" font-size="13" font-weight="700" font-family="Consolas, monospace">이 호기 ' + v.value + (v.unit || "") + '</text>' +
            '<text x="' + x(v.peers[0]).toFixed(1) + '" y="' + (y + 38) + '" text-anchor="middle" fill="#AEB6C4" font-size="12" font-family="Consolas, monospace">동일 사양 ' + v.peers[0] + (v.unit || "") + '</text>' +
            '</svg><p class="dist-cap">파란 점 = 동일 사양 호기' + (v.range ? ' · 초록 띠 = 허용 범위' : '') + '</p></div>';
    }

    /* =========================================================
       유틸
       ========================================================= */
    function assign(a, b) { for (var k in b) a[k] = b[k]; return a; }
    function pick(rnd, arr) { return arr[Math.floor(rnd() * arr.length)]; }
    function ts(rnd, k) { var h = 9 + Math.floor(rnd() * 3) + Math.max(0, k); return "10-17 " + (h < 10 ? "0" + h : h) + ":" + (10 + Math.floor(rnd() * 49)); }
    function hashInt(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function rng(seed) {
        return function () {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    /* 시작 */
    var qs = new URLSearchParams(location.search);
    loadTrace({ id: qs.get("id"), no: (qs.get("no") || "").toUpperCase(), part: qs.get("part") || "", name: qs.get("name") || "" }).then(render);
})();
</script>
</body>
</html>
