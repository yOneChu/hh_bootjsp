<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>감지 규칙 관리 · SENTINEL</title>
    <link rel="icon" type="image/png" href="/resources/favicon.ico"/>
    <!--
        SENTINEL 1F · 감지 규칙 관리 (CopMainController : GET /cop/rules?id=R-06)

        무엇을 하는 화면인가
          - BOM 이상을 판정하는 "감지 규칙"을 켜고 끄고, 경고 · 위험 기준값을 조정한다.
          - 기준을 바꾸면 최근 30일 샘플 호기에 바로 적용해 보고(시뮬레이션)
            몇 건을 잡는지 / 오탐(정상인데 잡음)은 몇 건인지 / 놓친 실제 이상은 몇 건인지 미리 보여준다.
          - 3F 원인 추적에서 제안된 규칙(EL_STOP 범위 검사)을 적용하면 BOM 계산 전에 입력 오류를 막는다.

        데이터
          - 규칙 : SAMPLE_RULES (아래 script). 저장하면 이 브라우저(localStorage)에만 저장된다.
          - 시뮬레이션 호기 : makePopulation() 이 규칙마다 만드는 샘플.
          - 실제 연동 시 loadRules / saveRules / makePopulation 세 함수만 서버 호출로 바꾸면 된다.

        판정 방식 (metric.dir)
          above : 값이 기준 이상이면 이상   (예 : 동일 사양 평균의 3배 이상 → 위험)
          below : 값이 기준 이하이면 이상   (예 : 하위 자재가 평균의 10% 이하 → 위험)
          range : 값이 허용 범위 밖이면 이상 (예 : 정지층수가 2~40 밖 → 위험)
    -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>

    <style>
        /* ════════════ 토큰 (SENTINEL 공통) ════════════ */
        :root {
            --void:    #04060A;
            --panel:   #0C1018;
            --panel-2: #111723;
            --panel-3: #161D2B;
            --line:    rgba(255,255,255,.08);
            --line-2:  rgba(255,255,255,.15);
            --grid:    rgba(255,255,255,.06);

            --ink:   #F4F6FA;
            --ink-2: #AEB6C4;
            --ink-3: #7C8596;

            --scan:   #7FE3FF;  --scan-dim:  rgba(127,227,255,.13);
            --alert:  #FF5A36;  --alert-dim: rgba(255,90,54,.15);
            --warn:   #FFB020;  --warn-dim:  rgba(255,176,32,.14);
            --ok:     #5EF0A6;  --ok-dim:    rgba(94,240,166,.13);
            --chg:    #B79CFF;  --chg-dim:   rgba(183,156,255,.15);

            --t-QTY: #FF5A36; --t-MISSING: #FFB020; --t-SPEC: #B79CFF; --t-DUP: #7FE3FF; --t-RANGE: #5EF0A6;

            --mono: "D2Coding", Consolas, "SF Mono", Menlo, monospace;
            --sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            --ease-out: cubic-bezier(.16,1,.3,1);
            --nav-h: 64px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; background: var(--void); }
        body { margin: 0; min-height: 100vh; font-family: var(--sans); color: var(--ink); background: var(--void); word-break: keep-all; overflow-wrap: anywhere; }
        h1, h2, h3, h4, p { margin: 0; }
        a { color: inherit; text-decoration: none; }
        button, input, select, textarea { font: inherit; color: inherit; }
        [hidden] { display: none !important; }
        :focus-visible { outline: 2px solid var(--scan); outline-offset: 2px; border-radius: 6px; }
        .mono { font-family: var(--mono); }
        .tnum { font-variant-numeric: tabular-nums; }
        .wrap { width: 100%; max-width: 1640px; margin: 0 auto; padding: 0 16px; }
        @media (min-width: 900px) { .wrap { padding: 0 28px; } }
        .demo { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-2); font: 700 10px/1.4 var(--mono); letter-spacing: .12em; color: var(--ink-3); }

        /* ════════════ 상단 바 ════════════ */
        .nav { position: sticky; top: 0; z-index: 40; background: rgba(4,6,10,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
        .nav-in { height: var(--nav-h); display: flex; align-items: center; gap: 16px; }
        .brand { display: flex; align-items: center; gap: 12px; flex: none; }
        .brand-mark { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--scan); }
        .brand-mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: 50%; height: 1.5px; background: var(--scan); transform-origin: 0 50%; animation: spin 3s linear infinite; }
        .brand b { font: 800 14px/1 var(--sans); letter-spacing: .3em; }
        .crumb { display: none; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
        .crumb .floor { font: 700 13px/1 var(--mono); color: var(--alert); text-shadow: 0 0 10px rgba(255,90,54,.55); padding: 5px 8px; border-radius: 6px; background: #000; border: 1px solid var(--line-2); }
        .crumb b { color: var(--ink); font-weight: 750; }
        @media (min-width: 720px) { .crumb { display: flex; } }
        .nav-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
            font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap;
            transition: background .2s, border-color .2s, transform .2s var(--ease-out), opacity .2s;
        }
        .btn:hover:not(:disabled) { background: rgba(255,255,255,.06); border-color: var(--ink-3); }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
        .btn-solid { background: var(--ink); color: var(--void); border-color: var(--ink); }
        .btn-solid:hover:not(:disabled) { background: #fff; box-shadow: 0 8px 22px -8px rgba(127,227,255,.6); }
        .btn-ok { background: var(--ok); border-color: var(--ok); color: #03140B; }
        .btn-ok:hover:not(:disabled) { filter: brightness(1.08); }
        .btn-danger { color: var(--alert); border-color: rgba(255,90,54,.4); }
        .btn-danger:hover:not(:disabled) { background: var(--alert-dim); border-color: var(--alert); }

        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; min-width: 0; }

        /* ════════════ 머리 ════════════ */
        .head { margin-top: 18px; padding: 22px 24px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: center; }
        @media (min-width: 1100px) { .head { grid-template-columns: minmax(0, 1fr) auto; } }
        .kicker { font: 700 12px/1 var(--mono); letter-spacing: .2em; color: var(--scan); }
        .head h1 { margin-top: 10px; font-size: clamp(24px, 2.4vw, 32px); font-weight: 850; letter-spacing: -.025em; }
        .head p { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); line-height: 1.6; max-width: 760px; }
        .stats { display: flex; flex-wrap: wrap; gap: 10px; }
        .stat { min-width: 128px; padding: 12px 16px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
        .stat dt { font: 700 11px/1.3 var(--mono); letter-spacing: .12em; color: var(--ink-3); }
        .stat dd { margin: 6px 0 0; font: 800 26px/1 var(--mono); }
        .stat dd small { font: 600 12px var(--sans); color: var(--ink-3); margin-left: 3px; }

        /* ════════════ 본문 ════════════ */
        .body { margin: 16px 0 32px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
        @media (min-width: 1100px) { .body { grid-template-columns: 380px minmax(0, 1fr); } }

        /* 규칙 목록 */
        .list-card { padding: 14px; }
        @media (min-width: 1100px) { .list-card { position: sticky; top: calc(var(--nav-h) + 16px); max-height: calc(100vh - var(--nav-h) - 32px); display: flex; flex-direction: column; } }
        .list-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 12px; }
        .list-head h2 { font-size: 15.5px; font-weight: 800; }
        .list-head .btn { margin-left: auto; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px 10px; }
        .chip { min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 650; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
        .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-3)); }
        .chip[aria-pressed="true"] { background: var(--panel-3); color: var(--ink); border-color: var(--line-2); }
        .rules { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .rule {
            position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center;
            padding: 12px 12px 12px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; text-align: left; width: 100%;
            transition: border-color .15s, background .15s;
        }
        .rule::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
        .rule:hover { border-color: var(--line-2); }
        .rule[aria-current="true"] { background: var(--panel-3); border-color: var(--scan); box-shadow: 0 0 0 3px var(--scan-dim); }
        .rule.off { opacity: .55; }
        .rule .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .rule .id { font: 700 11.5px/1 var(--mono); color: var(--ink-3); }
        .rule .nm { font-size: 14px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rule .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
        .rule .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--ink-3); }
        .rule .cond { font-family: var(--mono); color: var(--ink-2); }
        .badge { font-size: 11px; font-weight: 750; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
        .badge.sug { background: var(--ok-dim); color: var(--ok); }
        .badge.new { background: var(--scan-dim); color: var(--scan); }
        .sw { position: relative; width: 40px; height: 24px; flex: none; }
        .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
        .sw .t { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.14); transition: background .2s; }
        .sw .k { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
        .sw input:checked + .t { background: var(--ok); }
        .sw input:checked ~ .k { transform: translateX(16px); }
        .sw input:focus-visible + .t { outline: 2px solid var(--scan); outline-offset: 2px; }

        /* 편집기 */
        .editor { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .ed-head { padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
        .ed-head .tbadge { font: 700 12px/1 var(--mono); padding: 6px 9px; border-radius: 8px; color: #04060A; background: var(--c); }
        .ed-head h2 { font-size: 20px; font-weight: 850; letter-spacing: -.015em; }
        .ed-head .id { font: 600 13px/1 var(--mono); color: var(--ink-3); }
        .ed-head .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .dirty-note { font-size: 12.5px; color: var(--warn); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .dirty-note i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

        .suggest { margin: 0 20px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--ok-dim); border: 1px solid rgba(94,240,166,.35); }
        .suggest svg { color: var(--ok); }
        .suggest b { display: block; font-size: 14.5px; }
        .suggest span { display: block; margin-top: 3px; font-size: 13px; color: #C9F7DD; line-height: 1.55; }
        @media (max-width: 719px) { .suggest { grid-template-columns: minmax(0, 1fr); } }

        .sec { padding: 18px 20px; }
        .sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 14px; }
        .sec-h h3 { font-size: 15.5px; font-weight: 800; }
        .sec-h .sub { font-size: 12.5px; color: var(--ink-3); }

        .form { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
        @media (min-width: 900px) { .form { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form .full { grid-column: 1 / -1; } }
        .fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .fld label, .fld .lb { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
        .fld input[type=text], .fld input[type=number], .fld select, .fld textarea {
            width: 100%; min-height: 42px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--panel-2); font-size: 14px;
        }
        .fld textarea { padding: 10px 12px; min-height: 64px; resize: vertical; line-height: 1.5; }
        .fld select:disabled { opacity: .6; }
        .fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--scan); box-shadow: 0 0 0 3px var(--scan-dim); }
        .help { font-size: 12px; color: var(--ink-3); line-height: 1.5; }

        /* 판정 문장 */
        .sentence { padding: 14px 16px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); font-size: 15px; line-height: 2; }
        .sentence b { font-family: var(--mono); padding: 2px 8px; border-radius: 7px; margin: 0 2px; }
        .sentence b.w { background: var(--warn-dim); color: var(--warn); }
        .sentence b.c { background: var(--alert-dim); color: var(--alert); }
        .sentence b.r { background: var(--ok-dim); color: var(--ok); }

        .th-grid { margin-top: 14px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
        @media (min-width: 900px) { .th-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .th { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); }
        .th-top { display: flex; align-items: center; gap: 8px; }
        .th-top .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
        .th-top b { font-size: 13.5px; }
        .th-top input[type=number] { margin-left: auto; width: 96px; min-height: 34px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel); text-align: right; font: 700 14px var(--mono); }
        .th-top .u { font-size: 12.5px; color: var(--ink-3); min-width: 16px; }
        .th input[type=range] { width: 100%; margin-top: 10px; accent-color: var(--c); }
        .th .was { margin-top: 2px; font-size: 11.5px; color: var(--ink-3); }

        /* 시뮬레이션 */
        .sim { position: relative; }
        .sim svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
        .sim .hd { cursor: ew-resize; }
        .sim .hd:focus { outline: none; }
        .sim-legend { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-3); }
        .sim-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

        .res { margin-top: 16px; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        @media (min-width: 900px) { .res { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
        .rbox { padding: 12px 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
        .rbox small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 650; }
        .rbox b { display: block; margin-top: 6px; font: 800 24px/1 var(--mono); }
        .rbox .d { margin-top: 6px; font: 700 11.5px/1 var(--mono); color: var(--ink-3); }
        .rbox .d.up { color: var(--warn); } .rbox .d.down { color: var(--scan); }
        .rbox.tp b { color: var(--ok); } .rbox.fp b { color: var(--warn); } .rbox.fn b { color: var(--alert); }
        .advice { margin-top: 12px; display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--scan-dim); color: #D4F6FF; font-size: 13.5px; line-height: 1.6; }
        .advice svg { flex: none; margin-top: 2px; color: var(--scan); }
        .off-note { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px dashed var(--line-2); font-size: 13px; color: var(--ink-2); }

        /* 알림 · 이력 */
        .two { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
        @media (min-width: 1000px) { .two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .ck { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; cursor: pointer; }
        .ck input { width: 18px; height: 18px; accent-color: var(--scan); }
        .hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
        .hist li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 13px; line-height: 1.5; }
        .hist time { font: 600 12px/1.6 var(--mono); color: var(--ink-3); }

        .toast { position: fixed; left: 50%; bottom: 26px; z-index: 80; transform: translate(-50%, 16px); display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 14px; background: var(--ink); color: var(--void); font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; box-shadow: 0 16px 40px rgba(0,0,0,.5); max-width: calc(100vw - 32px); }
        .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
        .toast button { border: none; background: rgba(0,0,0,.08); color: var(--void); font-weight: 800; padding: 7px 12px; border-radius: 9px; cursor: pointer; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

<!-- ═══════════ 상단 바 ═══════════ -->
<header class="nav">
    <div class="wrap nav-in">
        <a class="brand" href="/cop/main" aria-label="SENTINEL 메인으로">
            <span class="brand-mark" aria-hidden="true"></span><b>SENTINEL</b>
        </a>
        <div class="crumb" aria-label="현재 위치">
            <span aria-hidden="true" style="color:var(--line-2)">/</span>
            <span class="floor">1F</span><b>감지 규칙 관리</b>
        </div>
        <div class="nav-tools">
            <span class="demo" title="샘플 데이터">DEMO</span>
            <a class="btn btn-sm" href="/cop/radar">관제</a>
            <a class="btn btn-sm" href="/cop/report">리포트</a>
            <a class="btn btn-sm" href="/cop/main">메인</a>
        </div>
    </div>
</header>

<main class="wrap" id="main">

    <!-- ═══════════ 머리 ═══════════ -->
    <section class="card head" aria-labelledby="hTitle">
        <div>
            <span class="kicker">DETECTION RULES</span>
            <h1 id="hTitle">감지 규칙 관리</h1>
            <p>어떤 BOM 을 "이상"으로 볼지 정하는 기준입니다. 기준을 바꾸면 최근 30일 호기에 바로 대입해, 저장하기 전에 결과를 미리 보여줍니다.</p>
        </div>
        <dl class="stats" aria-label="규칙 요약">
            <div class="stat"><dt>켜진 규칙</dt><dd class="tnum"><span id="sOn">—</span><small id="sAll"></small></dd></div>
            <div class="stat"><dt>30일 탐지 (예상)</dt><dd class="tnum"><span id="sHits">—</span><small>건</small></dd></div>
            <div class="stat"><dt>평균 오탐률</dt><dd class="tnum"><span id="sFp">—</span><small>%</small></dd></div>
        </dl>
    </section>

    <div class="body">
        <!-- ═══════════ 규칙 목록 ═══════════ -->
        <nav class="card list-card" aria-labelledby="listTitle">
            <div class="list-head">
                <h2 id="listTitle">규칙</h2>
                <button type="button" class="btn btn-sm" id="btnNew">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    새 규칙
                </button>
            </div>
            <div class="chips" id="chips" role="group" aria-label="유형 필터"></div>
            <ul class="rules" id="ruleList"></ul>
        </nav>

        <!-- ═══════════ 편집기 ═══════════ -->
        <div class="editor" id="editor"></div>
    </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>되돌리기</button></div>

<script th:inline="none">
(function () {
    "use strict";

    var $ = function (id) { return document.getElementById(id); };
    var STORE_KEY = "sentinel.rules.v1";   // 저장한 규칙 (이 브라우저에만)

    /* =========================================================
       1. 기본 정의
       ========================================================= */

    /** 이상 유형 이름 (관제 · 리포트 화면과 같은 이름) + 입력값 검사 */
    var TYPE_NAME = { QTY: "수량 급증", MISSING: "자재 누락", SPEC: "사양 불일치", DUP: "중복 수배", RANGE: "입력값 검사" };
    var TYPES = ["QTY", "MISSING", "SPEC", "DUP", "RANGE"];
    var SCOPES = ["전체 자재", "권상기 · 제어반", "카 · 카 도어", "승강장 도어", "가이드레일 · 로프", "영업사양 입력 (속성값 변경 단계)"];

    /**
     * 유형별 기준값 기본 틀.
     * 새 규칙을 만들거나 유형을 바꿀 때 이 값으로 시작한다.
     *   dir        : 판정 방향 (above / below / range)
     *   label,unit : 화면에 보이는 측정값 이름과 단위
     *   step       : 기준값을 움직이는 단위
     *   smin,smax  : 슬라이더로 고를 수 있는 범위
     *   dmin,dmax  : 분포 그래프의 가로축 범위 (넘는 값은 맨 끝 칸에 모음)
     *   warn,crit  : 경고 · 위험 기준값 (range 는 lo,hi 허용 범위)
     */
    var METRIC_TEMPLATE = {
        QTY:     { dir: "above", label: "동일 사양 평균 대비 수량", unit: "배", step: 0.1, smin: 1.1, smax: 8,  dmin: 0, dmax: 8,   warn: 1.8, crit: 3 },
        MISSING: { dir: "below", label: "하위 자재 수 (동일 사양 대비)", unit: "%", step: 5,  smin: 0,   smax: 95, dmin: 0, dmax: 120, warn: 50,  crit: 10 },
        SPEC:    { dir: "above", label: "사양과 맞지 않는 자재 수", unit: "건", step: 1,   smin: 1,   smax: 8,  dmin: 0, dmax: 8,   warn: 1,   crit: 3 },
        DUP:     { dir: "above", label: "같은 품번 전개 횟수", unit: "회", step: 1,   smin: 2,   smax: 6,  dmin: 0, dmax: 6,   warn: 2,   crit: 3 },
        RANGE:   { dir: "range", label: "입력값", unit: "", step: 1,   smin: 0,   smax: 200, dmin: 0, dmax: 60, lo: 2, hi: 40 }
    };

    /* =========================================================
       2. 샘플 규칙 (실제 연동 시 loadRules 를 서버 호출로 교체)
       ========================================================= */
    var SAMPLE_RULES = [
        { id: "R-01", name: "수량 급증 (전체 자재)", type: "QTY", enabled: true, scope: "전체 자재", minPeers: 10,
          desc: "같은 사양 호기들의 평균 수량보다 크게 많으면 이상으로 봅니다.",
          m: assign(clone(METRIC_TEMPLATE.QTY), { warn: 1.8, crit: 3 }), notify: { crit: true, warn: false }, target: "수배로직설계팀",
          hist: [["2026-09-02", "위험 기준 2.5배 → 3.0배 (오탐 감소)"], ["2026-06-11", "규칙 생성"]] },
        { id: "R-02", name: "고가 자재 수량 급증", type: "QTY", enabled: true, scope: "권상기 · 제어반", minPeers: 8,
          desc: "단가가 높은 권상기 · 제어반 자재는 더 낮은 배수에서도 알립니다.",
          m: assign(clone(METRIC_TEMPLATE.QTY), { warn: 1.3, crit: 2 }), notify: { crit: true, warn: true }, target: "수배로직설계팀, 구매팀",
          hist: [["2026-07-20", "규칙 생성 (구매팀 요청)"]] },
        { id: "R-03", name: "하위 자재 누락", type: "MISSING", enabled: true, scope: "전체 자재", minPeers: 10,
          desc: "하위 자재 수가 같은 사양 평균보다 크게 적으면 종속사양 산출 누락을 의심합니다.",
          m: clone(METRIC_TEMPLATE.MISSING), notify: { crit: true, warn: false }, target: "수배로직설계팀",
          hist: [["2026-08-14", "경고 기준 40% → 50%"], ["2026-06-11", "규칙 생성"]] },
        { id: "R-04", name: "사양 · 자재 매핑 불일치", type: "SPEC", enabled: true, scope: "전체 자재", minPeers: 5,
          desc: "영업사양 값과 전개된 자재 타입이 매핑 규칙과 맞지 않으면 알립니다.",
          m: clone(METRIC_TEMPLATE.SPEC), notify: { crit: true, warn: false }, target: "수배로직설계팀",
          hist: [["2026-06-11", "규칙 생성"]] },
        { id: "R-05", name: "중복 수배", type: "DUP", enabled: true, scope: "카 · 카 도어", minPeers: 5,
          desc: "같은 품번이 서로 다른 경로로 여러 번 전개되면 알립니다.",
          m: clone(METRIC_TEMPLATE.DUP), notify: { crit: true, warn: false }, target: "수배로직설계팀",
          hist: [["2026-06-11", "규칙 생성"]] },
        { id: "R-06", name: "정지층수(EL_STOP) 범위 검사", type: "RANGE", enabled: false, scope: "영업사양 입력 (속성값 변경 단계)", minPeers: 0,
          desc: "BOM 을 계산하기 전, 속성값을 바꾸는 순간 정지층수가 허용 범위 밖이면 막습니다.",
          m: assign(clone(METRIC_TEMPLATE.RANGE), { label: "정지층수 EL_STOP", unit: "층", dmax: 60, lo: 2, hi: 40 }),
          pop: { center: 14, spread: 7, min: 2, max: 38, typos: [122, 0, 210, 55, 1, 99] },
          notify: { crit: true, warn: false }, target: "속성값 입력자",
          suggested: { from: "3F 원인 추적 · TEST-632560", why: "EL_STOP 을 12 대신 122 로 입력해 브라켓이 12배 수배된 사례에서 제안되었습니다." },
          hist: [["2026-10-17", "원인 추적에서 제안됨"]] },
        { id: "R-07", name: "승강행정 범위 검사", type: "RANGE", enabled: true, scope: "영업사양 입력 (속성값 변경 단계)", minPeers: 0,
          desc: "승강행정(m)이 비정상적으로 크거나 작으면 입력 단계에서 막습니다.",
          m: assign(clone(METRIC_TEMPLATE.RANGE), { label: "승강행정", unit: "m", step: 1, smax: 300, dmax: 200, lo: 3, hi: 150 }),
          pop: { center: 45, spread: 25, min: 4, max: 140, typos: [1200, 0, 450, 980] },
          notify: { crit: true, warn: false }, target: "속성값 입력자",
          hist: [["2026-08-30", "규칙 생성"]] }
    ];

    /** 규칙 목록을 불러온다. 저장한 적이 있으면 그 값을, 없으면 샘플을 쓴다. */
    function loadRules() {
        try {
            var s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
            if (s && s.length) return s;
        } catch (e) { /* 저장값이 깨졌으면 샘플로 */ }
        return clone(SAMPLE_RULES);
    }

    /** 규칙 목록을 저장한다. (지금은 브라우저에만 — 서버 연동 시 여기만 바꾸면 됨) */
    function saveRules(list) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (e) { /* 저장 불가 환경 무시 */ }
    }

    /* =========================================================
       3. 시뮬레이션용 샘플 호기 만들기
       ========================================================= */

    /**
     * 규칙에 대입해 볼 "최근 30일 호기들"의 측정값을 만든다.
     * 각 항목은 { v: 측정값, real: 실제 이상 여부 } 이다.
     *   - real 은 담당자가 확인을 마친 결과(정답)라고 가정한다.
     *   - 정상인데 값이 애매한 호기(오탐 함정)와, 이상인데 값이 작은 호기(놓치기 쉬운 사례)를 일부러 섞는다.
     * 같은 규칙은 항상 같은 결과가 나오도록 규칙 ID 로 난수를 고정한다.
     */
    function makePopulation(rule) {
        var rnd = rng(hashInt(rule.id + rule.type)), out = [], i;
        var add = function (v, real) { out.push({ v: v, real: real }); };

        if (rule.type === "QTY") {
            for (i = 0; i < 380; i++) add(Math.exp(gauss(rnd) * 0.16), false);                // 정상 : 평균 근처 (1배 ±)
            for (i = 0; i < 14; i++)  add(1.4 + rnd() * 0.9, false);                          // 정상인데 애매함 (옵션 사양 등)
            for (i = 0; i < 22; i++)  add(1.6 + Math.exp(gauss(rnd) * 0.7) * 1.6, true);      // 실제 이상
        } else if (rule.type === "MISSING") {
            for (i = 0; i < 380; i++) add(clamp(100 + gauss(rnd) * 7, 70, 125), false);
            for (i = 0; i < 10; i++)  add(45 + rnd() * 30, false);                            // 정상 : 옵션이 빠진 사양
            for (i = 0; i < 16; i++)  add(rnd() < .7 ? 0 : rnd() * 35, true);                 // 실제 누락 (대부분 0%)
            for (i = 0; i < 3; i++)   add(40 + rnd() * 15, true);                             // 일부만 누락
        } else if (rule.type === "SPEC") {
            for (i = 0; i < 380; i++) add(0, false);
            for (i = 0; i < 20; i++)  add(1, i < 8);                                          // 1건 불일치 : 일부는 허용된 예외
            for (i = 0; i < 12; i++)  add(2 + Math.floor(rnd() * 4), true);
        } else if (rule.type === "DUP") {
            for (i = 0; i < 390; i++) add(1, false);
            for (i = 0; i < 14; i++)  add(2, i < 10);                                         // 2회 : 일부는 실제로 2개 설치
            for (i = 0; i < 4; i++)   add(3, true);
        } else {   // RANGE : 정상 입력 + 오타
            var p = rule.pop || { center: 20, spread: 8, min: 1, max: 50, typos: [200, 0] };
            for (i = 0; i < 400; i++) add(clamp(Math.round(p.center + gauss(rnd) * p.spread), p.min, p.max), false);
            p.typos.forEach(function (v) { add(v, true); });
        }
        return out;
    }

    /* =========================================================
       4. 판정 · 집계
       ========================================================= */

    /**
     * 측정값 하나를 규칙으로 판정한다.
     * @return "crit"(위험) / "warn"(경고) / null(정상)
     */
    function judge(m, v) {
        if (m.dir === "above") return v >= m.crit ? "crit" : v >= m.warn ? "warn" : null;
        if (m.dir === "below") return v <= m.crit ? "crit" : v <= m.warn ? "warn" : null;
        return (v < m.lo || v > m.hi) ? "crit" : null;   // range : 범위 밖이면 바로 위험
    }

    /**
     * 규칙 기준(m)을 샘플 호기 전체에 대입해 결과를 센다.
     * @return {
     *   flagged : 이상으로 잡은 수,   crit : 그중 위험 수,
     *   tp : 잡았고 실제 이상 (정탐),  fp : 잡았는데 정상 (오탐),  fn : 못 잡은 실제 이상 (놓침),
     *   precision : 잡은 것 중 실제 이상 비율,  recall : 실제 이상 중 잡은 비율
     * }
     */
    function simulate(m, pop) {
        var r = { flagged: 0, crit: 0, tp: 0, fp: 0, fn: 0 };
        pop.forEach(function (p) {
            var z = judge(m, p.v);
            if (z) { r.flagged++; if (z === "crit") r.crit++; if (p.real) r.tp++; else r.fp++; }
            else if (p.real) r.fn++;
        });
        r.precision = r.flagged ? r.tp / r.flagged : 1;
        r.recall = (r.tp + r.fn) ? r.tp / (r.tp + r.fn) : 1;
        return r;
    }

    /* =========================================================
       5. 상태
       ========================================================= */
    var saved = loadRules();          // 저장된 규칙 (기준점)
    var drafts = {};                  // 편집 중인 규칙 { id: 규칙 }
    var pops = {};                    // 시뮬레이션 샘플 캐시 { id: [...] }
    var current = null;               // 선택한 규칙 ID
    var typeFilter = null;            // 목록 유형 필터

    function savedOf(id) { return saved.filter(function (r) { return r.id === id; })[0]; }
    /** 편집 중인 사본을 돌려준다. 처음 열 때 저장본을 복사해 둔다. */
    function draftOf(id) { if (!drafts[id]) drafts[id] = clone(savedOf(id)); return drafts[id]; }
    /** 저장 안 한 변경이 있는지 */
    function isDirty(id) { return !!drafts[id] && JSON.stringify(drafts[id]) !== JSON.stringify(savedOf(id)); }
    function popOf(rule) { var k = rule.id + rule.type; if (!pops[k]) pops[k] = makePopulation(rule); return pops[k]; }

    /* =========================================================
       6. 화면 그리기
       ========================================================= */

    /** 상단 요약 : 켜진 규칙 수, 30일 예상 탐지, 평균 오탐률 (저장된 규칙 기준) */
    function renderStats() {
        var on = saved.filter(function (r) { return r.enabled; });
        var hits = 0, fpSum = 0, fpN = 0;
        on.forEach(function (r) {
            var s = simulate(r.m, popOf(r));
            hits += s.flagged;
            if (s.flagged) { fpSum += s.fp / s.flagged; fpN++; }
        });
        $("sOn").textContent = on.length;
        $("sAll").textContent = "/ " + saved.length;
        $("sHits").textContent = hits;
        $("sFp").textContent = fpN ? Math.round(fpSum / fpN * 100) : 0;
    }

    /** 왼쪽 규칙 목록 (유형 필터 · 켜고 끄기 · 저장 안 한 표시) */
    function renderList() {
        $("chips").innerHTML = ['<button type="button" class="chip" data-t="" aria-pressed="' + (!typeFilter) + '">전체</button>'].concat(TYPES.map(function (t) {
            return '<button type="button" class="chip" data-t="' + t + '" aria-pressed="' + (typeFilter === t) + '" style="--c:var(--t-' + t + ')"><i></i>' + TYPE_NAME[t] + '</button>';
        })).join("");
        $("chips").querySelectorAll(".chip").forEach(function (c) {
            c.addEventListener("click", function () { typeFilter = c.dataset.t || null; renderList(); });
        });

        var list = saved.filter(function (r) { return !typeFilter || r.type === typeFilter; });
        $("ruleList").innerHTML = list.map(function (s) {
            var r = drafts[s.id] || s;
            return '<li><div class="rule' + (r.enabled ? "" : " off") + '" role="button" tabindex="0" data-id="' + r.id + '" aria-current="' + (r.id === current) + '" style="--c:var(--t-' + r.type + ')">' +
                '<span class="top"><span class="id">' + r.id + '</span><span class="nm">' + esc(r.name) + '</span>' + (isDirty(r.id) ? '<span class="dirty" title="저장 안 한 변경"></span>' : '') + '</span>' +
                '<label class="sw" title="켜기/끄기"><input type="checkbox" data-sw="' + r.id + '"' + (r.enabled ? " checked" : "") + ' aria-label="' + esc(r.name) + ' 켜기"><span class="t"></span><span class="k"></span></label>' +
                '<span class="meta"><span>' + TYPE_NAME[r.type] + '</span><span class="cond">' + esc(condText(r.m)) + '</span>' +
                    (r.suggested && !r.enabled ? '<span class="badge sug">제안됨</span>' : '') + (r.custom ? '<span class="badge new">새 규칙</span>' : '') + '</span>' +
            '</div></li>';
        }).join("") || '<li class="help" style="padding:16px">이 유형의 규칙이 없습니다.</li>';

        $("ruleList").querySelectorAll(".rule").forEach(function (el) {
            el.addEventListener("click", function (e) { if (!e.target.closest(".sw")) select(el.dataset.id); });
            el.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && !e.target.closest(".sw")) { e.preventDefault(); select(el.dataset.id); } });
        });
        $("ruleList").querySelectorAll("[data-sw]").forEach(function (sw) {
            sw.addEventListener("change", function () {
                draftOf(sw.dataset.sw).enabled = sw.checked;
                if (sw.dataset.sw !== current) select(sw.dataset.sw); else { renderEditor(); renderList(); }
            });
        });
    }

    /** 기준값을 한 줄 요약 (목록에 표시) */
    function condText(m) {
        if (m.dir === "range") return m.lo + "~" + m.hi + m.unit + " 밖";
        return (m.dir === "above" ? "≥ " : "≤ ") + fmt(m.warn) + " / " + fmt(m.crit) + m.unit;
    }

    /** 규칙 선택 : 목록 표시를 바꾸고 편집기를 다시 그린다 */
    function select(id) {
        current = id;
        history.replaceState(null, "", location.pathname + "?id=" + encodeURIComponent(id));
        renderList();
        renderEditor();
    }

    /** 오른쪽 편집기 전체 (머리 · 제안 · 기본 정보 · 판정 기준 · 시뮬레이션 · 알림 · 이력) */
    function renderEditor() {
        var r = draftOf(current), s = savedOf(current), m = r.m;
        var dirty = isDirty(current);

        $("editor").innerHTML =
            '<section class="card" style="--c:var(--t-' + r.type + ')">' +
                '<div class="ed-head">' +
                    '<span class="tbadge">' + TYPE_NAME[r.type] + '</span>' +
                    '<div><h2>' + esc(r.name) + '</h2><span class="id">' + r.id + ' · ' + (r.enabled ? "켜짐" : "꺼짐") + '</span></div>' +
                    '<div class="acts">' +
                        (dirty ? '<span class="dirty-note"><i></i>저장 안 한 변경</span>' : '') +
                        (r.custom ? '<button type="button" class="btn btn-sm btn-danger" id="btnDel">삭제</button>' : '') +
                        '<button type="button" class="btn btn-sm" id="btnRevert"' + (dirty ? "" : " disabled") + '>되돌리기</button>' +
                        '<button type="button" class="btn btn-sm btn-solid" id="btnSave"' + (dirty ? "" : " disabled") + '>저장</button>' +
                    '</div>' +
                '</div>' +
                (r.suggested && !s.enabled ?
                    '<div class="suggest">' + svg('<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>', 22) +
                    '<div><b>' + esc(r.suggested.from) + ' 에서 제안된 규칙입니다</b><span>' + esc(r.suggested.why) + ' 켜면 BOM 계산 전, 속성값을 바꾸는 순간에 막습니다.</span></div>' +
                    '<button type="button" class="btn btn-ok" id="btnApply">적용하기</button></div>' : '') +
            '</section>' +

            // 기본 정보
            '<section class="card sec" aria-labelledby="secInfo">' +
                '<div class="sec-h"><h3 id="secInfo">기본 정보</h3></div>' +
                '<div class="form">' +
                    '<div class="fld"><label for="fName">규칙 이름</label><input type="text" id="fName" value="' + esc(r.name) + '"></div>' +
                    '<div class="fld"><label for="fType">유형</label><select id="fType"' + (r.custom ? "" : " disabled") + '>' +
                        TYPES.map(function (t) { return '<option value="' + t + '"' + (t === r.type ? " selected" : "") + '>' + TYPE_NAME[t] + '</option>'; }).join("") + '</select>' +
                        (r.custom ? '' : '<span class="help">기본 규칙은 유형을 바꿀 수 없습니다.</span>') + '</div>' +
                    '<div class="fld"><label for="fScope">적용 대상</label><select id="fScope">' +
                        SCOPES.map(function (sc) { return '<option' + (sc === r.scope ? " selected" : "") + '>' + sc + '</option>'; }).join("") + '</select></div>' +
                    (m.dir === "range" ? '<div class="fld"><span class="lb">검사 시점</span><span class="help" style="padding-top:10px">원사이클 3F 속성값 변경 직후 (BOM 계산 전)</span></div>' :
                        '<div class="fld"><label for="fPeers">최소 비교 호기 수</label><input type="number" id="fPeers" min="1" max="100" value="' + r.minPeers + '"><span class="help">같은 사양 호기가 이보다 적으면 판정하지 않습니다.</span></div>') +
                    '<div class="fld full"><label for="fDesc">설명</label><textarea id="fDesc">' + esc(r.desc) + '</textarea></div>' +
                '</div>' +
            '</section>' +

            // 판정 기준 + 시뮬레이션
            '<section class="card sec" aria-labelledby="secRule">' +
                '<div class="sec-h"><h3 id="secRule">판정 기준</h3><span class="sub">그래프의 세로선을 끌거나 아래 값을 바꾸면 결과가 바로 바뀝니다</span></div>' +
                '<div class="sentence" id="sentence"></div>' +
                '<div class="th-grid" id="thGrid">' + thresholdInputs(r, s) + '</div>' +
                '<div class="sec-h" style="margin-top:22px"><h3>최근 30일 호기에 대입해 보기</h3><span class="sub" id="simSub"></span></div>' +
                '<div class="sim" id="sim"></div>' +
                '<div class="sim-legend"><span><i style="background:rgba(127,227,255,.45)"></i>정상 호기</span><span><i style="background:#fff"></i>밝은 부분 = 실제 이상 (확인된 사례)</span>' +
                    (m.dir === "range" ? '<span><i style="background:var(--ok-dim);border:1px dashed var(--ok)"></i>허용 범위</span>' :
                    '<span><i style="background:var(--warn)"></i>경고 구간</span><span><i style="background:var(--alert)"></i>위험 구간</span>') +
                    '<span>점선 = 저장된 기준</span></div>' +
                '<div class="res" id="res"></div>' +
                '<div id="advice"></div>' +
            '</section>' +

            // 알림 · 이력
            '<div class="two">' +
                '<section class="card sec" aria-labelledby="secNoti"><div class="sec-h"><h3 id="secNoti">알림</h3></div>' +
                    '<label class="ck"><input type="checkbox" id="nCrit"' + (r.notify.crit ? " checked" : "") + '>위험 판정 시 바로 알림</label>' +
                    (m.dir === "range" ? '' : '<label class="ck"><input type="checkbox" id="nWarn"' + (r.notify.warn ? " checked" : "") + '>경고 판정도 알림</label>') +
                    '<div class="fld" style="margin-top:8px"><label for="nTarget">알림 받는 사람</label><input type="text" id="nTarget" value="' + esc(r.target) + '"></div>' +
                '</section>' +
                '<section class="card sec" aria-labelledby="secHist"><div class="sec-h"><h3 id="secHist">변경 이력</h3></div>' +
                    '<ul class="hist">' + (r.hist || []).map(function (h) { return '<li><time>' + h[0] + '</time><span>' + esc(h[1]) + '</span></li>'; }).join("") + '</ul>' +
                '</section>' +
            '</div>';

        bindEditor();
        renderSim();
    }

    /** 경고 · 위험 기준 입력칸 (슬라이더 + 숫자). range 규칙은 허용 하한 · 상한 */
    function thresholdInputs(r, s) {
        var m = r.m;
        var keys = m.dir === "range" ? [["lo", "허용 하한", "var(--ok)"], ["hi", "허용 상한", "var(--ok)"]] : [["warn", "경고 기준", "var(--warn)"], ["crit", "위험 기준", "var(--alert)"]];
        return keys.map(function (k) {
            return '<div class="th" style="--c:' + k[2] + '"><div class="th-top"><span class="dot"></span><b>' + k[1] + '</b>' +
                '<input type="number" data-k="' + k[0] + '" step="' + m.step + '" min="' + m.smin + '" max="' + m.smax + '" value="' + m[k[0]] + '" aria-label="' + k[1] + '"><span class="u">' + m.unit + '</span></div>' +
                '<input type="range" data-k="' + k[0] + '" step="' + m.step + '" min="' + m.smin + '" max="' + m.smax + '" value="' + m[k[0]] + '" aria-label="' + k[1] + ' 슬라이더">' +
                '<div class="was">저장된 값 ' + fmt(s.m[k[0]]) + m.unit + '</div></div>';
        }).join("");
    }

    /** 편집기 입력 이벤트 연결 */
    function bindEditor() {
        var r = draftOf(current);
        var onChange = function () { refreshHeader(); renderList(); };

        $("fName").addEventListener("input", function () { r.name = this.value; onChange(); });
        $("fScope").addEventListener("change", function () { r.scope = this.value; onChange(); });
        $("fDesc").addEventListener("input", function () { r.desc = this.value; onChange(); });
        if ($("fPeers")) $("fPeers").addEventListener("input", function () { r.minPeers = +this.value || 1; onChange(); });
        $("fType").addEventListener("change", function () {   // 새 규칙만 : 유형을 바꾸면 기준값 틀도 바꿈
            r.type = this.value; r.m = clone(METRIC_TEMPLATE[r.type]); renderEditor(); renderList();
        });
        $("nCrit").addEventListener("change", function () { r.notify.crit = this.checked; onChange(); });
        if ($("nWarn")) $("nWarn").addEventListener("change", function () { r.notify.warn = this.checked; onChange(); });
        $("nTarget").addEventListener("input", function () { r.target = this.value; onChange(); });

        $("thGrid").querySelectorAll("input[data-k]").forEach(function (inp) {
            inp.addEventListener("input", function () { setThreshold(inp.dataset.k, +inp.value, inp); });
        });

        $("btnSave").addEventListener("click", function () { save(); });
        $("btnRevert").addEventListener("click", function () { delete drafts[current]; renderEditor(); renderList(); toast("저장된 값으로 되돌렸습니다"); });
        if ($("btnDel")) $("btnDel").addEventListener("click", removeRule);
        if ($("btnApply")) $("btnApply").addEventListener("click", applySuggested);
    }

    /**
     * 기준값 하나를 바꾼다. (입력칸 · 슬라이더 · 그래프 끌기 모두 여기로 모임)
     * 경고 · 위험 순서가 뒤집히지 않도록 맞추고, 같은 값을 쓰는 다른 입력칸도 함께 맞춘다.
     */
    function setThreshold(k, v, from) {
        var r = draftOf(current), m = r.m;
        if (isNaN(v)) return;
        v = clamp(roundStep(v, m.step), m.smin, m.smax);
        m[k] = v;
        if (m.dir === "above" && m.crit < m.warn) { if (k === "warn") m.crit = m.warn; else m.warn = m.crit; }
        if (m.dir === "below" && m.crit > m.warn) { if (k === "warn") m.crit = m.warn; else m.warn = m.crit; }
        if (m.dir === "range" && m.lo >= m.hi) { if (k === "lo") m.hi = m.lo + m.step; else m.lo = m.hi - m.step; }
        $("thGrid").querySelectorAll("input[data-k]").forEach(function (inp) { if (inp !== from) inp.value = m[inp.dataset.k]; });
        refreshHeader();
        renderList();
        renderSim();
    }

    /** 머리의 저장 버튼 · "저장 안 한 변경" 표시만 다시 그림 (입력 중 커서가 튀지 않도록 편집기 전체는 안 그림) */
    function refreshHeader() {
        var dirty = isDirty(current), acts = $("editor").querySelector(".acts");
        $("btnSave").disabled = !dirty; $("btnRevert").disabled = !dirty;
        var note = acts.querySelector(".dirty-note");
        if (dirty && !note) acts.insertAdjacentHTML("afterbegin", '<span class="dirty-note"><i></i>저장 안 한 변경</span>');
        if (!dirty && note) note.remove();
        $("editor").querySelector(".ed-head h2").textContent = draftOf(current).name;
    }

    /**
     * 시뮬레이션 그리기
     *   1) 판정 문장 ("동일 사양 평균의 1.8배 이상이면 경고 …")
     *   2) 분포 그래프 : 샘플 호기 측정값의 분포 + 기준 세로선(끌어서 조정) + 저장된 기준(점선)
     *   3) 결과 숫자 : 탐지 · 위험 · 정탐 · 오탐 · 놓침 (저장값 대비 증감)
     *   4) 조언 문장
     */
    function renderSim() {
        var r = draftOf(current), s = savedOf(current), m = r.m, pop = popOf(r);
        var now = simulate(m, pop), before = simulate(s.m, popOf(s));

        // 1) 판정 문장
        $("sentence").innerHTML = m.dir === "range"
            ? esc(m.label) + ' 값이 <b class="r">' + fmt(m.lo) + ' ~ ' + fmt(m.hi) + m.unit + '</b> 밖이면 <b class="c">위험</b> 으로 보고 입력을 막습니다.'
            : esc(m.label) + '가 <b class="w">' + fmt(m.warn) + m.unit + '</b> ' + (m.dir === "above" ? "이상" : "이하") + '이면 <b class="w">경고</b>, ' +
              '<b class="c">' + fmt(m.crit) + m.unit + '</b> ' + (m.dir === "above" ? "이상" : "이하") + '이면 <b class="c">위험</b> 입니다.';

        // 2) 분포 그래프
        drawHistogram(m, s.m, pop);
        $("simSub").textContent = "샘플 " + pop.length + "호기 · 그중 확인된 실제 이상 " + (now.tp + now.fn) + "건";

        // 3) 결과
        var box = function (cls, label, v, b, unit, lowerBetter) {
            var d = v - b, txt = d === 0 ? "저장값과 같음" : (d > 0 ? "+" : "") + (unit === "%" ? d.toFixed(0) : d) + unit + " vs 저장값";
            return '<div class="rbox ' + cls + '"><small>' + label + '</small><b class="tnum">' + v + unit + '</b><div class="d ' + (d === 0 ? "" : (d > 0) === !lowerBetter ? "down" : "up") + '">' + txt + '</div></div>';
        };
        $("res").innerHTML =
            box("", "탐지", now.flagged, before.flagged, "건", false) +
            box("", "그중 위험", now.crit, before.crit, "건", false) +
            box("tp", "정탐 (실제 이상)", now.tp, before.tp, "건", false) +
            box("fp", "오탐 (정상인데 잡음)", now.fp, before.fp, "건", true) +
            box("fn", "놓침 (못 잡은 이상)", now.fn, before.fn, "건", true);

        // 4) 조언
        var tips = [];
        if (now.fn > 0) tips.push("실제 이상 <b>" + now.fn + "건</b>을 놓치고 있습니다. 기준을 " + (m.dir === "below" ? "높이면" : m.dir === "range" ? "좁히면" : "낮추면") + " 잡을 수 있지만 오탐이 늘 수 있습니다.");
        if (now.fp > now.tp && now.flagged) tips.push("잡은 것 중 오탐이 더 많습니다 (정확도 " + Math.round(now.precision * 100) + "%). 기준을 조금 " + (m.dir === "below" ? "낮춰" : "올려") + " 보세요.");
        if (!tips.length) tips.push("실제 이상 " + Math.round(now.recall * 100) + "%를 잡고, 잡은 것의 " + Math.round(now.precision * 100) + "%가 실제 이상입니다. 균형이 좋은 기준입니다.");
        $("advice").innerHTML = (r.enabled ? "" : '<p class="off-note">이 규칙은 지금 꺼져 있어 실제로는 탐지하지 않습니다. 결과는 켰을 때의 예상입니다.</p>') +
            '<p class="advice">' + svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>', 16) + '<span>' + tips.join(" ") + '</span></p>';
    }

    /**
     * 분포 그래프 (SVG)
     *   - 가로축 : 측정값, 세로축 : 호기 수 (제곱근 눈금 — 소수의 이상도 보이도록)
     *   - 막대 색 : 그 구간이 정상 / 경고 / 위험 중 어디인지
     *   - 막대 위 흰 부분 : 그 구간의 "실제 이상" 호기 수
     *   - 세로선 손잡이를 마우스로 끌면 setThreshold 로 기준값이 바뀜
     */
    function drawHistogram(m, sm, pop) {
        var box = $("sim");
        var W = Math.max(320, box.clientWidth), H = 230, padL = 40, padR = 16, padT = 26, padB = 30;
        var plotW = W - padL - padR, plotH = H - padT - padB;
        var lo = m.dmin, hi = m.dmax;
        var isInt = m.step >= 1 && (hi - lo) <= 60;
        var nb = isInt ? Math.round(hi - lo) + 1 : 40;
        var bw = (hi - lo) / (isInt ? nb - 1 : nb);

        // 구간별 개수 (범위를 넘는 값은 마지막 칸, 모자란 값은 첫 칸)
        var bins = [];
        for (var i = 0; i < nb; i++) bins.push({ n: 0, real: 0, v: isInt ? lo + i * bw : lo + (i + .5) * bw });
        var over = false;
        pop.forEach(function (p) {
            var idx = isInt ? Math.round((p.v - lo) / bw) : Math.floor((p.v - lo) / bw);
            if (idx >= nb) { idx = nb - 1; over = true; }
            if (idx < 0) idx = 0;
            bins[idx].n++; if (p.real) bins[idx].real++;
        });
        if (over) bins[nb - 1].v = Math.max(bins[nb - 1].v, hi + bw);   // 넘친 칸은 "범위 밖" 판정이 되도록

        var maxN = Math.max.apply(null, bins.map(function (b) { return b.n; }).concat([1]));
        var yh = function (n) { return Math.sqrt(n) / Math.sqrt(maxN) * plotH; };
        var xOf = function (v) { return padL + (v - lo) / (hi - lo) * plotW; };
        var colW = plotW / nb;
        var out = [];

        // 허용 범위 띠 (range)
        if (m.dir === "range") out.push('<rect x="' + xOf(m.lo).toFixed(1) + '" y="' + padT + '" width="' + Math.max(0, xOf(Math.min(m.hi, hi)) - xOf(m.lo)).toFixed(1) + '" height="' + plotH + '" fill="rgba(94,240,166,.07)" stroke="rgba(94,240,166,.35)" stroke-dasharray="3 4"/>');

        // 막대
        bins.forEach(function (b, i) {
            if (!b.n) return;
            var z = judge(m, b.v), x = padL + colW * i + 1, w = Math.max(1, colW - 2);
            var col = z === "crit" ? "#FF5A36" : z === "warn" ? "#FFB020" : "rgba(127,227,255,.45)";
            var h = yh(b.n), hr = b.real ? Math.max(3, yh(b.n) - yh(b.n - b.real)) : 0;
            out.push('<rect x="' + x.toFixed(1) + '" y="' + (padT + plotH - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + col + '"><title>' + (over && i === nb - 1 ? fmt(hi) + m.unit + " 이상" : (isInt ? fmt(b.v) : fmt(lo + i * bw) + "~" + fmt(lo + (i + 1) * bw)) + m.unit) + " : " + b.n + "호기 (실제 이상 " + b.real + ")</title></rect>");
            // 실제 이상 부분 : 같은 구간 색의 밝은 버전 (위험 구간이면 밝은 빨강 → 구간 색이 가려지지 않음)
            var realCol = z === "crit" ? "#FFC9BC" : z === "warn" ? "#FFE3A6" : "#FFFFFF";
            if (hr) out.push('<rect x="' + x.toFixed(1) + '" y="' + (padT + plotH - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hr.toFixed(1) + '" rx="2" fill="' + realCol + '" stroke="' + col + '" stroke-width="1.5" pointer-events="none"/>');
        });

        // 가로축
        out.push('<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (W - padR) + '" y2="' + (padT + plotH) + '" stroke="rgba(255,255,255,.18)"/>');
        for (var t = 0; t <= 4; t++) {
            var tv = lo + (hi - lo) * t / 4;
            out.push('<text x="' + xOf(tv).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#7C8596" font-family="Consolas, monospace">' + fmt(roundStep(tv, m.step)) + (t === 4 && over ? "+" : "") + m.unit + '</text>');
        }

        // 저장된 기준 (점선) + 지금 기준 (손잡이)
        var keys = m.dir === "range" ? [["lo", "#5EF0A6", "하한"], ["hi", "#5EF0A6", "상한"]] : [["warn", "#FFB020", "경고"], ["crit", "#FF5A36", "위험"]];
        keys.forEach(function (k) {
            var sx = xOf(clamp(sm[k[0]], lo, hi));
            out.push('<line x1="' + sx.toFixed(1) + '" y1="' + padT + '" x2="' + sx.toFixed(1) + '" y2="' + (padT + plotH) + '" stroke="' + k[1] + '" stroke-opacity=".45" stroke-dasharray="3 4"/>');
        });
        keys.forEach(function (k) {
            var x = xOf(clamp(m[k[0]], lo, hi));
            out.push('<g class="hd" data-k="' + k[0] + '" tabindex="0" role="slider" aria-label="' + k[2] + ' 기준" aria-valuenow="' + m[k[0]] + '" aria-valuemin="' + m.smin + '" aria-valuemax="' + m.smax + '">' +
                '<rect x="' + (x - 10).toFixed(1) + '" y="' + (padT - 22) + '" width="20" height="' + (plotH + 22) + '" fill="transparent"/>' +
                '<line x1="' + x.toFixed(1) + '" y1="' + (padT - 6) + '" x2="' + x.toFixed(1) + '" y2="' + (padT + plotH) + '" stroke="' + k[1] + '" stroke-width="2.4"/>' +
                '<rect x="' + (x - 26).toFixed(1) + '" y="' + (padT - 24) + '" width="52" height="19" rx="6" fill="' + k[1] + '"/>' +
                '<text x="' + x.toFixed(1) + '" y="' + (padT - 10) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#04060A" font-family="Consolas, monospace">' + fmt(m[k[0]]) + m.unit + '</text></g>');
        });

        box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="측정값 분포와 판정 기준">' + out.join("") + '</svg>';

        // 끌기 : 손잡이를 누른 채 움직이면 그 위치 값으로 기준을 바꾼다
        var svgEl = box.querySelector("svg");
        box.querySelectorAll(".hd").forEach(function (h) {
            h.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                var k = h.dataset.k;
                var move = function (ev) {
                    var rc = svgEl.getBoundingClientRect(), x = (ev.clientX - rc.left) * (W / rc.width);
                    setThreshold(k, lo + (x - padL) / plotW * (hi - lo), null);
                };
                var up = function () { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
                window.addEventListener("pointermove", move);
                window.addEventListener("pointerup", up);
            });
            // 키보드 : 손잡이에 포커스 후 ← → 로 한 칸씩
            h.addEventListener("keydown", function (e) {
                if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
                e.preventDefault();
                var k = h.dataset.k, m2 = draftOf(current).m;
                setThreshold(k, m2[k] + (e.key === "ArrowRight" ? m2.step : -m2.step), null);
                var again = $("sim").querySelector('.hd[data-k="' + k + '"]'); if (again) again.focus();
            });
        });
    }

    /* =========================================================
       7. 저장 · 적용 · 새 규칙 · 삭제
       ========================================================= */

    /**
     * 지금 편집 중인 규칙을 저장한다. 변경 이력에 한 줄 남기고, 되돌리기를 제공한다.
     * @param msg 알림에 띄울 문장 (없으면 "R-01 저장 · 위험 2.5배 → 3배" 처럼 자동 작성)
     */
    function save(msg) {
        var r = draftOf(current), before = clone(savedOf(current));
        var note = changeNote(before, r);
        r.hist = [[today(), note]].concat(r.hist || []);
        replaceSaved(clone(r));
        delete drafts[current];
        saveRules(saved);
        renderAll();
        toast(msg || r.id + " 저장 · " + note, function () {   // 되돌리기 : 저장 전 상태로
            replaceSaved(before); delete drafts[before.id]; saveRules(saved); renderAll();
        });
    }

    /** 무엇이 바뀌었는지 사람이 읽을 수 있는 한 줄로 */
    function changeNote(a, b) {
        var parts = [], u = b.m.unit;
        if (a.enabled !== b.enabled) parts.push(b.enabled ? "켬" : "끔");
        ["warn", "crit", "lo", "hi"].forEach(function (k) {
            if (a.m[k] !== undefined && a.m[k] !== b.m[k]) parts.push({ warn: "경고", crit: "위험", lo: "하한", hi: "상한" }[k] + " " + fmt(a.m[k]) + u + " → " + fmt(b.m[k]) + u);
        });
        if (a.name !== b.name) parts.push("이름 변경");
        if (a.scope !== b.scope) parts.push("대상 : " + b.scope);
        return parts.join(", ") || "설정 변경";
    }

    /** 3F 원인 추적에서 제안된 규칙을 바로 켜고 저장한다 */
    function applySuggested() {
        draftOf(current).enabled = true;
        save("적용했습니다 · 이제 속성값 변경 단계에서 범위 밖 입력을 막습니다");
    }

    /** 새 규칙 만들기 (수량 급증 틀로 시작) */
    function newRule() {
        var n = 1; while (savedOf("R-" + pad(saved.length + n))) n++;
        var id = "R-" + pad(saved.length + n);
        var r = { id: id, name: "새 규칙", type: "QTY", enabled: false, custom: true, scope: "전체 자재", minPeers: 10,
                  desc: "", m: clone(METRIC_TEMPLATE.QTY), notify: { crit: true, warn: false }, target: "수배로직설계팀", hist: [[today(), "규칙 생성"]] };
        saved.push(r);
        saveRules(saved);
        typeFilter = null;
        select(id);
        $("fName").focus(); $("fName").select();
    }

    /** 직접 만든 규칙만 삭제 (기본 규칙은 끄기만 가능) */
    function removeRule() {
        var r = savedOf(current);
        if (!r || !r.custom || !confirm("'" + r.name + "' 규칙을 삭제할까요?")) return;
        saved = saved.filter(function (x) { return x.id !== r.id; });
        delete drafts[r.id];
        saveRules(saved);
        select(saved[0].id);
        renderStats();
        toast("삭제했습니다");
    }

    function replaceSaved(r) { saved = saved.map(function (x) { return x.id === r.id ? r : x; }); }
    function renderAll() { renderStats(); renderList(); renderEditor(); }

    $("btnNew").addEventListener("click", newRule);
    window.addEventListener("beforeunload", function (e) {   // 저장 안 한 변경이 있으면 나가기 전에 확인
        if (Object.keys(drafts).some(isDirty)) { e.preventDefault(); e.returnValue = ""; }
    });
    var rt = null;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (current) renderSim(); }, 120); });

    /* =========================================================
       8. 유틸
       ========================================================= */
    var toastTimer = null, undoFn = null;
    /** 화면 아래 알림. undo 함수를 주면 "되돌리기" 버튼이 함께 뜬다 */
    function toast(msg, undo) {
        $("toastMsg").textContent = msg;
        undoFn = undo || null;
        $("toastUndo").hidden = !undo;
        $("toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, undo ? 5000 : 2800);
    }
    $("toastUndo").addEventListener("click", function () { if (undoFn) undoFn(); undoFn = null; $("toast").classList.remove("show"); });

    function svg(path, size) { return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>'; }
    function clone(o) { return JSON.parse(JSON.stringify(o)); }
    function assign(a, b) { for (var k in b) a[k] = b[k]; return a; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function roundStep(v, step) { var d = (String(step).split(".")[1] || "").length; return +(Math.round(v / step) * step).toFixed(d); }
    function fmt(v) { return (Math.round(v * 10) / 10).toLocaleString("ko-KR"); }
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    /** 표준정규분포 난수 (평균 0, 표준편차 1) */
    function gauss(rnd) { var u = 1 - rnd(), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
    /** 문자열 → 고정 숫자 (같은 규칙은 같은 샘플이 나오도록) */
    function hashInt(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    /** 씨앗값으로 시작하는 난수 생성기 (mulberry32) */
    function rng(seed) {
        return function () {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    /* =========================================================
       시작 : ?id= 가 있으면 그 규칙, 없으면 제안된 규칙(없으면 첫 규칙)을 연다
       ========================================================= */
    var qid = new URLSearchParams(location.search).get("id");
    var first = savedOf(qid) ? qid : ((saved.filter(function (r) { return r.suggested && !r.enabled; })[0] || saved[0]).id);
    renderStats();
    select(first);
})();
</script>
</body>
