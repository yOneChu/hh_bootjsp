<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/resources/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로직 비교 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 15px; height: 15px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }

        /* 커스텀 팝오버 스타일 */
        #custom-popover {
            display: none;
            position: fixed;
            z-index: 1000;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            /*max-width: 500px;*/
            width: max-content;   /* 내용만큼 넓어짐 */
            min-width: 250px;     /* 너무 작아지는 것 방지 */
            max-width: 1000px;     /* 너무 커지는 것 방지 */

            font-size: 0.875rem;
            pointer-events: none;
            white-space: pre-line;
        }
    </style>


</head>
<body class="bg-slate-50 p-6">

<div class="max-w-full mx-auto bg-white rounded-xl shadow-md overflow-hidden flex flex-col h-[90vh]">
    <div class="p-6 border-b border-gray-200 bg-slate-800 text-white flex justify-between items-center">
        <h1 class="text-2xl font-bold">로직 비교 분석</h1>
        <div class="flex gap-4 text-sm font-medium">
            <!--<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-200 inline-block border border-green-500"></span> 추가됨</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-red-100 inline-block border border-red-400"></span> 삭제됨</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-yellow-200 inline-block border border-yellow-500"></span> 수정됨 (셀 강조)</span>-->
        </div>
    </div>


    <div class="flex-1 overflow-auto">
        <table class="min-w-max w-full text-left text-sm whitespace-nowrap" style="zoom:85%;">
            <thead class="bg-slate-100 sticky top-0 z-10 shadow-sm text-xs">
            <tr id="table-header" class="text-slate-600">
                <th class="px-4 py-3 font-semibold border-b border-r border-gray-300 text-center">상태</th>
                <th class="px-4 py-3 font-semibold border-b border-r border-gray-300 text-center">NO</th>
                <th class="px-4 py-3 font-semibold border-b border-r border-gray-300">ADDR</th>
                <!--<th class="px-4 py-3 font-semibold border-b border-gray-300">부품명</th>-->
            </tr>
            </thead>
            <tbody id="bom-tbody" class="divide-y divide-gray-200 border-b border-gray-200">
            <tr><td colspan="100" class="text-center py-10 text-gray-500">PID와 버전을 선택한 후 조회 버튼을 눌러주세요.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 커스텀 팝오버 컨테이너 -->
<div id="custom-popover" class="text-slate-700 border-slate-200"></div>


<script src="/resources/dist/js/jquery-3.7.1.min.js"></script>
<script src="/resources/javascript/commonUtil.js"></script>

<script>
    // 1. 비교할 컬럼명 배열 생성 (spec01~20, con01~20)
    let compareColumns = [];
    for(let i = 1; i <= 17; i++) {
        compareColumns.push(`spec${String(i).padStart(2, '0')}`);
        compareColumns.push(`con${String(i).padStart(2, '0')}`);
    }

    // 테이블 헤더 동적 렌더링
    const headerRow = document.getElementById('table-header');
    compareColumns.forEach(col => {
        const th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold border-b border-r border-gray-300 text-slate-500 text-xs';
        th.textContent = col.toUpperCase();
        headerRow.appendChild(th);
    });

    //KEY-VAL
    compareColumns = [];
    for(let i = 1; i <= 15; i++) {
        compareColumns.push(`KEY${String(i).padStart(2, '0')}`);
        compareColumns.push(`VAL${String(i).padStart(2, '0')}`);
    }
    compareColumns.forEach(col => {
        const th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold border-b border-r border-gray-300 text-slate-500 text-xs';
        th.textContent = col.toUpperCase();
        headerRow.appendChild(th);
    });

    //GOTO-REMARKS
    compareColumns = [];
    compareColumns.push(`GOTO`);
    compareColumns.push(`REMARK`);
    compareColumns.forEach(col => {
        const th = document.createElement('th');
        th.className = 'px-4 py-3 font-semibold border-b border-r border-gray-300 text-slate-500 text-xs';
        th.textContent = col.toUpperCase();
        headerRow.appendChild(th);
    });

    const tbody = document.getElementById('bom-tbody');


    // 빈 속성 채워주기
    const fillEmptyColumns = (item) => {
        const newItem = { ...item };
        compareColumns.forEach(col => { if(!newItem[col]) newItem[col] = '-'; });
        return newItem;
    };

</script>
</body>
</html>
