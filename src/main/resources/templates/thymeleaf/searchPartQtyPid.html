    <!-- Navbar -->

            </li>

            <li class="nav-item">

                    <i class="fas fa-expand-arrows-alt"></i>
                </a>
            </li>
        </ul>
    </nav>
    <!-- /.navbar -->



    <!-- ★ JSP include처럼 sidebar 불러오기 -->

    <div class="content-wrapper">

        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1><i class="fas fa-building me-3"></i>JQPR 시스템</h1>
                        <p class="mb-0">엘리베이터 설치 현장 비용 관리 시스템</p>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">

                            <div class="custom-control custom-switch custom-switch-off-danger custom-switch-on-success">
                                <input type="checkbox" class="custom-control-input" id="darkModeToggle">
                                <label class="custom-control-label" for="darkModeToggle">🌓 다크모드</label>
                            </div>
                        </ol>
                    </div>
                </div>
            </div><!-- /.container-fluid -->

            <div class="col-md-12">
                <div class="callout callout-danger">
                    📢 도움말 <br>
                    <font color="red">- 데이터가 너무 많을 경우 검색날짜 범위를 줄이세요 </font><br>
                    📝 사용 예시 <br>
                    - 자재번호 201153* 입력 시, 자재번호에 '201153'로 시작하는 모든 자재 조회하여 Excel 출력<br>

                </div>
            </div>
        </section>


        <div class="container-fluid">

                <div class="search-box">
                    <div class="row">


                        <div class="col-md-2">
                            <label class="form-label">선택날짜 이후</label>
                            <input type="date" class="form-control" id="dateFilter">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">BlockNo.</label>
                            <input type="text" class="form-control" id="searchBlockNo" placeholder="BlockNo. 입력하세요">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">수량_PID</label>
                            <input type="text" class="form-control" id="searchPID" onkeydown="keyCodeCheck('key pressed')" placeholder="수량 PID 입력하세요">
                        </div>

                        <div class="col-md-1">
                            <label class="form-label">검색</label>
                            <button class="btn btn-hyundai w-100" onclick="filterData()">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>

                        <div class="col-md-1">
                            <label class="form-label">excel</label>
                            <button class="btn btn-hyundai w-100" onclick="excelData()">
                                <!--<i class="fas fa-search">EXCEL</i>-->
                                EXCEL
                            </button>
                        </div>
                    </div>
                </div>


                <div class="data-table">
                    <div class="table-header">
                        <h5 class="mb-0"><i class="fas fa-table me-2"></i>JQPR 데이터 목록</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="infoTable" style="zoom:95%;">
                            <thead>
                            <tr>
                                <th>상위품번</th>
                                <th>상위파트명</th>
                                <th>blockNo</th>
                                <th>호기</th>
                                <th>작성일</th>

                                <th>자재번호</th>
                                <th>자재명</th>
                                <th>BlockNo</th>

                                <th>SPEC</th>
                                <th>QTY</th>
                                <th>CMT</th>
                            </tr>
                            </thead>
                            <tbody id="contentTable">

                            </tbody>
                        </table>
                    </div>
                </div>

                <nav class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>

        </div>
        <!-- /.content-wrapper -->


        <footer class="main-footer">
            <div class="float-right d-none d-sm-block">
                <b>Version</b> 1.0.0
            </div>
            <strong>Copyright &copy; 2025 <a href="#">수배로직설계팀-김영환 M</a>.</strong> All rights reserved.
        </footer>

        <!-- Control Sidebar -->
        <aside class="control-sidebar control-sidebar-dark">
            <!-- Control sidebar content goes here -->
        </aside>
        <!-- /.control-sidebar -->

    </div>


        <div class="modal fade" id="detailModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fas fa-info-circle me-2"></i></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="detailContent">
                    </div>
                </div>
            </div>
        </div>


        <div id="custom-tooltip"></div>

        <!-- 툴팁 엘리먼트 (공용) -->
        <div id="tooltip" class="custom-tooltip"></div>
