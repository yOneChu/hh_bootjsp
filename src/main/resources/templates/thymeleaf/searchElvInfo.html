<script>



    // 숨김 컬럼 인덱스 저장/로드
    function getHiddenCols() {
        try {
            const val = localStorage.getItem('spf_hidden_cols');
            return val ? JSON.parse(val) : [];
        } catch (e) {
            return [];
        }
    }
    function setHiddenCols(arr) {
        try {
            localStorage.setItem('spf_hidden_cols', JSON.stringify(arr));
        } catch (e) {}
    }

    function applyButtonState(idx, visible) {
        const buttons = document.querySelectorAll('#columnToggleToolbar .btn-group button');
        const btn = buttons && buttons[idx] ? buttons[idx] : null;
        if (!btn) return;
        if (visible) {
            btn.classList.remove('btn-secondary');
            btn.classList.add('btn-outline-secondary');
            btn.classList.remove('active');
            btn.setAttribute('aria-pressed', 'false');
        } else {
            btn.classList.remove('btn-outline-secondary');
            btn.classList.add('btn-secondary');
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
        }
    }

    function syncColumnButtons() {
        if (!$.fn.DataTable.isDataTable('#infoTable')) return;
        const table = $('#infoTable').DataTable();
        const colCount = table.columns().indexes().length;
        for (let i = 0; i < colCount; i++) {
            const visible = table.column(i).visible();
            applyButtonState(i, visible);
        }
    }

    // 버튼에서 호출: 특정 컬럼 토글
    function hideColumn(colIndex, btn) {
        if (!$.fn.DataTable.isDataTable('#infoTable')) return;
        const table = $('#infoTable').DataTable();
        const currentlyVisible = table.column(colIndex).visible();
        table.column(colIndex).visible(!currentlyVisible);

        // 저장 상태 업데이트
        let hidden = getHiddenCols();
        if (currentlyVisible) {
            // 이제 숨김 처리 -> 목록에 추가
            if (!hidden.includes(colIndex)) hidden.push(colIndex);
        } else {
            // 이제 표시 처리 -> 목록에서 제거
            hidden = hidden.filter(i => i !== colIndex);
        }
        setHiddenCols(hidden);

        // 버튼 상태 동기화
        applyButtonState(colIndex, !currentlyVisible);
    }

    // DataTable 재생성 후 버튼 상태 맞추기 위해 전역에 노출
    window.syncColumnButtons = syncColumnButtons;
</script>

<script>
    // 초기 로드시 버튼 상태 동기화 시도 (DataTable 초기화 이후에 한번 더 호출됨)
    $(document).ready(function() {
        setTimeout(function() {
            if (typeof window.syncColumnButtons === 'function') {
                window.syncColumnButtons();
            }
        }, 200);
    });


</script>
