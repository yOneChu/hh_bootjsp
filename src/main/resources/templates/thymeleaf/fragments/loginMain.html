<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>로그인 · 로직 분석시스템</title>
    <link rel="icon" type="image/png" href="/resources/favicon.ico"/>

    <script>
        // 페이지 렌더 전 다크모드 적용 (깜빡임 방지) — 기본값: 다크
        if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
    </script>

    <style>
        /* ═══════════ Reset & Base ═══════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
                         'SF Pro Display', 'Malgun Gothic', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            color: #1D1D1F;
            background: #F5F5F7;
            transition: background .3s, color .3s;
        }
        .dark body { color: #F5F5F7; background: #000; }

        /* ═══════════ Background (은은한 그라데이션 블롭) ═══════════ */
        .bg-deco {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .bg-deco::before, .bg-deco::after {
            content: ''; position: absolute; border-radius: 50%;
            filter: blur(110px); opacity: .5;
        }
        .bg-deco::before {
            width: 560px; height: 560px; top: -180px; right: -120px;
            background: radial-gradient(circle, rgba(0,113,227,.35), transparent 70%);
        }
        .bg-deco::after {
            width: 520px; height: 520px; bottom: -200px; left: -140px;
            background: radial-gradient(circle, rgba(88,86,214,.30), transparent 70%);
        }
        .dark .bg-deco::before { background: radial-gradient(circle, rgba(10,132,255,.28), transparent 70%); }
        .dark .bg-deco::after  { background: radial-gradient(circle, rgba(94,92,230,.25), transparent 70%); }

        /* ═══════════ Layout ═══════════ */
        .wrap {
            position: relative; z-index: 1;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px 20px;
        }

        /* ═══════════ Theme toggle (우상단) ═══════════ */
        .theme-area {
            position: fixed; top: 22px; right: 26px; z-index: 5;
            display: flex; align-items: center; gap: 9px;
        }
        .theme-label { font-size: 12.5px; font-weight: 500; color: #8E8E93; }
        .ios-switch { position: relative; width: 46px; height: 27px; cursor: pointer; display: inline-block; }
        .ios-switch input { display: none; }
        .ios-switch .track {
            position: absolute; inset: 0; border-radius: 999px;
            background: #D2D2D7; transition: background .2s;
        }
        .dark .ios-switch .track { background: #38383A; }
        .ios-switch input:checked + .track { background: #34C759; }
        .ios-switch .knob {
            position: absolute; top: 2.5px; left: 2.5px; width: 22px; height: 22px;
            border-radius: 50%; background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,.25); transition: transform .2s;
        }
        .ios-switch input:checked ~ .knob { transform: translateX(19px); }

        /* ═══════════ Brand ═══════════ */
        .brand { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 30px; }
        .brand-logo {
            width: 58px; height: 58px; border-radius: 15px;
            background: linear-gradient(135deg, #0071E3, #5856D6);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 26px rgba(0,113,227,.4);
        }
        .brand-title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
        .brand-sub { font-size: 13.5px; color: #8E8E93; margin-top: 4px; }
        .brand-chip {
            display: inline-flex; align-items: center; gap: 6px;
            height: 26px; padding: 0 12px; border-radius: 999px;
            background: rgba(0,113,227,.1); color: #0071E3;
            font-size: 12px; font-weight: 700; letter-spacing: .02em;
        }
        .dark .brand-chip { background: rgba(10,132,255,.16); color: #0A84FF; }
        .brand-chip .dot {
            width: 6px; height: 6px; border-radius: 50%; background: #34C759;
            animation: pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

        /* ═══════════ Login card ═══════════ */
        .card {
            width: 100%; max-width: 400px;
            background: rgba(255,255,255,.82);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0,0,0,.05);
            border-radius: 22px;
            box-shadow: 0 12px 44px rgba(0,0,0,.09);
            padding: 34px 32px 28px;
        }
        .dark .card {
            background: rgba(28,28,30,.82);
            border-color: rgba(255,255,255,.08);
            box-shadow: 0 12px 44px rgba(0,0,0,.55);
        }
        .card-head { margin-bottom: 24px; }
        .card-head h2 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
        .card-head p { font-size: 13.5px; color: #8E8E93; margin-top: 5px; }

        /* ═══════════ Form ═══════════ */
        .field { margin-bottom: 16px; }
        .field-label {
            display: block; font-size: 11px; font-weight: 600;
            letter-spacing: .05em; text-transform: uppercase;
            color: #86868B; margin-bottom: 6px;
        }
        .dark .field-label { color: #98989D; }

        .input-wrap { position: relative; }
        .input-wrap .lead-ico {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #AEAEB2; pointer-events: none; display: flex;
        }
        .form-input {
            width: 100%; height: 46px; padding: 0 14px 0 42px;
            font-size: 14.5px; font-family: inherit; color: #1D1D1F;
            background: #fff; border: 1.5px solid #E5E5EA; border-radius: 12px;
            outline: none; transition: border-color .18s, box-shadow .18s, background .18s;
        }
        .form-input::placeholder { color: #AEAEB2; }
        .form-input:focus { border-color: #0071E3; box-shadow: 0 0 0 3.5px rgba(0,113,227,.14); }
        .dark .form-input { background: #2C2C2E; border-color: #38383A; color: #F5F5F7; }
        .dark .form-input::placeholder { color: #636366; }
        .dark .form-input:focus { border-color: #0A84FF; box-shadow: 0 0 0 3.5px rgba(10,132,255,.22); }

        /* 비밀번호 보기 토글 */
        .pw-toggle {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer;
            background: transparent; color: #AEAEB2;
            display: flex; align-items: center; justify-content: center;
            transition: background .15s, color .15s;
        }
        .pw-toggle:hover { background: rgba(0,0,0,.05); color: #6E6E73; }
        .dark .pw-toggle:hover { background: rgba(255,255,255,.08); color: #AEAEB2; }

        /* 옵션 행 */
        .opt-row {
            display: flex; align-items: center; justify-content: space-between;
            margin: 4px 0 20px;
        }
        .remember { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
        .remember input { accent-color: #0071E3; width: 15px; height: 15px; cursor: pointer; }
        .remember span { font-size: 13px; color: #515154; }
        .dark .remember span { color: #AEAEB2; }
        .link-help {
            font-size: 13px; font-weight: 500; color: #0071E3; text-decoration: none;
        }
        .link-help:hover { text-decoration: underline; }
        .dark .link-help { color: #0A84FF; }

        /* 에러 배너 */
        .alert {
            display: none; align-items: flex-start; gap: 9px;
            margin-bottom: 16px; padding: 11px 14px; border-radius: 12px;
            background: rgba(255,59,48,.09); border: 1px solid rgba(255,59,48,.25);
            color: #D70015; font-size: 13px; font-weight: 500; line-height: 1.5;
        }
        .alert.show { display: flex; }
        .dark .alert { background: rgba(255,69,58,.13); border-color: rgba(255,69,58,.3); color: #FF6961; }

        /* 로그인 버튼 */
        .btn-login {
            width: 100%; height: 48px; border: none; border-radius: 12px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: #0071E3; color: #fff;
            font-size: 15px; font-weight: 600; font-family: inherit;
            box-shadow: 0 2px 12px rgba(0,113,227,.35);
            transition: background .15s, transform .1s, box-shadow .15s;
        }
        .btn-login:hover  { background: #0077ED; box-shadow: 0 4px 18px rgba(0,113,227,.45); }
        .btn-login:active { transform: scale(.98); }
        .btn-login:disabled { opacity: .6; cursor: not-allowed; }
        .btn-login .spinner {
            width: 17px; height: 17px; border-radius: 50%;
            border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff;
            animation: spin .8s linear infinite; display: none;
        }
        .btn-login.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 구분선 + 안내 */
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 22px 0 14px; color: #AEAEB2; font-size: 11.5px; font-weight: 600;
            letter-spacing: .05em; text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: ''; height: 1px; flex: 1; background: #E5E5EA;
        }
        .dark .divider::before, .dark .divider::after { background: #38383A; }
        .notice {
            text-align: center; font-size: 12.5px; line-height: 1.6; color: #8E8E93;
        }
        .notice b { color: #515154; font-weight: 600; }
        .dark .notice b { color: #AEAEB2; }

        /* ═══════════ Footer ═══════════ */
        .page-footer { margin-top: 28px; text-align: center; }
        .page-footer p { font-size: 12px; color: #8E8E93; line-height: 1.7; }

        @media (max-width: 440px) {
            .card { padding: 28px 22px 24px; }
            .theme-label { display: none; }
        }
    </style>
</head>

<body>

<div class="bg-deco"></div>

<!-- ═══════════ 다크모드 토글 ═══════════ -->
<div class="theme-area">
    <span class="theme-label" id="themeLabel">다크모드</span>
    <label class="ios-switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="track"></span><span class="knob"></span>
    </label>
</div>

<div class="wrap">

    <!-- ═══════════ Brand ═══════════ -->
    <div class="brand">
        <div class="brand-logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
                <path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>
            </svg>
        </div>
        <div style="text-align:center;">
            <h1 class="brand-title">로직 분석시스템</h1>
            <p class="brand-sub">현대엘리베이터 · 수배로직설계팀</p>
        </div>
        <span class="brand-chip"><span class="dot"></span>Logic Design Intelligence Platform</span>
    </div>

    <!-- ═══════════ Login Card ═══════════ -->
    <section class="card">
        <div class="card-head">
            <h2>로그인</h2>
            <p>사번과 비밀번호를 입력해 주세요.</p>
        </div>

        <!-- 로그인 실패 배너 (?error 파라미터 시 표시) -->
        <div class="alert" id="loginAlert">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0; margin-top:1px;">
                <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
            </svg>
            <span>사번 또는 비밀번호가 올바르지 않습니다.<br>다시 확인해 주세요.</span>
        </div>

        <form id="loginForm" th:action="@{/login}" action="/login" method="post" autocomplete="off">
            <div class="field">
                <label class="field-label" for="username">사번 (ID)</label>
                <div class="input-wrap">
                    <span class="lead-ico">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
                        </svg>
                    </span>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="사번을 입력하세요" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label class="field-label" for="password">비밀번호 (PW)</label>
                <div class="input-wrap">
                    <span class="lead-ico">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" class="form-input"
                           style="padding-right:44px;" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
                    <button type="button" class="pw-toggle" id="pwToggle" title="비밀번호 표시/숨기기" tabindex="-1">
                        <svg id="eyeOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M1 12s4-7.5 11-7.5S23 12 23 12s-4 7.5-11 7.5S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="eyeClosed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none;">
                            <path d="M17.94 17.94A10.6 10.6 0 0112 19.5C5 19.5 1 12 1 12a19.7 19.7 0 015.06-5.94"/>
                            <path d="M9.9 4.24A10.4 10.4 0 0112 4.5c7 0 11 7.5 11 7.5a19.8 19.8 0 01-3.22 4.31"/>
                            <path d="M14.12 14.12A3 3 0 019.88 9.88"/><path d="M1 1l22 22"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="opt-row">
                <label class="remember">
                    <input type="checkbox" id="rememberId" name="remember-me">
                    <span>사번 저장</span>
                </label>
                <a href="#" class="link-help" onclick="alert('수배로직설계팀 관리자에게 문의해 주세요.'); return false;">비밀번호 문의</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="spinner"></span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>
                </svg>
                로그인
            </button>
        </form>

        <div class="divider">Notice</div>
        <p class="notice">
            본 시스템은 <b>현대엘리베이터 임직원 전용</b>입니다.<br>
            계정 관련 문의는 수배로직설계팀으로 연락 바랍니다.
        </p>
    </section>

    <!-- ═══════════ Footer ═══════════ -->
    <footer class="page-footer">
        <p>Copyright © 2026 <b>현대엘리베이터 · 수배로직설계팀</b>. All rights reserved.<br>Version 1.0.0</p>
    </footer>

</div>

<script>
    'use strict';
    const $id = (s) => document.getElementById(s);

    /* ══════════ 다크모드 ══════════ */
    (function initTheme() {
        const dark = localStorage.getItem('theme') !== 'light'; // 기본 다크모드
        document.documentElement.classList.toggle('dark', dark);
        $id('darkModeToggle').checked = dark;
        $id('themeLabel').textContent = dark ? '🌙 다크모드' : '☀️ 라이트모드';
        if (dark) localStorage.setItem('theme', 'dark');
    })();
    $id('darkModeToggle').addEventListener('change', function () {
        document.documentElement.classList.toggle('dark', this.checked);
        localStorage.setItem('theme', this.checked ? 'dark' : 'light');
        $id('themeLabel').textContent = this.checked ? '🌙 다크모드' : '☀️ 라이트모드';
    });

    /* ══════════ 비밀번호 표시 토글 ══════════ */
    $id('pwToggle').addEventListener('click', function () {
        const pw = $id('password');
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        $id('eyeOpen').style.display = show ? 'none' : 'block';
        $id('eyeClosed').style.display = show ? 'block' : 'none';
        pw.focus();
    });

    /* ══════════ 로그인 실패 배너 (?error) ══════════ */
    if (new URLSearchParams(location.search).has('error')) {
        $id('loginAlert').classList.add('show');
    }

    /* ══════════ 사번 저장 ══════════ */
    (function initRememberId() {
        const saved = localStorage.getItem('savedLoginId');
        if (saved) {
            $id('username').value = saved;
            $id('rememberId').checked = true;
            $id('password').focus();
        }
    })();

    /* ══════════ 제출 처리 ══════════ */
    $id('loginForm').addEventListener('submit', function () {
        if ($id('rememberId').checked) {
            localStorage.setItem('savedLoginId', $id('username').value.trim());
        } else {
            localStorage.removeItem('savedLoginId');
        }
        const btn = $id('loginBtn');
        btn.classList.add('loading');
        btn.disabled = true;
        // disabled 버튼은 값이 전송되지 않는 문제 방지를 위해 지연 없이 그대로 제출
        setTimeout(() => btn.disabled = false, 4000);
    });
</script>

</body>
</html>
