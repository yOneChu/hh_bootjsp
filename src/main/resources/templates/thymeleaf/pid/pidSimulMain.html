<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PID 실행 시뮬레이터</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --panel: #ffffff;
            --border: #d9dee5;
            --text: #1f2933;
            --muted: #6b7785;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;

            --true-bg: #e7f6ec;
            --true-strong: #1f9d55;
            --false-bg: #fdecec;
            --false-strong: #d64545;
            --unread-bg: #f1f2f4;
            --unread-text: #a0a8b3;
            --cell-true: #b9e8c8;
            --cell-false: #f7c1c1;

            --drawer-w: 440px;
        }

        * { box-sizing: border-box; }

        /* ===== 전체 틀: 화면 높이에 고정, 스크롤은 결과 영역 하나만 ===== */
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        button {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            color: var(--text);
        }
        button:hover { background: #f1f5f9; }
        button.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            font-weight: bold;
        }
        button.primary:hover { background: var(--primary-dark); }
        button:disabled { opacity: .6; cursor: wait; }

        /* ===== 상단 헤더 + 조회 조건 ===== */
        header {
            flex: none;
            background: #1e293b;
            color: #fff;
            padding: 8px 16px;
        }
        .head-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        header h1 { margin: 0 8px 0 0; font-size: 16px; white-space: nowrap; }
        .inline-field { display: flex; align-items: center; gap: 6px; }
        .inline-field label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
        .inline-field label .req { color: #fca5a5; }
        header input {
            padding: 6px 8px;
            border: 1px solid #475569;
            border-radius: 5px;
            font-size: 13px;
            background: #0f172a;
            color: #fff;
        }
        header input:focus { outline: 2px solid #60a5fa; border-color: #60a5fa; }
        header input[type=checkbox] { width: auto; margin: 0; padding: 0; cursor: pointer; }
        .inline-field label.chk-label { cursor: pointer; }
        #hogi { width: 130px; }
        #PID { width: 170px; }
        header button { border-color: #475569; background: #334155; color: #fff; }
        header button:hover { background: #475569; }
        header button.primary { background: var(--primary); border-color: var(--primary); }
        header button.primary:hover { background: var(--primary-dark); }
        #btnAdv[aria-expanded="true"] { background: #475569; }
        .head-spacer { flex: 1; }
        #sourceInfo { color: #93c5fd; font-size: 12px; }
        #sourceInfo .warn { color: #fca5a5; font-weight: bold; }

        /* 추가 조건 (접기/펼치기) */
        .adv {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .adv[hidden] { display: none; }
        .adv .adv-fields { display: flex; flex-wrap: wrap; gap: 8px 14px; }
        .adv .adv-fields input { width: 120px; }
        .url-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .url-row .hint { color: #94a3b8; font-size: 12px; }
        .url-row button { padding: 5px 12px; font-size: 12px; }

        /* ===== 툴바: 필터(건수 포함) / 옵션 / 검색 ===== */
        .toolbar {
            flex: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
            padding: 8px 16px;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }
        .toolbar[hidden] { display: none; }
        .seg { display: flex; }
        .seg button { border-radius: 0; margin-left: -1px; padding: 5px 12px; }
        .seg button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
        .seg button:last-child { border-radius: 0 5px 5px 0; }
        .seg button b { margin-left: 4px; }
        .seg button[data-filter="true"] b { color: var(--true-strong); }
        .seg button[data-filter="false"] b { color: var(--false-strong); }
        .seg button[data-filter="unread"] b { color: var(--unread-text); }
        .seg button.active { background: #1e293b; color: #fff; border-color: #1e293b; position: relative; }
        .seg button.active b { color: #fff !important; }
        .toolbar input[type=search] {
            padding: 6px 9px;
            border: 1px solid var(--border);
            border-radius: 5px;
            width: 240px;
        }
        .toolbar label.chk { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
        #shownCount { color: var(--muted); white-space: nowrap; }
        #btnFinal { font-weight: bold; color: var(--primary); border-color: #bfdbfe; background: #eff6ff; }
        .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .legend { display: flex; gap: 10px; color: var(--muted); font-size: 12px; white-space: nowrap; }
        .legend i {
            display: inline-block;
            width: 11px; height: 11px;
            border-radius: 2px;
            vertical-align: -1px;
            margin-right: 3px;
            border: 1px solid rgba(0,0,0,.1);
        }
        .kbd-hint { color: var(--muted); font-size: 12px; white-space: nowrap; }

        /* 결과 테이블 확대/축소 */
        .zoom { display: flex; align-items: center; }
        .zoom button { border-radius: 0; margin-left: -1px; padding: 4px 10px; font-size: 13px; }
        .zoom button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
        .zoom button:last-child { border-radius: 0 5px 5px 0; }
        .zoom button:disabled { cursor: not-allowed; }
        #zoomLevel { min-width: 56px; font-variant-numeric: tabular-nums; }
        kbd {
            display: inline-block;
            padding: 0 4px;
            border: 1px solid #cbd2da;
            border-bottom-width: 2px;
            border-radius: 3px;
            background: #f8fafc;
            font-family: inherit;
            font-size: 11px;
        }

        /* ===== 작업 영역: 결과 테이블 + 상세 패널(우측 도킹) ===== */
        .workspace {
            flex: 1;
            min-height: 0;
            display: flex;
        }
        #resultArea {
            flex: 1;
            min-width: 0;
            overflow: auto;
            background: #fff;
            outline: none;
            /* 키보드 이동 시 고정 헤더/고정 컬럼에 가려지지 않도록 */
            scroll-padding-top: 60px;
        }
        #resultArea:focus-visible { box-shadow: inset 0 0 0 2px #93c5fd; }
        #resultArea.dragging { cursor: grabbing; user-select: none; }
        #resultArea.dragging * { cursor: grabbing !important; }

        /* 스크롤바를 조금 굵게 — 마우스로 잡기 쉽게 */
        #resultArea::-webkit-scrollbar { width: 14px; height: 14px; }
        #resultArea::-webkit-scrollbar-thumb { background: #b6bec9; border-radius: 7px; border: 3px solid #fff; }
        #resultArea::-webkit-scrollbar-thumb:hover { background: #8d97a5; }
        #resultArea::-webkit-scrollbar-track { background: #f1f5f9; }
        #resultArea::-webkit-scrollbar-corner { background: #f1f5f9; }

        /* 결과 테이블만 확대/축소 (zoom 은 레이아웃까지 함께 바뀌어 스크롤 · 고정 헤더가 그대로 동작) */
        #resultArea > table { zoom: var(--table-zoom, 1); }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
        }
        th, td {
            border-right: 1px solid #e5e8ec;
            border-bottom: 1px solid #e5e8ec;
            padding: 4px 8px;
            white-space: nowrap;
            text-align: left;
            vertical-align: top;
        }
        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #334155;
            color: #fff;
            font-weight: normal;
            font-size: 12px;
            height: 28px;
        }
        thead tr.group th {
            background: #1e293b;
            text-align: left;
            font-weight: bold;
        }
        thead tr.cols th { top: 28px; }

        /* 좌측 고정 컬럼 */
        .sticky-1, .sticky-2 { position: sticky; z-index: 1; }
        .sticky-1 { left: 0; width: 46px; min-width: 46px; text-align: right; }
        .sticky-2 { left: 46px; min-width: 70px; box-shadow: 2px 0 0 #cbd2da; }
        thead .sticky-1, thead .sticky-2 { z-index: 3; }
        tbody .sticky-1, tbody .sticky-2 { background: inherit; }

        th.grp-spec { background: #3b4a63 !important; }
        th.grp-key { background: #4a3b63 !important; }

        tbody tr { background: #fff; }
        tbody tr.rowTrue { background: var(--true-bg); }
        tbody tr.rowFalse { background: var(--false-bg); }
        tbody tr.unreaded { background: var(--unread-bg); color: var(--unread-text); }
        tbody tr:hover { filter: brightness(0.96); cursor: pointer; }
        tbody tr.selected { outline: 2px solid var(--primary); outline-offset: -2px; }
        tbody tr.selected td.sticky-1 { box-shadow: inset 4px 0 0 var(--primary); }

        td.status { text-align: center; font-weight: bold; }
        tr.rowTrue td.status { color: var(--true-strong); }
        tr.rowFalse td.status { color: var(--false-strong); }

        td.cellTrue { background: var(--cell-true); }
        td.cellFalse { background: var(--cell-false); }
        tr.unreaded td.cellTrue, tr.unreaded td.cellFalse { background: transparent; }

        td.addr { font-weight: bold; color: #7c3aed; }
        tr.unreaded td.addr { color: var(--unread-text); }
        td.goto { color: #c2410c; font-weight: bold; }
        td.goto .jump { text-decoration: underline; cursor: pointer; }
        tbody tr.flash td { animation: flash 1.2s ease-out; }
        @keyframes flash { from { background: #fde68a; } }
        td.key { color: #4338ca; font-weight: bold; }
        td.spec { color: #334155; }
        td.pair-end { border-right: 1px solid #c3cad3; }
        td.output { white-space: normal; min-width: 220px; max-width: 420px; }
        td.remark { white-space: normal; min-width: 180px; max-width: 360px; color: var(--muted); }

        /* 요약 보기: 조건/결과 칩 */
        td.chips { white-space: normal; min-width: 200px; max-width: 460px; }
        .chip {
            display: inline-block;
            margin: 1px 4px 1px 0;
            padding: 0 6px;
            border-radius: 3px;
            border: 1px solid #cbd2da;
            background: #fff;
            font-size: 12px;
            line-height: 18px;
            white-space: nowrap;
        }
        .chip .k { color: #475569; }
        .chip .v { font-weight: bold; }
        .chip.cellTrue { background: var(--cell-true); border-color: #86d3a0; }
        .chip.cellFalse { background: var(--cell-false); border-color: #eb9a9a; }
        .chip.res .k { color: #4338ca; font-weight: bold; }
        tr.unreaded .chip { background: transparent; color: var(--unread-text); border-color: #dde1e6; }
        tr.unreaded .chip .k { color: var(--unread-text); }

        .out-item { display: block; }
        .out-item b { color: var(--true-strong); }
        .out-item .call { color: #4338ca; text-decoration: underline; cursor: pointer; }
        .out-item .calc { color: var(--muted); }
        /* KEY 가 CALL 인 VAL: 클릭하면 새 탭에서 해당 PID 시뮬 실행 */
        .call-pid { color: #4338ca; text-decoration: underline; cursor: pointer; }
        .call-pid:hover { color: #312e81; }

        .empty, .msg {
            padding: 60px 40px;
            text-align: center;
            color: var(--muted);
        }
        .msg.error { color: var(--false-strong); white-space: pre-line; text-align: left; }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            vertical-align: -2px;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 상세 패널 (우측 도킹, 폭 조절 가능) ===== */
        .resizer {
            flex: none;
            width: 6px;
            cursor: col-resize;
            background: var(--border);
            display: none;
        }
        .resizer:hover, .resizer.active { background: var(--primary); }
        .drawer {
            flex: none;
            width: var(--drawer-w);
            min-width: 300px;
            background: #fff;
            display: none;
            flex-direction: column;
            min-height: 0;
        }
        .drawer.open { display: flex; }
        .resizer.show { display: block; }
        .drawer-head {
            flex: none;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .drawer-head h2 { margin: 0; font-size: 15px; flex: 1; }
        .drawer-head button { padding: 4px 10px; font-size: 12px; }
        .drawer-body { padding: 12px 14px; overflow: auto; flex: 1; }
        .drawer-body input[type=search] {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--border);
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .kv { width: 100%; min-width: 0; }
        .kv th, .kv td { white-space: normal; word-break: break-all; }
        .kv th { background: #f1f5f9; color: var(--text); width: 45%; position: static; }
        .kv tr.hit td, .kv tr.hit th { background: #fef9c3; }
        .kv td.blank { color: var(--unread-text); font-style: italic; }
        .kv th .spec-name { color: var(--muted); font-weight: normal; }
        .kv td .calc { color: var(--muted); margin-top: 2px; }
        .kv td .actual { margin-top: 2px; color: #334155; }
        .kv td .actual b { color: #7c3aed; }
        .section-title { font-weight: bold; margin: 14px 0 6px; }
        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
        }
        .badge.true { background: var(--true-strong); }
        .badge.false { background: var(--false-strong); }
        .badge.unread { background: var(--unread-text); }

        /* 좁은 화면: 상세 패널은 위로 겹쳐서 표시 */
        @media (max-width: 900px) {
            .drawer.open { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 20; box-shadow: -4px 0 16px rgba(0,0,0,.15); }
            .resizer { display: none !important; }
            .legend, .kbd-hint { display: none; }
        }
    </style>
</head>
<body>

<!-- ===== 헤더 + 조회 조건 ===== -->
<header>
    <form id="searchForm" autocomplete="off">
        <div class="head-row">
            <h1>PID 실행 시뮬레이터</h1>
            <div class="inline-field">
                <label for="hogi">호기 <span class="req">*</span></label>
                <input id="hogi" name="hogi" value="208223L01" required>
            </div>
            <div class="inline-field">
                <label for="PID">PID <span class="req">*</span></label>
                <input id="PID" name="PID" value="EL_PB186A01" required>
            </div>
            <div class="inline-field" title="체크하면 테스트 버전 PID로 실행합니다">
                <input type="checkbox" id="testVersion" name="testVersion">
                <label for="testVersion" class="chk-label">testVersion</label>
            </div>
            <button type="submit" class="primary" id="btnRun" title="Enter">실행</button>
            <button type="button" id="btnAdv" aria-expanded="false" aria-controls="advPanel">추가 조건 ▾</button>
            <button type="button" id="btnCodeDict" title="SPEC 특성코드의 한글명 / 값 목록을 새 창으로 봅니다">특성코드 사전</button>
            <div class="head-spacer"></div>
            <span id="sourceInfo"></span>
        </div>

        <!-- 추가 조건: 평소에는 접어 두어 결과 영역을 넓게 사용 -->
        <div class="adv" id="advPanel" hidden>
            <div class="adv-fields">
                <div class="inline-field">
                    <label for="isfloor">isfloor</label>
                    <input id="isfloor" name="isfloor">
                </div>
                <div class="inline-field">
                    <label for="floor">floor</label>
                    <input id="floor" name="floor">
                </div>
                <div class="inline-field">
                    <label for="type">type</label>
                    <input id="type" name="type">
                </div>
            </div>
            <!--<div class="url-row">
                <span class="hint">API 대신 저장된 결과로 보기:</span>
                <button type="button" id="btnLocalJson" title="이 페이지와 같은 폴더의 result.json을 불러옵니다">result.json 불러오기</button>
                <button type="button" id="btnPickFile">JSON 파일 선택…</button>
                <input type="file" id="fileInput" accept=".json,application/json" hidden>
            </div>-->
        </div>
    </form>
</header>

<!-- ===== 툴바 (실행 후 표시) ===== -->
<div class="toolbar" id="toolbar" hidden>
    <div class="seg" id="filterSeg">
        <button type="button" data-filter="all" class="active">전체<b id="stTotal">0</b></button>
        <button type="button" data-filter="true">TRUE<b id="stTrue">0</b></button>
        <button type="button" data-filter="false">FALSE<b id="stFalse">0</b></button>
        <button type="button" data-filter="readed">실행된 라인<b id="stReaded">0</b></button>
        <button type="button" data-filter="unread">미실행<b id="stUnread">0</b></button>
    </div>
    <button type="button" id="btnFinal">최종 OUTPUT (<span id="stFinal">0</span>)</button>
    <button type="button" id="btnCsv" title="지금 보이는 라인(필터 · 검색 적용)을 CSV 파일로 저장합니다. 엑셀에서 바로 열 수 있습니다">CSV 저장</button>
    <label class="chk" title="JSP 원본처럼 SPEC/CON, KEY/VAL을 각각 컬럼으로 펼쳐서 봅니다"><input type="checkbox" id="fullView"> 원본 컬럼 펼치기</label>
    <label class="chk"><input type="checkbox" id="hideBlank"> 빈 라인 숨기기</label>
    <input type="search" id="keyword" placeholder="SPEC / KEY / VAL / REMARK 검색 ( / )">
    <span id="shownCount"></span>
    <div class="toolbar-right">
        <div class="zoom" title="결과 테이블 확대/축소 (Ctrl+휠, 결과 영역에서 + / - / 0)">
            <button type="button" id="btnZoomOut" aria-label="축소">−</button>
            <button type="button" id="zoomLevel" title="100%로 되돌리기">100%</button>
            <button type="button" id="btnZoomIn" aria-label="확대">+</button>
        </div>
        <div class="legend">
            <span><i style="background:var(--true-bg)"></i>TRUE</span>
            <span><i style="background:var(--false-bg)"></i>FALSE</span>
            <span><i style="background:var(--unread-bg)"></i>미실행</span>
            <span><i style="background:var(--cell-true)"></i>조건 일치</span>
            <span><i style="background:var(--cell-false)"></i>불일치</span>
        </div>
        <span class="kbd-hint" title="결과 영역에서 사용">
            <kbd>↑</kbd><kbd>↓</kbd> 라인 이동 · <kbd>Enter</kbd> 상세 · <kbd>←</kbd><kbd>→</kbd> 좌우 · 드래그로 이동 · <kbd>Ctrl</kbd>+휠 확대/축소
        </span>
    </div>
</div>

<!-- ===== 결과 + 상세 패널 ===== -->
<div class="workspace">
    <!-- 스크롤은 이 영역 하나만 (가로 스크롤바가 항상 화면 하단에 보임) -->
    <section id="resultArea" tabindex="0" aria-label="결과 테이블">
        <div class="empty">호기와 PID를 입력하고 <b>실행</b>을 누르세요.</div>
    </section>
    <div class="resizer" id="resizer" title="드래그해서 상세 패널 폭 조절"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-head">
            <h2 id="drawerTitle">상세</h2>
            <button type="button" id="btnPrevRow" title="이전 라인 (↑)">▲</button>
            <button type="button" id="btnNextRow" title="다음 라인 (↓)">▼</button>
            <button type="button" id="btnCloseDrawer" title="Esc">닫기 ✕</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
    </aside>
</div>

<script>
    // 원본 PLM API (호출 실패 시 안내용)
    const API_URL = 'https://plmpro.hdel.co.kr/plmetc/vault/pidExecuteLineData';
    // 실제 호출은 서버(PIDController)를 경유 — 브라우저에서 PLM 직접 호출 시 CORS 차단 방지
    const PROXY_URL = '/pid/pidSimulLogic';
    const PARAM_NAMES = ['hogi', 'PID', 'testVersion', 'isfloor', 'floor', 'type'];
    const CODE_POPUP_URL = '/pid/pidSimulCodePopup';
    // 라인 상세 조건의 사양명(CODE -> CODENAME)
    const CODE_API = '/api/getElvCodeList?key=subae';
    // 호기의 영업사양({특성코드: 특성값} 맵). 계산식 VAL 의 {EL_xxx} 치환용
    //const SALES_API = '/api/getSalesInfo?key=subae&hogi=';
    const SALES_API = '/api/findElvSearchBySimul?key=subae&productNo=';

    const $ = (id) => document.getElementById(id);
    const area = $('resultArea');
    let codePopup = null;
    // 특성코드(대문자) -> 사양명(CODENAME). 라인 상세의 조건 표시용
    const specNames = new Map();
    // 특성코드(대문자) -> 특성값(VALUE). 계산식 VAL 의 변수 치환용
    const specValues = new Map();
    let specValuesHogi = '';
    // 영업사양 로딩 결과 안내 (상단 sourceInfo 에 표시)
    let specInfo = { text: '', fail: false };
    const state = {
        rows: [],
        sourceLabel: '',
        maxSpec: 0,
        maxRes: 0,
        filter: 'all',
        keyword: '',
        hideBlank: false,
        fullView: false,
        selectedIdx: -1,
        drawerMode: '',   // 'row' | 'final'
        beforeMaps: [],   // 라인별 '실행 직전' resultMap (계산식 치환용)
        query: null,      // 마지막으로 성공한 조회 조건 (CSV 파일명용)
    };

    // ---------- 유틸 ----------
    function esc(v) {
        if (v === null || v === undefined) return '';
        return String(v)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    const nvl = (v) => (v === null || v === undefined ? '' : String(v));
    const br = (v) => esc(v).replace(/\n/g, '<br>');

    // 파라미터 값 읽기/쓰기 — 체크박스(testVersion)는 체크 시 'on', 해제 시 ''
    function getParam(n) {
        const el = $(n);
        if (el.type === 'checkbox') return el.checked ? 'on' : '';
        return el.value.trim();
    }
    function setParam(n, v) {
        const el = $(n);
        if (el.type === 'checkbox') el.checked = v === 'on';
        else el.value = v;
    }

    function buildUrl() {
        const qs = PARAM_NAMES
            .map((n) => `${n}=${encodeURIComponent(getParam(n))}`)
            .join('&');
        return `${API_URL}?${qs}`;
    }

    // 서버 API 호출 URL (컨트롤러 파라미터명은 소문자 pid)
    function buildProxyUrl() {
        const qs = new URLSearchParams();
        PARAM_NAMES.forEach((n) => qs.set(n === 'PID' ? 'pid' : n, getParam(n)));
        return `${PROXY_URL}?${qs}`;
    }

    // ---------- CALL PID 새 탭 실행 ----------
    // KEY 가 CALL 인 VAL(호출 PID)을 클릭 가능한 링크로 감싼다
    function callPidLink(val, html) {
        const pid = nvl(val).trim();
        if (!pid) return html !== undefined ? html : esc(val);
        return `<span class="call-pid" data-call-pid="${esc(pid)}" title="새 탭에서 ${esc(pid)} 시뮬 실행">`
            + (html !== undefined ? html : esc(val)) + '</span>';
    }

    // 현재 화면의 호기번호 + 호출 PID 로 새 탭을 열어 시뮬 실행 (init 에서 URL 파라미터로 자동 실행)
    function openCallPid(pid) {
        const hogi = (state.query && state.query.hogi) || getParam('hogi');
        if (!hogi || !pid) return;
        const qs = new URLSearchParams({ hogi, PID: pid });
        window.open(`${location.pathname}?${qs}`, '_blank');
    }

    function setAdvOpen(open) {
        $('advPanel').hidden = !open;
        $('btnAdv').setAttribute('aria-expanded', String(open));
        $('btnAdv').textContent = open ? '추가 조건 ▴' : '추가 조건 ▾';
    }

    // ---------- 데이터 가공 ----------
    // 실제 값이 있는 마지막 인덱스 + 1 (빈 컬럼을 잘라내기 위해)
    function usedLength(a, b) {
        let n = 0;
        const len = Math.max((a || []).length, (b || []).length);
        for (let i = 0; i < len; i++) {
            if (nvl(a && a[i]) !== '' || nvl(b && b[i]) !== '') n = i + 1;
        }
        return n;
    }

    const cmpClass = (c) => (c === 'T' ? 'cellTrue' : (c === 'F' ? 'cellFalse' : ''));
    const cmpTitle = (c) => (c === 'T' ? '조건 일치' : (c === 'F' ? '조건 불일치' : ''));

    function classify(row) {
        const rowTrue = nvl(row.rowTrue);
        if (rowTrue === '') return 'unread';
        return rowTrue === 'true' ? 'true' : 'false';
    }

    // ---------- 계산식 VAL ----------
    // VAL 이 [$ ... $] 계산식이면 {변수}에 실제로 대입된 값을 채운 식을 돌려준다.
    // 변수는 '그 라인 실행 직전의 resultMap' -> 호기 영업사양 순으로 찾는다.
    const isCalc = (v) => /\[\$[\s\S]*\$\]/.test(nvl(v));

    function pickVar(map, name) {
        if (!map) return undefined;
        if (Object.prototype.hasOwnProperty.call(map, name)) return map[name];
        const u = name.toUpperCase();
        if (Object.prototype.hasOwnProperty.call(map, u)) return map[u];
        return undefined;
    }

    function calcDetail(val, idx) {
        const v = nvl(val);
        if (!isCalc(v)) return '';
        const before = state.beforeMaps[idx] || {};
        let resolved = 0;
        const filled = v.replace(/\{([^{}]+)\}/g, (m, rawName) => {
            const name = rawName.trim();
            let hit = pickVar(before, name);
            if (hit === undefined) hit = specValues.get(name.toUpperCase());
            if (hit === undefined || hit === null) return m;   // 못 찾은 변수는 {변수} 그대로 둔다
            resolved++;
            return nvl(hit) === '' ? "''" : nvl(hit);
        }).replace(/[ \t]+/g, ' ').trim();
        // 하나도 못 채웠으면 VAL 과 같은 내용이라 표시하지 않는다
        return resolved ? filled : '';
    }

    // 조건 SPEC 의 호기 실제값: 그 라인 실행 직전 resultMap -> 호기 영업사양 순으로 찾는다 (없으면 undefined)
    function actualValue(code, idx) {
        const name = nvl(code).trim();
        if (!name) return undefined;
        let v = pickVar(state.beforeMaps[idx], name);
        if (v === undefined) v = specValues.get(name.toUpperCase());
        return v === undefined || v === null ? undefined : nvl(v);
    }
    const actualText = (v) => (v === '' ? '(빈 값)' : v);

    // JSP 참고코드와 동일한 OUTPUT 생성 규칙 (rowTrue 라인만)
    function buildOutput(row, idx) {
        if (classify(row) !== 'true') return '';
        const keys = row.keyList || [];
        const vals = row.valList || [];
        const resultMap = row.resultMap || {};
        const seen = new Set();
        const parts = [];

        for (let j = 0; j < state.maxRes; j++) {
            const key = nvl(keys[j]);
            if (key === '' || seen.has(key)) continue;
            seen.add(key);
            const val = nvl(vals[j]);

            if (key === 'CALL') {
                const cnt = Object.keys(resultMap).length;
                parts.push(`<span class="out-item">CALL(<b>${callPidLink(val)}</b>) → `
                    + `<span class="call" data-idx="${idx}">resultMap ${cnt}건 보기</span></span>`);
            } else if (key === 'OUTPUT') {
                // OUTPUT 선언 라인: resultMap 키가 'OUTPUT' + DOUID + 컬럼인덱스 형태로 저장됨
                const outVar = nvl(resultMap[`OUTPUT${nvl(row.DOUID)}${j}`]) || val;
                parts.push(`<span class="out-item">OUTPUT 선언 → <b>${esc(outVar)}</b></span>`);
            } else {
                // 계산식이면 어떤 값으로 계산되었는지 괄호로 덧붙인다
                const detail = calcDetail(val, idx);
                parts.push(`<span class="out-item">${esc(key)} = <b>${br(nvl(resultMap[key]))}</b>`
                    + (detail ? ` <span class="calc" title="계산식에 대입된 값">(${esc(detail)})</span>` : '')
                    + '</span>');
            }
        }
        return parts.join('');
    }

    function rowText(row) {
        return [
            row.ADDR, row.GOTO, row.REMARKS, row.line_no,
            ...(row.specList || []), ...(row.conList || []),
            ...(row.keyList || []), ...(row.valList || []),
        ].map(nvl).join(' ').toLowerCase();
    }

    // 현재 필터 · 검색어 · 빈 라인 숨기기 기준으로 화면에 보일 라인인지 (테이블 · CSV 공통)
    function isVisible(row) {
        const status = classify(row);
        if (state.filter === 'true' && status !== 'true') return false;
        if (state.filter === 'false' && status !== 'false') return false;
        if (state.filter === 'readed' && status === 'unread') return false;
        if (state.filter === 'unread' && status !== 'unread') return false;
        if (state.hideBlank && nvl(row.isBlankLine) === 'true' && nvl(row.ADDR) === '') return false;
        const kw = state.keyword.toLowerCase();
        return !kw || rowText(row).includes(kw);
    }

    // 조건 칩 / 셀의 툴팁: 일치 여부 + 호기 실제값
    function specTitle(j, cmp, act) {
        return `SPEC${j + 1} ${cmpTitle(cmp)}` + (act !== undefined ? ` · 호기값: ${actualText(act)}` : '');
    }

    // ---------- 렌더링 ----------
    function renderSummary() {
        const rows = state.rows;
        const cnt = { true: 0, false: 0, unread: 0 };
        rows.forEach((r) => cnt[classify(r)]++);
        $('stTotal').textContent = rows.length;
        $('stTrue').textContent = cnt.true;
        $('stFalse').textContent = cnt.false;
        $('stReaded').textContent = cnt.true + cnt.false;
        $('stUnread').textContent = cnt.unread;
        $('stFinal').textContent = Object.keys(finalResultMap()).length;
        $('toolbar').hidden = false;
    }

    function renderTable() {
        const { rows, maxSpec, maxRes } = state;
        if (!rows.length) {
            area.innerHTML = '<div class="empty">조회 결과가 없습니다.</div>';
            $('shownCount').textContent = '';
            return;
        }

        // HEADER
        const full = state.fullView;
        let h = '<table id="resultTable"><thead>';
        if (full) {
            h += '<tr class="group">'
                + '<th class="sticky-1" rowspan="2">#</th>'
                + '<th class="sticky-2" rowspan="2">ADDR</th>'
                + '<th rowspan="2">결과</th>';
            if (maxSpec) h += `<th class="grp-spec" colspan="${maxSpec * 2}">조건 (SPEC / CON)</th>`;
            if (maxRes) h += `<th class="grp-key" colspan="${maxRes * 2}">결과 (KEY / VAL)</th>`;
            h += '<th rowspan="2">GOTO</th><th rowspan="2">OUTPUT</th><th rowspan="2">REMARK</th></tr>';

            h += '<tr class="cols">';
            for (let i = 1; i <= maxSpec; i++) h += `<th class="grp-spec">SPEC${i}</th><th class="grp-spec">CON${i}</th>`;
            for (let i = 1; i <= maxRes; i++) h += `<th class="grp-key">KEY${i}</th><th class="grp-key">VAL${i}</th>`;
            h += '</tr>';
        } else {
            h += '<tr>'
                + '<th class="sticky-1">#</th><th class="sticky-2">ADDR</th><th>결과</th>'
                + '<th class="grp-spec">조건 (SPEC = CON)</th>'
                + '<th class="grp-key">결과 (KEY = VAL)</th>'
                + '<th>GOTO</th><th>OUTPUT</th><th>REMARK</th></tr>';
        }
        h += '</thead><tbody>';

        // CONTENTS
        let shown = 0;

        rows.forEach((row, i) => {
            if (!isVisible(row)) return;
            const status = classify(row);
            shown++;

            const trClass = status === 'unread' ? 'unreaded'
                : (status === 'true' ? 'readed rowTrue' : 'readed rowFalse');
            const statusText = status === 'unread' ? '-' : (status === 'true' ? 'TRUE' : 'FALSE');

            h += `<tr class="${trClass}${i === state.selectedIdx ? ' selected' : ''}" data-idx="${i}">`;
            h += `<td class="sticky-1">${esc(row.line_no || i + 1)}</td>`;
            h += `<td class="sticky-2 addr">${esc(row.ADDR)}</td>`;
            h += `<td class="status">${statusText}</td>`;

            const specs = row.specList || [];
            const cons = row.conList || [];
            const cmps = row.compareResultList || [];
            const keys = row.keyList || [];
            const vals = row.valList || [];

            if (full) {
                for (let j = 0; j < maxSpec; j++) {
                    const cmp = nvl(cmps[j]);
                    const title = esc(specTitle(j, cmp, actualValue(specs[j], i)));
                    h += `<td class="spec ${cmpClass(cmp)}" title="${title}">${esc(specs[j])}</td>`;
                    h += `<td class="pair-end ${cmpClass(cmp)}" title="${title}">${esc(cons[j])}</td>`;
                }
                for (let j = 0; j < maxRes; j++) {
                    h += `<td class="key">${esc(keys[j])}</td>`;
                    h += `<td class="pair-end">${nvl(keys[j]) === 'CALL' ? callPidLink(vals[j], br(vals[j])) : br(vals[j])}</td>`;
                }
            } else {
                let specChips = '';
                for (let j = 0; j < usedLength(specs, cons); j++) {
                    if (nvl(specs[j]) === '' && nvl(cons[j]) === '') continue;
                    const cmp = nvl(cmps[j]);
                    specChips += `<span class="chip ${cmpClass(cmp)}" title="${esc(specTitle(j, cmp, actualValue(specs[j], i)))}">`
                        + `<span class="k">${esc(specs[j])}</span> = <span class="v">${esc(cons[j])}</span></span>`;
                }
                let resChips = '';
                for (let j = 0; j < usedLength(keys, vals); j++) {
                    if (nvl(keys[j]) === '' && nvl(vals[j]) === '') continue;
                    resChips += `<span class="chip res" title="KEY${j + 1}"><span class="k">${esc(keys[j])}</span>`
                        + (nvl(vals[j]) !== '' ? ` = <span class="v">${nvl(keys[j]) === 'CALL' ? callPidLink(vals[j], br(vals[j])) : br(vals[j])}</span>` : '') + '</span>';
                }
                h += `<td class="chips">${specChips}</td><td class="chips">${resChips}</td>`;
            }

            h += row.GOTO
                ? `<td class="goto"><span class="jump" data-goto="${esc(row.GOTO)}" title="${esc(row.GOTO)} 라인으로 이동">→ ${esc(row.GOTO)}</span></td>`
                : '<td class="goto"></td>';
            h += `<td class="output">${buildOutput(row, i)}</td>`;
            h += `<td class="remark">${esc(row.REMARKS)}</td>`;
            h += '</tr>';
        });

        h += '</tbody></table>';
        if (!shown) h = '<div class="empty">필터 조건에 맞는 라인이 없습니다.</div>';

        area.innerHTML = h;
        $('shownCount').textContent = `${shown} / ${rows.length} 라인`;
    }

    // ---------- 라인 선택 / 키보드 이동 ----------
    const visibleRows = () => [...area.querySelectorAll('tbody tr[data-idx]')];
    const rowEl = (idx) => area.querySelector(`tbody tr[data-idx="${idx}"]`);

    // 세로로만 따라가도록 스크롤 (가로 위치는 유지)
    function scrollRowIntoView(tr) {
        const head = area.querySelector('thead');
        const headH = head ? head.getBoundingClientRect().height : 0;
        const a = area.getBoundingClientRect();
        const r = tr.getBoundingClientRect();
        if (r.top < a.top + headH) {
            area.scrollTop -= (a.top + headH) - r.top + 4;
        } else if (r.bottom > a.bottom - 14) {
            area.scrollTop += r.bottom - (a.bottom - 14) + 4;
        }
    }

    function selectRow(tr) {
        if (!tr) return;
        area.querySelectorAll('tbody tr.selected').forEach((x) => x.classList.remove('selected'));
        tr.classList.add('selected');
        state.selectedIdx = Number(tr.dataset.idx);
        scrollRowIntoView(tr);
        // 상세 패널이 라인 상세를 보여주는 중이면 따라서 갱신
        if (isDrawerOpen() && state.drawerMode === 'row') showRowDetail(state.selectedIdx, { keepFocus: true });
    }

    function moveSelection(step) {
        const trs = visibleRows();
        if (!trs.length) return;
        let pos = trs.findIndex((tr) => Number(tr.dataset.idx) === state.selectedIdx);
        if (pos < 0) pos = step > 0 ? -1 : trs.length;
        pos = Math.max(0, Math.min(trs.length - 1, pos + step));
        selectRow(trs[pos]);
    }

    // 실행 직후: 결과 테이블로 포커스 + 맨 위로 + 첫 라인 선택
    function focusResult() {
        area.scrollTop = 0;
        area.scrollLeft = 0;
        area.focus({ preventScroll: true });
        const first = visibleRows()[0];
        if (first) selectRow(first);
    }

    // ---------- 상세 패널 (라인 상세 / resultMap) ----------
    const isDrawerOpen = () => $('drawer').classList.contains('open');

    function finalResultMap() {
        for (let i = state.rows.length - 1; i >= 0; i--) {
            if (state.rows[i].resultMap) return state.rows[i].resultMap;
        }
        return {};
    }

    function kvTable(map, highlightKeys) {
        const entries = Object.entries(map || {});
        if (!entries.length) return '<div class="empty" style="padding:16px">데이터 없음</div>';
        // OUTPUTxxxx 키(내부 참조용)는 뒤로 보냄
        entries.sort((a, b) => (a[0].startsWith('OUTPUT') ? 1 : 0) - (b[0].startsWith('OUTPUT') ? 1 : 0));
        return '<table class="kv"><tbody>' + entries.map(([k, v]) => {
            const hit = highlightKeys && highlightKeys.has(k) ? ' class="hit"' : '';
            const val = nvl(v);
            return `<tr${hit} data-k="${esc(k.toLowerCase())} ${esc(val.toLowerCase())}"><th>${esc(k)}</th>`
                + (val === '' ? '<td class="blank">(빈 값)</td>' : `<td>${br(val)}</td>`) + '</tr>';
        }).join('') + '</tbody></table>';
    }

    function openDrawer(title, html, mode) {
        // 라인 이동 시 상세 패널 안의 검색어 유지
        const prevSearch = $('drawerBody').querySelector('input[type=search]');
        const prevQuery = prevSearch && state.drawerMode === mode ? prevSearch.value : '';

        state.drawerMode = mode;
        $('drawerTitle').textContent = title;
        $('drawerBody').innerHTML = html;
        $('drawer').classList.add('open');
        $('resizer').classList.add('show');
        $('btnPrevRow').hidden = mode !== 'row';
        $('btnNextRow').hidden = mode !== 'row';

        const search = $('drawerBody').querySelector('input[type=search]');
        if (search) {
            const apply = () => {
                const q = search.value.trim().toLowerCase();
                $('drawerBody').querySelectorAll('.kv tr[data-k]').forEach((tr) => {
                    tr.hidden = q && !tr.dataset.k.includes(q);
                });
            };
            search.addEventListener('input', apply);
            if (prevQuery) { search.value = prevQuery; apply(); }
        }
    }

    function closeDrawer() {
        $('drawer').classList.remove('open');
        $('resizer').classList.remove('show');
        state.drawerMode = '';
        area.focus({ preventScroll: true });
    }

    function showRowDetail(idx, opts = {}) {
        const row = state.rows[idx];
        if (!row) return;
        if (state.selectedIdx !== idx) {
            state.selectedIdx = idx;
            area.querySelectorAll('tbody tr.selected').forEach((tr) => tr.classList.remove('selected'));
            const tr = rowEl(idx);
            if (tr) tr.classList.add('selected');
        }

        const status = classify(row);
        const badge = status === 'unread' ? '<span class="badge unread">미실행</span>'
            : `<span class="badge ${status}">${status.toUpperCase()}</span>`;

        let html = `<div>${badge} &nbsp; LINE ${esc(row.line_no || idx + 1)}`
            + (row.ADDR ? ` · ADDR <b>${esc(row.ADDR)}</b>` : '')
            + (row.GOTO ? ` · GOTO <b>${esc(row.GOTO)}</b>` : '')
            + ` · DOUID ${esc(row.DOUID)}</div>`;
        if (row.REMARKS) html += `<div style="margin-top:6px;color:var(--muted)">${esc(row.REMARKS)}</div>`;

        // 조건
        const specs = row.specList || [], cons = row.conList || [], cmps = row.compareResultList || [];
        const n = usedLength(specs, cons);
        if (n) {
            html += '<div class="section-title">조건</div><table class="kv"><tbody>';
            for (let j = 0; j < n; j++) {
                const c = nvl(cmps[j]);
                const cls = c === 'T' ? 'cellTrue' : (c === 'F' ? 'cellFalse' : '');
                const specName = specNames.get(nvl(specs[j]).trim().toUpperCase());
                // 조건값 아래에 이 호기의 실제값을 함께 보여줘서 왜 일치/불일치인지 바로 비교
                const act = actualValue(specs[j], idx);
                html += `<tr><th>${esc(specs[j])}${specName ? ` <span class="spec-name">(${esc(specName)})</span>` : ''}</th>`
                    + `<td class="${cls}">${esc(cons[j])} ${c ? `(${c === 'T' ? '일치' : '불일치'})` : ''}`
                    + (act !== undefined ? `<div class="actual">원래값: <b>${esc(actualText(act))}</b></div>` : '')
                    + '</td></tr>';
            }
            html += '</tbody></table>';
        }

        // 결과 KEY/VAL
        const keys = row.keyList || [], vals = row.valList || [];
        const m = usedLength(keys, vals);
        const keySet = new Set();
        if (m) {
            html += '<div class="section-title">결과 (KEY = VAL)</div><table class="kv"><tbody>';
            for (let j = 0; j < m; j++) {
                keySet.add(nvl(keys[j]));
                const detail = calcDetail(vals[j], idx);
                html += `<tr><th>${esc(keys[j])}</th><td>${nvl(keys[j]) === 'CALL' ? callPidLink(vals[j], br(vals[j])) : br(vals[j])}`
                    + (detail ? `<div class="calc">= ${esc(detail)}</div>` : '') + '</td></tr>';
            }
            html += '</tbody></table>';
        }

        if (row.resultMap) {
            // 'OUTPUT11' 로 시작하는 키는 표시하지 않음
            const shownMap = Object.fromEntries(
                Object.entries(row.resultMap).filter(([k]) => !k.startsWith('OUTPUT11')));
            html += `<div class="section-title">이 라인 실행 후 resultMap (${Object.keys(shownMap).length}건)</div>`
                + '<input type="search" placeholder="키 / 값 검색">'
                + kvTable(shownMap, keySet);
        }
        openDrawer('라인 상세', html, 'row');
        // 상세를 열어도 키보드(↑↓)는 계속 결과 테이블에서 동작
        if (!opts.keepFocus) area.focus({ preventScroll: true });
    }

    function showFinal() {
        const map = finalResultMap();
        openDrawer(`최종 OUTPUT (${Object.keys(map).length}건)`,
            '<div style="color:var(--muted);margin-bottom:8px">마지막으로 실행된 라인 기준의 resultMap 입니다.</div>'
            + '<input type="search" placeholder="키 / 값 검색">' + kvTable(map), 'final');
    }

    // ---------- 데이터 적재 (API / JSON 파일 공통) ----------
    function loadRows(json, sourceLabel) {
        const rows = Array.isArray(json) ? json : (json.data || json.list || []);
        if (!Array.isArray(rows)) throw new Error('결과 형식이 배열이 아닙니다.');

        state.rows = rows;
        state.selectedIdx = -1;
        // resultMap 은 값이 바뀐 라인에만 있으므로, 직전 라인의 resultMap 을 '실행 직전 상태'로 쓴다
        let carry = {};
        state.beforeMaps = rows.map((r) => {
            const prev = carry;
            if (r.resultMap) carry = r.resultMap;
            return prev;
        });
        state.maxSpec = Math.max(0, ...rows.map((r) => usedLength(r.specList, r.conList)));
        state.maxRes = Math.max(0, ...rows.map((r) => usedLength(r.keyList, r.valList)));
        state.sourceLabel = sourceLabel;
        $('sourceInfo').textContent = `현재 표시: ${sourceLabel}`;
        if (isDrawerOpen()) closeDrawer();

        renderSummary();
        renderTable();
        setAdvOpen(false);
        focusResult();
        syncCodePopup();
    }

    // ---------- CSV 저장 (지금 보이는 라인만, 엑셀에서 한글이 깨지지 않도록 BOM 포함) ----------
    const csvCell = (v) => {
        const s = nvl(v);
        return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };

    // OUTPUT 칸의 텍스트판 (buildOutput 과 같은 규칙)
    function outputText(row) {
        if (classify(row) !== 'true') return '';
        const keys = row.keyList || [], vals = row.valList || [], resultMap = row.resultMap || {};
        const seen = new Set(), parts = [];
        keys.forEach((k, j) => {
            const key = nvl(k);
            if (key === '' || seen.has(key)) return;
            seen.add(key);
            const val = nvl(vals[j]);
            if (key === 'CALL') parts.push(`CALL(${val})`);
            else if (key === 'OUTPUT') parts.push(`OUTPUT 선언 → ${nvl(resultMap[`OUTPUT${nvl(row.DOUID)}${j}`]) || val}`);
            else parts.push(`${key} = ${nvl(resultMap[key])}`);
        });
        return parts.join('\n');
    }

    function exportCsv() {
        const head = ['#', 'ADDR', '결과', '조건 (SPEC = CON)', '호기값', '결과 (KEY = VAL)', 'GOTO', 'OUTPUT', 'REMARK'];
        const lines = [head.map(csvCell).join(',')];
        let count = 0;
        state.rows.forEach((row, i) => {
            if (!isVisible(row)) return;
            count++;
            const status = classify(row);
            const specs = row.specList || [], cons = row.conList || [], cmps = row.compareResultList || [];
            const keys = row.keyList || [], vals = row.valList || [];
            const conds = [], actuals = [], results = [];
            for (let j = 0; j < usedLength(specs, cons); j++) {
                if (nvl(specs[j]) === '' && nvl(cons[j]) === '') continue;
                const c = nvl(cmps[j]);
                conds.push(`${nvl(specs[j])} = ${nvl(cons[j])}${c === 'F' ? ' (불일치)' : ''}`);
                const act = actualValue(specs[j], i);
                if (act !== undefined) actuals.push(`${nvl(specs[j])} = ${actualText(act)}`);
            }
            for (let j = 0; j < usedLength(keys, vals); j++) {
                if (nvl(keys[j]) === '' && nvl(vals[j]) === '') continue;
                results.push(`${nvl(keys[j])} = ${nvl(vals[j])}`);
            }
            lines.push([
                row.line_no || i + 1, row.ADDR,
                status === 'unread' ? '미실행' : status.toUpperCase(),
                conds.join('\n'), actuals.join('\n'), results.join('\n'),
                row.GOTO, outputText(row), row.REMARKS,
            ].map(csvCell).join(','));
        });
        if (!count) return alert('저장할 라인이 없습니다. 필터 · 검색 조건을 확인하세요.');

        const q = state.query || { hogi: 'result', PID: '' };
        const name = `PID_${q.hogi}_${q.PID}`.replace(/[\\/:*?"<>|\s]+/g, '_') + '.csv';
        const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // ---------- 특성코드 사전 팝업 ----------
    // 팝업(pidSimulCodePopup)이 호출: 현재 결과의 SPEC 특성코드 목록 (처음 나온 순서)
    window.getPidSpecSummary = function () {
        const map = new Map();
        state.rows.forEach((row) => {
            const specs = row.specList || [], cons = row.conList || [];
            const lines = new Set();
            for (let j = 0; j < usedLength(specs, cons); j++) {
                const code = nvl(specs[j]).trim();
                if (!code) continue;
                const k = code.toUpperCase();
                let s = map.get(k);
                if (!s) map.set(k, (s = { code, count: 0, cons: [] }));
                if (!lines.has(k)) { lines.add(k); s.count++; }
                const con = nvl(cons[j]).trim();
                if (con && !s.cons.includes(con)) s.cons.push(con);
            }
        });
        return { label: state.sourceLabel, specs: [...map.values()] };
    };

    function openCodePopup() {
        if (codePopup && !codePopup.closed) {
            codePopup.focus();
            syncCodePopup();
            return;
        }
        codePopup = window.open(CODE_POPUP_URL, 'pidSimulCodePopup', 'width=960,height=820,resizable=yes,scrollbars=yes');
        if (!codePopup) alert('팝업이 차단되었습니다. 브라우저에서 이 사이트의 팝업을 허용해 주세요.');
    }

    // 사양명 로딩 (실패해도 조건은 코드만으로 표시)
    async function loadSpecNames() {
        try {
            const res = await fetch(CODE_API, { headers: { Accept: 'application/json' } });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            (await res.json() || []).forEach((r) => {
                const k = nvl(r.code).trim().toUpperCase();
                const name = nvl(r.codeName).trim();
                if (k && name && !specNames.has(k)) specNames.set(k, name);
            });
            // 로딩 전에 열어 둔 라인 상세가 있으면 사양명을 붙여서 다시 그림
            if (isDrawerOpen() && state.drawerMode === 'row') showRowDetail(state.selectedIdx, { keepFocus: true });
        } catch (e) {
            console.warn('사양명(getElvCodeList) 로딩 실패:', e);
        }
    }

    // 호기 영업사양 로딩 (실패하면 계산식의 {특성코드} 는 치환하지 않고 그대로 둔다)
    async function loadSpecValues(hogi) {
        if (!hogi || hogi === specValuesHogi) return;
        try {
            const res = await fetch(SALES_API + encodeURIComponent(hogi), { headers: { Accept: 'application/json' } });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            // 응답: { "EL_EHP": "2200", "EL_ATYP": "WBLX1_(LXVF)", ... }
            const map = (await res.json()) || {};
            specValues.clear();
            Object.entries(map).forEach(([code, value]) => {
                const k = nvl(code).trim().toUpperCase();
                if (k && !specValues.has(k)) specValues.set(k, nvl(value).trim());
            });
            specValuesHogi = hogi;
            specInfo = specValues.size
                ? { text: `영업사양 ${specValues.size}건`, fail: false }
                : { text: '영업사양 0건 — 호기값 · 계산식 일부가 표시되지 않습니다', fail: true };
        } catch (e) {
            console.warn('영업사양(findElvSearchBySimul) 로딩 실패:', e);
            specInfo = { text: '영업사양 로딩 실패 — 호기값 · 계산식 일부가 표시되지 않습니다', fail: true };
        }
    }

    // 상단 안내: 현재 결과 · 걸린 시간 · 영업사양 로딩 결과
    function renderSourceInfo(sec) {
        let h = `현재 표시: ${esc(state.sourceLabel)}`;
        if (sec !== undefined) h += ` · ${sec}초`;
        if (specInfo.text) h += ` · <span class="${specInfo.fail ? 'warn' : ''}">${esc(specInfo.text)}</span>`;
        $('sourceInfo').innerHTML = h;
    }

    function resetFilterUI() {

    // GOTO 클릭 시 해당 ADDR 라인으로 스크롤
    function jumpToAddr(addr) {
        const idx = state.rows.findIndex((r) => nvl(r.ADDR) === addr);
        if (idx < 0) return alert(`ADDR '${addr}' 라인을 찾을 수 없습니다.`);
        let tr = rowEl(idx);
        if (!tr) {
            // 필터로 숨겨져 있으면 필터 해제 후 다시 그림
            resetFilterUI();
            renderTable();
            tr = rowEl(idx);
        }
        if (!tr) return;
        const offset = tr.getBoundingClientRect().top - area.getBoundingClientRect().top;
        area.scrollTop = area.scrollTop + offset - area.clientHeight / 3;
        selectRow(tr);
        tr.classList.remove('flash');
        void tr.offsetWidth;
        tr.classList.add('flash');
        area.focus({ preventScroll: true });
    }

    // ---------- API 호출 ----------
    async function run() {
        if (!$('hogi').value.trim() || !$('PID').value.trim()) {
            alert('호기와 PID는 필수입니다.');
            return;
        }
        const url = buildProxyUrl();
        const startedAt = performance.now();
        const btn = $('btnRun');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>실행 중';
        area.innerHTML = '<div class="msg">API 호출 중...</div>';
        if (isDrawerOpen()) closeDrawer();

        try {
            // 계산식 치환에 쓸 영업사양도 같이 받아 둔다 (실패해도 결과 조회는 진행)
            const [res] = await Promise.all([
                fetch(url, { method: 'GET', headers: { Accept: 'application/json' } }),
                loadSpecValues($('hogi').value.trim()),
            ]);
            if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
            const json = await res.json();
            // 서버는 PLM 호출 실패 시에도 빈 배열을 돌려주므로 따로 안내
            if (Array.isArray(json) && json.length === 0) {
                throw new Error('결과가 없습니다. 호기/PID를 확인하거나, 서버 로그에서 PLM API 응답을 확인하세요.');
            }
            loadRows(json, `API 결과 (${$('hogi').value.trim()} / ${$('PID').value.trim()})`);
            state.query = { hogi: $('hogi').value.trim(), PID: $('PID').value.trim() };
            renderSourceInfo(((performance.now() - startedAt) / 1000).toFixed(1));

            // 주소창에 파라미터 반영 (새로고침/공유 시 재사용)
            const qs = new URLSearchParams();
            PARAM_NAMES.forEach((n) => qs.set(n, getParam(n)));
            history.replaceState(null, '', `${location.pathname}?${qs}`);
        } catch (e) {
            console.error(e);
            $('toolbar').hidden = true;
            area.innerHTML = `<div class="msg error">API 호출 실패: ${esc(e.message)}</div>`;
             //   + '· 서버가 PLM(plmpro.hdel.co.kr)에 접속할 수 있는지(사내망) 확인하세요.\n'
             //   + '· PLM API URL을 브라우저에서 직접 열어 결과를 저장한 뒤 "JSON 파일 선택…"으로 볼 수 있습니다.\n\n'
             //   + `요청 URL: ${esc(url)}\n`
             //   + `PLM URL: ${esc(buildUrl())}</div>`;
        } finally {
            btn.disabled = false;
            btn.textContent = '실행';
        }
    }

    // ---------- 이벤트: 결과 테이블 (클릭 / 키보드 / 드래그 이동) ----------
    let suppressClick = false;
    area.addEventListener('click', (e) => {
        if (suppressClick) return;
        const callPid = e.target.closest('.call-pid[data-call-pid]');
        if (callPid) return openCallPid(callPid.dataset.callPid);
        const jump = e.target.closest('.jump[data-goto]');
        if (jump) return jumpToAddr(jump.dataset.goto);
        const tr = e.target.closest('tbody tr[data-idx]');
        if (tr) {
            const wasRowDetail = isDrawerOpen() && state.drawerMode === 'row';
            selectRow(tr);  // 라인 상세가 열려 있으면 selectRow 가 갱신
            if (!wasRowDetail) showRowDetail(Number(tr.dataset.idx));
        }
    });

    area.addEventListener('keydown', (e) => {
        const page = Math.max(1, Math.floor(area.clientHeight / 30) - 2);
        switch (e.key) {
            case 'ArrowDown': moveSelection(1); break;
            case 'ArrowUp': moveSelection(-1); break;
            case 'PageDown': moveSelection(page); break;
            case 'PageUp': moveSelection(-page); break;
            case 'Home': moveSelection(-Infinity); area.scrollLeft = 0; break;
            case 'End': moveSelection(Infinity); break;
            case 'Enter':
                if (state.selectedIdx >= 0) showRowDetail(state.selectedIdx);
                break;
            // 결과 테이블 확대/축소
            case '+': case '=': setZoom(tableZoom + ZOOM.step); break;
            case '-': setZoom(tableZoom - ZOOM.step); break;
            case '0': setZoom(1); break;
            default: return;  // ←/→ 는 브라우저 기본 가로 스크롤
        }
        e.preventDefault();
    });

    // 마우스 드래그로 테이블 좌우/상하 이동 (클릭과 구분: 5px 이상 움직이면 드래그)
    let drag = null;
    area.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('.jump, .call, .call-pid, a, button, input, select, textarea')) return;
        // 스크롤바 위에서 누른 경우는 브라우저 기본 동작
        if (e.offsetX > area.clientWidth || e.offsetY > area.clientHeight) return;
        drag = { x: e.clientX, y: e.clientY, sl: area.scrollLeft, st: area.scrollTop, moved: false };
    });
    window.addEventListener('mousemove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 5) {
            drag.moved = true;
            area.classList.add('dragging');
            window.getSelection().removeAllRanges();
        }
        if (drag.moved) {
            area.scrollLeft = drag.sl - dx;
            area.scrollTop = drag.st - dy;
            e.preventDefault();
        }
    });
    window.addEventListener('mouseup', () => {
        if (drag && drag.moved) {
            suppressClick = true;
            setTimeout(() => { suppressClick = false; }, 0);
        }
        area.classList.remove('dragging');
        drag = null;
    });


    // ---------- 결과 테이블 확대/축소 — 배율은 브라우저에 기억 ----------
    const ZOOM = { min: 0.5, max: 2, step: 0.1, key: 'pidSimul.tableZoom' };
    let tableZoom = 1;

    function setZoom(z, save = true) {
        tableZoom = Math.round(Math.min(ZOOM.max, Math.max(ZOOM.min, z)) * 10) / 10;
        document.documentElement.style.setProperty('--table-zoom', tableZoom);
        $('zoomLevel').textContent = `${Math.round(tableZoom * 100)}%`;
        $('btnZoomOut').disabled = tableZoom <= ZOOM.min;
        $('btnZoomIn').disabled = tableZoom >= ZOOM.max;
        // 배율이 바뀌어도 선택한 라인은 화면 안에 두기
        const tr = rowEl(state.selectedIdx);
        if (tr) scrollRowIntoView(tr);
        if (!save) return;
        try { localStorage.setItem(ZOOM.key, String(tableZoom)); } catch (e) { /* 무시 */ }
    }

    $('btnZoomOut').addEventListener('click', () => setZoom(tableZoom - ZOOM.step));
    $('btnZoomIn').addEventListener('click', () => setZoom(tableZoom + ZOOM.step));
    $('zoomLevel').addEventListener('click', () => setZoom(1));
    // Ctrl + 휠: 결과 영역 위에서는 브라우저 전체 확대 대신 테이블만 확대/축소
    area.addEventListener('wheel', (e) => {
        if (!e.ctrlKey) return;
        e.preventDefault();
        setZoom(tableZoom + (e.deltaY < 0 ? ZOOM.step : -ZOOM.step));
    }, { passive: false });

    try { setZoom(Number(localStorage.getItem(ZOOM.key)) || 1, false); } catch (e) { setZoom(1, false); }

    // ---------- 이벤트: 상세 패널 ----------
    $('btnCloseDrawer').addEventListener('click', closeDrawer);
    $('drawerBody').addEventListener('click', (e) => {
        const callPid = e.target.closest('.call-pid[data-call-pid]');
        if (callPid) openCallPid(callPid.dataset.callPid);
    });
    $('btnPrevRow').addEventListener('click', () => { moveSelection(-1); area.focus({ preventScroll: true }); });
    $('btnNextRow').addEventListener('click', () => { moveSelection(1); area.focus({ preventScroll: true }); });

    // 상세 패널 폭 조절 (드래그) — 폭은 브라우저에 기억
    (function initResizer() {
        const KEY = 'pidSimul.drawerWidth';
        try {
            const w = Number(localStorage.getItem(KEY));
            if (w) document.documentElement.style.setProperty('--drawer-w', `${w}px`);
        } catch (e) { /* 저장소 사용 불가 시 기본 폭 */ }

        const resizer = $('resizer');
        let resizing = false;
        resizer.addEventListener('mousedown', (e) => {
            resizing = true;
            resizer.classList.add('active');
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!resizing) return;
            const w = Math.max(300, Math.min(window.innerWidth * 0.7, window.innerWidth - e.clientX));
            document.documentElement.style.setProperty('--drawer-w', `${Math.round(w)}px`);
        });
        window.addEventListener('mouseup', () => {
            if (!resizing) return;
            resizing = false;
            resizer.classList.remove('active');
            document.body.style.userSelect = '';
            try {
                localStorage.setItem(KEY, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--drawer-w'), 10));
            } catch (e) { /* 무시 */ }
        });
    })();

    // ---------- 전역 단축키 ----------
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (isDrawerOpen()) closeDrawer();
            return;
        }
        // '/' → 검색창 (입력 중이 아닐 때)
        const typing = e.target.closest && e.target.closest('input, textarea, select');
        if (e.key === '/' && !typing && !$('toolbar').hidden) {
            e.preventDefault();
            $('keyword').focus();
            $('keyword').select();
        }
    });

    // ---------- 초기화: 페이지 URL 파라미터가 있으면 자동 실행 ----------
    (function init() {
        const params = new URLSearchParams(location.search);
        let hasParam = false;
        PARAM_NAMES.forEach((n) => {
            if (params.has(n)) {
                setParam(n, params.get(n));
                hasParam = true;
            }
        });
        // 추가 조건에 값이 있으면 펼쳐서 보여줌
        if (['isfloor', 'floor', 'type'].some((n) => getParam(n))) setAdvOpen(true);
        loadSpecNames();
        if (hasParam && $('hogi').value && $('PID').value) run();
        else $('hogi').focus();
    })();
</script>
</body>
</html>
