<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>특성코드 사전</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --border: #d9dee5;
            --text: #1f2933;
            --muted: #6b7785;
            --primary: #2563eb;
            --hit-bg: #fef9c3;
            --used-bg: #e7f6ec;
            --used-strong: #1f9d55;
            --warn: #c2410c;
        }

        * { box-sizing: border-box; }

        /* 화면 높이에 고정, 스크롤은 목록 영역 하나만 */
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        button {
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            color: var(--text);
        }
        button:hover { background: #f1f5f9; }

        /* ===== 상단: 제목 + 검색 ===== */
        header {
            flex: none;
            background: #1e293b;
            color: #fff;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        header h1 { margin: 0; font-size: 16px; white-space: nowrap; }
        #pidInfo { color: #93c5fd; font-size: 12px; }
        .head-spacer { flex: 1; }
        header button { border-color: #475569; background: #334155; color: #fff; }
        header button:hover { background: #475569; }
        #search {
            flex: 1;
            min-width: 240px;
            padding: 8px 10px;
            border: 1px solid #475569;
            border-radius: 5px;
            font-size: 13px;
            background: #0f172a;
            color: #fff;
        }
        #search:focus { outline: 2px solid #60a5fa; border-color: #60a5fa; }
        .hint { color: #94a3b8; font-size: 12px; white-space: nowrap; }

        /* ===== 목록 ===== */
        main {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 12px 16px 24px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .section-title .cnt { color: var(--muted); font-weight: normal; font-size: 12px; }
        .section-title .tools { margin-left: auto; display: flex; gap: 6px; }
        .section + .section { margin-top: 22px; }

        .msg { padding: 18px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--border); border-radius: 6px; }
        .msg.error { color: #d64545; white-space: pre-line; text-align: left; }

        details.grp {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 6px;
        }
        details.grp.missing { border-style: dashed; }
        details.grp > summary {
            list-style: none;
            cursor: pointer;
            padding: 7px 10px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        details.grp > summary::-webkit-details-marker { display: none; }
        details.grp > summary::before { content: '▸'; color: var(--muted); width: 10px; }
        details.grp[open] > summary::before { content: '▾'; }
        details.grp[open] > summary { border-bottom: 1px solid #e5e8ec; }
        .code { font-weight: bold; color: #334155; font-family: Consolas, monospace; }
        .name { font-weight: bold; }
        .meta { color: var(--muted); font-size: 12px; }
        .missing .meta { color: var(--warn); }
        .used { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
        .used-chip {
            padding: 0 6px;
            border-radius: 3px;
            border: 1px solid #86d3a0;
            background: var(--used-bg);
            color: var(--used-strong);
            font-size: 12px;
            line-height: 18px;
        }

        table.vals { width: 100%; border-collapse: collapse; }
        table.vals th, table.vals td {
            padding: 4px 10px;
            border-bottom: 1px solid #eef0f3;
            text-align: left;
            vertical-align: top;
            word-break: break-all;
        }
        table.vals th { background: #f8fafc; color: var(--muted); font-weight: normal; font-size: 12px; }
        table.vals td.v { width: 35%; font-family: Consolas, monospace; }
        table.vals tr.used-row td { background: var(--used-bg); }
        table.vals tr.used-row td.v { color: var(--used-strong); font-weight: bold; }
        mark { background: var(--hit-bg); color: inherit; padding: 0; }

        .more { color: var(--muted); font-size: 12px; padding: 6px 2px; }
    </style>
</head>
<body>

<header>
    <div class="head-row">
        <h1>특성코드 사전</h1>
        <span id="pidInfo"></span>
        <div class="head-spacer"></div>
        <button type="button" id="btnSync" title="시뮬레이터 화면의 현재 결과를 다시 읽어옵니다">PID 결과 다시 읽기</button>
    </div>
    <div class="head-row">
        <input type="search" id="search" placeholder="특성코드 / 한글명 / 값 / 설명 검색 ( / )" autocomplete="off">
        <span class="hint" id="searchHint"></span>
    </div>
</header>

<main id="list">
    <div class="msg">특성코드를 불러오는 중...</div>
</main>

<script>
    const CODE_API = '/api/getCodeList?key=subae';
    // 검색 결과(PID 외 특성)는 너무 많으면 화면이 느려지므로 상한을 둔다
    const MAX_OTHER = 50;
    // 이 개수 이하일 때만 값 목록을 펼친 상태로 보여줌
    const AUTO_OPEN = 15;

    const $ = (id) => document.getElementById(id);
    const state = {
        groups: new Map(),   // 특성코드(대문자) -> { code, name, values: [{ v, d }], text }
        pid: null,           // 시뮬레이터 결과 요약 { label, specs: [{ code, count, cons }] }
        loaded: false,
        error: '',
    };

    // ---------- 유틸 ----------
    function esc(v) {
        if (v === null || v === undefined) return '';
        return String(v)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    const nvl = (v) => (v === null || v === undefined ? '' : String(v).trim());
    const keyOf = (code) => nvl(code).toUpperCase();

    // 검색어 강조 (대소문자 무시)
    function hl(text, q) {
        const s = nvl(text);
        if (!q) return esc(s);
        const i = s.toLowerCase().indexOf(q);
        if (i < 0) return esc(s);
        return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
    }

    // CON 값은 'A,B' 처럼 여러 개일 수 있으므로 나눠서 비교
    const splitCons = (cons) => new Set(
        cons.flatMap((c) => nvl(c).split(/[,|]/)).map((c) => c.trim().toUpperCase()).filter(Boolean));

    // ---------- 데이터 ----------
    // getCodeList 결과는 (특성코드, 값) 단위 행 → 특성코드별로 묶는다
    function buildGroups(list) {
        const groups = new Map();
        (list || []).forEach((r) => {
            const k = keyOf(r.code);
            if (!k) return;
            let g = groups.get(k);
            if (!g) {
                g = { code: nvl(r.code), name: nvl(r.codeName), values: [], seen: new Set() };
                groups.set(k, g);
            }
            const v = nvl(r.typeName), d = nvl(r.typeVal);
            const vk = `${v}\u0000${d}`;
            if ((v || d) && !g.seen.has(vk)) {
                g.seen.add(vk);
                g.values.push({ v, d });
            }
        });
        groups.forEach((g) => {
            delete g.seen;
            g.text = [g.code, g.name, ...g.values.flatMap((x) => [x.v, x.d])].join(' ').toLowerCase();
        });
        return groups;
    }

    async function loadMaster() {
        try {
            const res = await fetch(CODE_API, { headers: { Accept: 'application/json' } });
            if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
            state.groups = buildGroups(await res.json());
            if (!state.groups.size) throw new Error('특성코드 마스터가 비어 있습니다. (서버 기동 시 로딩 실패 여부를 확인하세요)');
            state.loaded = true;
        } catch (e) {
            console.error(e);
            state.error = `특성코드를 불러오지 못했습니다: ${e.message}\n요청 URL: ${CODE_API}`;
        }
        render();
    }

    // 시뮬레이터 화면(opener)에서 현재 결과의 SPEC 목록을 읽어옴
    function readFromOpener() {
        try {
            const op = window.opener;
            if (op && !op.closed && typeof op.getPidSpecSummary === 'function') return op.getPidSpecSummary();
        } catch (e) { /* 다른 출처이거나 닫힘 */ }
        return null;
    }

    // 시뮬레이터에서 재실행 시 호출됨
    window.syncFromOpener = function () {
        state.pid = readFromOpener();
        const p = state.pid;
        $('pidInfo').textContent = p && p.specs.length
            ? `기준: ${p.label} · SPEC ${p.specs.length}종`
            : '시뮬레이터 실행 결과 없음 — 검색으로 조회하세요';
        render();
    };

    // ---------- 렌더링 ----------
    function groupCard(g, opts) {
        const { q, open, used } = opts;
        const consSet = used ? splitCons(used.cons) : new Set();

        let usedHtml = '';
        if (used) {
            const cons = [...new Set(used.cons.map(nvl).filter(Boolean))];
            usedHtml = '<span class="used" title="이 PID의 조건(CON)에 사용된 값">'
                + cons.map((c) => `<span class="used-chip">${esc(c)}</span>`).join('') + '</span>';
        }

        if (!g) {
            // PID에는 있지만 마스터에 없는 SPEC
            return `<details class="grp missing"><summary><span class="code">${hl(used.code, q)}</span>`
                + `<span class="meta">특성코드 마스터에 없음 · ${used.count}라인</span>${usedHtml}</summary>`
                + '<div class="more" style="padding:8px 12px">값 정보가 없습니다.</div></details>';
        }

        const meta = `값 ${g.values.length}개` + (used ? ` · ${used.count}라인` : '');
        let rows = '';
        g.values.forEach((x) => {
            const isUsed = consSet.has(x.v.toUpperCase()) || consSet.has(x.d.toUpperCase());
            rows += `<tr${isUsed ? ' class="used-row" title="이 PID 조건에 사용된 값"' : ''}>`
                + `<td class="v">${hl(x.v, q)}</td><td>${hl(x.d, q)}</td></tr>`;
        });
        const body = g.values.length
            ? `<table class="vals"><thead><tr><th>값</th><th>설명</th></tr></thead><tbody>${rows}</tbody></table>`
            : '<div class="more" style="padding:8px 12px">등록된 값이 없습니다.</div>';

        return `<details class="grp"${open ? ' open' : ''}><summary>`
            + `<span class="code">${hl(g.code, q)}</span><span class="name">${hl(g.name, q)}</span>`
            + `<span class="meta">${meta}</span>${usedHtml}</summary>${body}</details>`;
    }

    function sectionHead(title, cnt, tools) {
        return `<div class="section-title">${title}<span class="cnt">${cnt}</span>`
            + (tools ? '<span class="tools"><button type="button" data-act="open">모두 펼치기</button>'
                + '<button type="button" data-act="close">모두 접기</button></span>' : '')
            + '</div>';
    }

    function render() {
        const list = $('list');
        if (state.error) {
            list.innerHTML = `<div class="msg error">${esc(state.error)}</div>`;
            return;
        }
        if (!state.loaded) return;

        const q = $('search').value.trim().toLowerCase();
        const specs = (state.pid && state.pid.specs) || [];
        const pidKeys = new Set(specs.map((s) => keyOf(s.code)));

        // ① 이 PID의 SPEC — 항상 먼저 표시 (검색어가 있으면 그 안에서 필터)
        const pidItems = specs.filter((s) => {
            if (!q) return true;
            const g = state.groups.get(keyOf(s.code));
            const text = g ? g.text : s.code.toLowerCase();
            return text.includes(q) || s.cons.some((c) => nvl(c).toLowerCase().includes(q));
        });

        let h = '<section class="section">';
        h += sectionHead('이 PID에서 사용한 특성', q ? `${pidItems.length} / ${specs.length}종` : `${specs.length}종`, pidItems.length > 0);
        if (!specs.length) {
            h += '<div class="msg">시뮬레이터에서 실행한 결과가 없습니다. 아래 검색으로 전체 특성코드를 찾을 수 있습니다.</div>';
        } else if (!pidItems.length) {
            h += '<div class="msg">검색어와 일치하는 특성이 없습니다.</div>';
        } else {
            const open = pidItems.length <= AUTO_OPEN;
            pidItems.forEach((s) => { h += groupCard(state.groups.get(keyOf(s.code)), { q, open, used: s }); });
        }
        h += '</section>';

        // ② 나머지 특성코드 — 검색했을 때만 표시 (종류가 많음)
        h += '<section class="section">';
        if (!q) {
            h += sectionHead('전체 특성코드', `${state.groups.size}종`, false);
            h += '<div class="msg">나머지 특성코드는 위 검색창에 코드 / 한글명 / 값으로 검색하세요.</div>';
        } else {
            const others = [];
            state.groups.forEach((g, k) => { if (!pidKeys.has(k) && g.text.includes(q)) others.push(g); });
            // 코드/한글명에 직접 걸린 것을 값·설명에 걸린 것보다 먼저
            const direct = (g) => (g.code.toLowerCase().includes(q) || g.name.toLowerCase().includes(q) ? 0 : 1);
            others.sort((a, b) => direct(a) - direct(b) || a.code.localeCompare(b.code));

            const shown = others.slice(0, MAX_OTHER);
            h += sectionHead('그 외 특성코드 검색 결과', `${others.length}종`, shown.length > 0);
            if (!others.length) {
                h += '<div class="msg">검색 결과가 없습니다.</div>';
            } else {
                const open = shown.length <= AUTO_OPEN;
                shown.forEach((g) => { h += groupCard(g, { q, open }); });
                if (others.length > MAX_OTHER) {
                    h += `<div class="more">외 ${others.length - MAX_OTHER}종 더 있음 — 검색어를 더 구체적으로 입력하세요.</div>`;
                }
            }
        }
        h += '</section>';

        list.innerHTML = h;
        $('searchHint').textContent = q ? '' : 'Esc: 검색어 지우기';
    }

    // ---------- 이벤트 ----------
    let timer;
    $('search').addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(render, 150);
    });
    $('search').addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && e.target.value) {
            e.preventDefault();
            e.target.value = '';
            render();
        }
    });
    $('btnSync').addEventListener('click', window.syncFromOpener);

    // 섹션별 모두 펼치기/접기
    $('list').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-act]');
        if (!b) return;
        const open = b.dataset.act === 'open';
        b.closest('.section').querySelectorAll('details.grp').forEach((d) => { d.open = open; });
    });

    // '/' → 검색창
    document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== $('search')) {
            e.preventDefault();
            $('search').focus();
            $('search').select();
        }
    });

    // ---------- 초기화 ----------
    window.syncFromOpener();
    $('search').focus();
    loadMaster();
</script>
</body>
</html>
